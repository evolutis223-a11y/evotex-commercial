<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>EVOTEX 1.0 — Gestion du Projet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="../css/tokens.css">
<!-- Espace Commercial (hub public + ses 4 outils) -- retour du 16/09/2026 :
     "elle n'a sa place nulle part ailleurs que dans le projet... redévelopper
     les codes pour que la page de négociation les puisse directement dans la
     page". Ce sont les VRAIS fichiers de evotex-commercial/index.html, partagés
     tels quels (jamais dupliqués) -- le hub reste par ailleurs public à la
     racine du site pour les clients/partenaires à qui on envoie le lien. -->
<link rel="stylesheet" href="../css/hub.css">
<link rel="stylesheet" href="../css/presentation.css">
<link rel="stylesheet" href="../css/socle.css">
<link rel="stylesheet" href="../css/besoins.css">
<link rel="stylesheet" href="../css/licences.css">
<link rel="stylesheet" href="../css/tour-application.css">
<script src="../js/hub.js"></script>
<script src="../js/presentation.js"></script>
<script src="../js/socle-lancement.js"></script>
<script src="../js/besoins.js"></script>
<script src="../js/licences.js"></script>
<script src="../js/tour-application.js"></script>
<!-- QR code des documents de facturation -- généré entièrement dans le
     navigateur, aucune donnée client n'est envoyée à un service externe. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* <html> hérite du fond bleu marine du site public (tokens.css, pensé
     pour les pages sombres) -- jamais corrigé ici, alors que cette page est
     claire : un rebond de défilement (ou un sous-pixel d'arrondi) laisse
     entrevoir cette bande sombre sous la page (retour du 14/09/2026 :
     "quelle est cette bande noire en dessous de la page ?"). */
  html { background: #eef3fa; }
  body { min-height: 100vh; background: #eef3fa; }
  .g-shell { display: flex; flex-direction: column; min-height: 100vh; }
  /* En-tête, barre latérale et colonne de tchat fixes -- retour du
     14/09/2026 : "l'en-tête doit être fixe, les menus doivent être fixes".
     La coquille tient exactement la hauteur de l'écran et SEULE la zone
     interne (scène) défile.
     Retour du 16/09/2026 : la barre latérale gauche descend désormais SOUS
     l'en-tête au lieu d'occuper toute la hauteur de l'écran à côté de lui --
     même principe que la colonne latérale de droite (Tchat/Notes/Échanges),
     pour donner un en-tête pleine largeur totalement stable. L'en-tête garde
     toujours la même forme, quoi qu'il se passe dans la zone en dessous.
     Retour de l'utilisateur du 14/09/2026 : ce même blocage s'applique
     désormais aussi en mobile ("je veux bloquer l'en-tête... et le pied de
     page non plus") -- avant, en dessous de 701px, la page défilait
     naturellement ; ce n'était qu'une préférence antérieure, explicitement
     remplacée ici. Plus de seuil : la règle s'applique à toutes les
     tailles. */
  html, body { height: 100%; }
  body { overflow: hidden; }
  .g-shell { height: 100vh; overflow: hidden; }

  /* ---- Sidebar rétractable (nav de l'Espace de Travail) ---- */
  .g-sidebar { width: 216px; flex-shrink: 0; position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--evx-navy-deep) 0%, var(--evx-navy) 100%);
    padding: 18px 14px; display: flex; flex-direction: column; transition: width 0.18s ease; }
  .g-sidebar::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(340px 260px at 15% 0%, rgba(63,150,234,0.30), transparent),
      radial-gradient(300px 240px at 100% 90%, rgba(63,150,234,0.16), transparent); }
  .g-sidebar > * { position: relative; z-index: 1; }
  .g-sidebar.-repliee { width: 64px; padding: 18px 10px; }
  .g-sidebar.-masquee { display: none; }
  .g-sidebar-top { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 18px; }
  .g-sidebar-titre { font-family: var(--font-display); font-weight: 900; font-size: 12.5px; letter-spacing: 0.5px; color: var(--evx-onDark-label); white-space: nowrap; overflow: hidden; }
  .g-sidebar.-repliee .g-sidebar-titre { display: none; }
  .g-toggle-sidebar { flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06); color: #fff; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .g-nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; font-size: 13px; font-weight: 700;
    color: var(--evx-onDark-secondary); cursor: pointer; background: none; border: none; text-align: left; width: 100%; font-family: var(--font-body); margin-bottom: 4px; white-space: nowrap; overflow: hidden; }
  .g-nav-icone { flex-shrink: 0; display: flex; width: 18px; height: 18px; }
  .g-sidebar.-repliee .g-nav-item { justify-content: center; padding: 10px 0; }
  .g-sidebar.-repliee .g-nav-item .g-nav-label, .g-sidebar.-repliee .g-nav-tag { display: none; }
  .g-nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .g-nav-item.-actif { background: rgba(63,150,234,0.18); color: #fff; box-shadow: inset 2px 0 0 var(--evx-blue-light); }
  .g-nav-item.-bientot { opacity: 0.5; cursor: default; }
  .g-nav-item.-bientot:hover { background: none; color: var(--evx-onDark-secondary); }
  .g-nav-tag { margin-left: auto; font-size: 9px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; background: rgba(255,255,255,0.1); padding: 2px 7px; border-radius: 999px; }
  .g-sidebar-bas { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.1); }
  .g-sidebar-user { font-size: 12px; color: var(--evx-onDark-secondary); padding: 0 10px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-sidebar.-repliee .g-sidebar-user { display: none; }
  .g-sidebar-bas button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22);
    color: #fff; border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font-body); white-space: nowrap; overflow: hidden; }
  .g-sidebar.-repliee .g-sidebar-bas button { padding: 8px 0; }
  .g-sidebar.-repliee .g-sidebar-bas button .g-btn-label { display: none; }

  /* ---- Hamburger + menu déroulant vertical de la barre latérale
     (< 768px) -- masqués/neutres au-delà de ce seuil, activés uniquement
     dans le @media plus bas. Retour testeurs du 14/09/2026, précisé ensuite
     par l'utilisateur en 2 temps : (1) menu plein écran qui descend
     verticalement, se referme automatiquement à la sélection, "comme dans
     les téléphones mobiles" ; (2) le déclencheur doit vivre DANS le bandeau
     d'en-tête (.g-hero), au même niveau que le titre de la négociation --
     jamais une barre séparée au-dessus. Réinjecté par JS (voir
     injecterHamburger()) dans le .g-hero fraîchement rendu à chaque
     changement de panneau, quelle que soit sa structure interne (variantes
     .g-hero-top / .g-hero-titre-simple) -- positionné en absolu par rapport
     à .g-hero lui-même, qui reste le seul point commun à tous les panneaux. */
  .g-btn-hamburger { display: none; width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.1); color: #fff; font-size: 17px; cursor: pointer; align-items: center; justify-content: center; padding: 0; }
  .g-btn-hamburger:hover { background: rgba(255,255,255,0.2); }

  /* Mur de bascule de rôle -- réservé à la Direction, permanent, sous le
     bloc de titre (jamais au-dessus) -- retour du 16/09/2026, calqué sur le
     mur de Batexci. Fond blanc (retour : "les couleurs bleues sont trop
     sombres, pas visibles... mets assez de blanc pour qu'on voie ce qui est
     dedans") ; un bouton passe entièrement au vert dès que la personne est
     en ligne -- pas juste une pastille. Aucun titre "Changer de rôle" --
     retiré à la demande ("je n'ai pas besoin de tout ça, laisse-moi
     utiliser cet espace"). */
  /* Retour du 16/09/2026 : "agrandis-moi cet espace... multiplie par deux
     l'espace de cet écran" -- doublé (fond, pastilles, texte), formule à
     revoir quand le nombre de personnes grandira. */
  .g-role-mur { background: linear-gradient(160deg, #ffffff, #eef4fb); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
  .g-sidebar.-repliee .g-role-mur { display: none; }
  .g-role-mur-liste { display: flex; flex-wrap: wrap; gap: 10px; }
  .g-role-pill { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; border-radius: 12px; border: 1px solid #c3d6ee;
    background: #fff; color: var(--evx-blue); font-family: var(--font-body); padding: 10px 16px; cursor: pointer; text-align: left; }
  .g-role-pill:hover { background: #f5f9ff; }
  .g-role-pill-nom { font-size: 14px; font-weight: 800; line-height: 1.3; }
  .g-role-pill-role { font-size: 11px; font-weight: 600; opacity: 0.75; line-height: 1.25; }
  .g-role-pill.-actif { box-shadow: 0 0 0 2px var(--evx-navy); }
  .g-role-pill.-en-ligne { background: #22c55e; border-color: #22c55e; color: #fff; }
  .g-role-pill.-en-ligne:hover { background: #1ea34e; }

  /* ---- Bandeau supérieur compact : identité + étapes + équipe + ticket + icônes de panneaux ---- */
  .g-hero { position: relative; flex-shrink: 0;
    background: linear-gradient(180deg, var(--evx-navy-deep) 0%, var(--evx-navy) 100%);
    color: #fff; padding: 16px 24px 16px; }
  .g-hero::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(900px 420px at 85% -20%, rgba(63,150,234,0.30), transparent); }
  .g-hero > * { position: relative; z-index: 1; }
  .g-hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .g-select-nego select { font-size: 12px; padding: 5px 9px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: #fff; font-family: var(--font-body); margin-bottom: 8px; }
  /* Titre -- retour de l'utilisateur du 14/09/2026 : ne doit JAMAIS passer à
     la ligne, quitte à réduire la police (voir @media plus bas) ; ampoule et
     badge ticket (côté client) restent toujours pleinement visibles à côté
     (flex-shrink:0), seul le NOM lui-même (.g-nego-nom-texte) s'abrège en
     dernier recours (ellipsis) si même la police réduite ne suffit pas. */
  .g-nego-nom { display: flex; align-items: center; gap: 6px; min-width: 0; font-family: var(--font-display); font-size: 18px; font-weight: 900; }
  .g-nego-nom-texte { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 24px; }
  .g-nego-nom .evx-retour { flex-shrink: 0; }
  .g-nego-sous { font-size: 11.5px; color: var(--evx-onDark-secondary); margin-top: 2px; }

  .g-hero-droite { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Rappel discret du projet/client avant la plaque -- retour du 16/09/2026 */
  .g-equipe-nego-nom { font-size: 10px; font-weight: 800; color: var(--evx-onDark-label); text-transform: uppercase;
    letter-spacing: 0.4px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  /* Plaque d'équipe + badge ticket, jamais séparés (point 1, retour de
     l'utilisateur du 14/09/2026) -- tiennent déjà sur une ligne en pratique
     (vérifié), flex-wrap:wrap en simple filet de sécurité si jamais une
     équipe nombreuse dépassait la largeur dispo. PAS overflow-x:auto ici,
     contrairement à .g-etapes plus bas : la spec CSS force overflow-y à
     'auto' dès que overflow-x ne vaut pas 'visible' (impossible d'avoir
     l'un en scroll et l'autre en visible) -- ça découpait silencieusement
     le popover du ticket (.g-ticket-panel, ancré ici, plus haut que cette
     ligne). Bug réel trouvé le 15/09/2026 en auditant toute l'appli en
     mobile : le popover "Ticket de négociation" n'apparaissait plus du
     tout au clic -- wrap plutôt que scroll évite le problème entièrement. */
  .g-hero-ligne-equipe { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 100%; }
  /* Plaque Équipe compacte */
  .g-equipe-plaque { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); border-radius: 999px; padding: 5px; }
  .g-membre-pastille { position: relative; width: 26px; height: 26px; border-radius: 999px; cursor: pointer; border: 1.5px solid rgba(255,255,255,0.3); overflow: hidden; }
  .g-membre-pastille img { width: 100%; height: 100%; object-fit: cover; }
  .g-membre-avatar { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--evx-blue); color: #fff; font-size: 10.5px; font-weight: 800; }
  .g-presence-dot { position: absolute; bottom: -1px; right: -1px; width: 8px; height: 8px; border-radius: 999px; border: 1.5px solid var(--evx-navy); background: #64748b; }
  .g-presence-dot.-en-ligne { background: #22c55e; }
  .g-membre-pastille.-inactif { opacity: 0.4; }
  .g-btn-ajouter-membre { width: 26px; height: 26px; border-radius: 999px; border: 1px dashed rgba(255,255,255,0.4); background: none; color: #fff; cursor: pointer; font-size: 14px; line-height: 1; }
  /* Petit bouton "Vue Client" / "Revenir à ma vue" -- retour du 16/09/2026 :
     "un petit bouton presque invisible, pas de gros bouton". */
  .g-btn-mini-vue { font-size: 10.5px; font-weight: 700; color: var(--evx-onDark-secondary); background: none;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-family: var(--font-body); white-space: nowrap; flex-shrink: 0; }
  .g-btn-mini-vue:hover { color: #fff; border-color: rgba(255,255,255,0.5); }

  /* Pastille Ticket / chrono -- retour de l'utilisateur du 14/09/2026 : sur
     la même ligne que la rangée des membres, juste derrière, avec un texte
     qui s'abrège selon la largeur (bureau : "Expiré depuis 11h 43min" ;
     tablette : "-11h43" ; mobile étroit : "-11h") pour que les deux tiennent
     toujours sur une seule ligne. Les 3 variantes sont posées en même temps
     dans le DOM (par rendreTicketPill() ET actualiserChrono(), qui les
     tient à jour à chaque tick) -- seul le CSS choisit laquelle s'affiche. */
  .g-ticket-texte-large, .g-ticket-texte-tablette, .g-ticket-texte-mobile { display: none; }
  @media (min-width: 769px) { .g-ticket-texte-large { display: inline; } }
  @media (max-width: 768px) and (min-width: 481px) { .g-ticket-texte-tablette { display: inline; } }
  @media (max-width: 480px) { .g-ticket-texte-mobile { display: inline; } }
  .g-ticket-wrap { position: relative; flex-shrink: 0; }
  .g-ticket-pill { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff; font-size: 11.5px; font-weight: 800;
    cursor: pointer; font-family: var(--font-body); white-space: nowrap; }
  .g-ticket-pill .puce { width: 7px; height: 7px; border-radius: 999px; background: #94a3b8; flex-shrink: 0; }
  /* Fond blanc plein (plus de bleu/rouge translucide sur fond bleu nuit,
     illisible) -- retour du 14/09/2026 : "le fond en blanc pour qu'on voit
     bien le bouton". Texte bleu pour le décompte normal, rouge pour l'alarme
     d'expiration -- deux états qu'on doit pouvoir distinguer d'un coup d'œil. */
  .g-ticket-pill.-actif { border-color: var(--evx-blue); background: #fff; color: var(--evx-blue); }
  .g-ticket-pill.-actif .puce { background: var(--evx-blue); box-shadow: 0 0 0 3px rgba(28,111,217,0.25); }
  .g-ticket-pill.-verrouille { border-color: #dc2626; background: #fff; color: #dc2626; }
  .g-ticket-pill.-verrouille .puce { background: #dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.25); }
  /* "Clôturée" -- retour de l'utilisateur du 14/09/2026 : restait sur le
     fond translucide par défaut (illisible sur le bleu nuit, comme les deux
     autres états avant leur propre correctif) -- rouge plein, texte blanc,
     bien identifiable comme un état définitif/terminé. */
  .g-ticket-pill.-cloturee { border-color: #dc2626; background: #dc2626; color: #fff; }
  .g-ticket-pill.-cloturee .puce { background: #fff; }
  .g-ticket-panel { position: absolute; top: 40px; right: 0; width: 240px; background: #fff; border-radius: 12px; border: 1px solid #d7e4f5;
    box-shadow: 0 20px 50px rgba(8,16,30,0.35); color: #101828; z-index: 45; overflow: hidden; padding: 14px; }
  .g-ticket-panel h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin: 0 0 10px; }
  .g-ticket-panel .g-ticket-etat { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
  .g-ticket-panel .g-ticket-etat.-verrouille { color: #b91c1c; }
  .g-ticket-panel .g-ticket-etat.-actif { color: var(--evx-blue); }
  .g-ticket-panel .g-hint { margin-top: 0; margin-bottom: 10px; }
  .g-ticket-durees { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .g-ticket-durees button { font-size: 11.5px; font-weight: 700; padding: 7px 6px; border-radius: 8px; border: 1px solid #c3d6ee; background: #f5f9ff; color: var(--evx-blue); cursor: pointer; font-family: var(--font-body); }
  .g-ticket-durees button:hover { background: #e9f1fc; }

  /* Icônes de panneaux (notifications, tchat client, notes) */
  .g-icone-wrap { position: relative; flex-shrink: 0; }
  .g-icone-bouton { width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08);
    color: #fff; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; position: relative; }
  .g-icone-bouton.-actif { background: var(--evx-blue-light); border-color: var(--evx-blue-light); }
  /* Bascule "voir comme" -- retour de l'utilisateur du 14/09/2026 : "choisis
     une couleur visible" -- même bleu déjà utilisé pour les états actifs
     (.-actif ci-dessus), pour rester dans la palette existante plutôt que
     d'en introduire une nouvelle, tout en tranchant nettement sur le bleu
     nuit du bandeau. */
  .g-icone-bouton.-bascule-vue { background: var(--evx-blue-light); border-color: var(--evx-blue-light); }
  .g-icone-bouton .pastille { position: absolute; top: -2px; right: -2px; width: 9px; height: 9px; border-radius: 999px; background: #f0a860; border: 2px solid var(--evx-navy); }
  /* Ampoule "Conseil" déplacée collée au nom de la négociation -- retour de
     l'utilisateur du 14/09/2026 (libère le cluster membres/ticket à droite).
     .g-icone-wrap reste le même composant (position:relative pour ancrer le
     popover), juste rendu inline et réduit pour tenir dans le fil du titre. */
  .g-icone-wrap.-inline-titre { flex-shrink: 0; }
  .g-icone-bouton.-mini { width: 22px; height: 22px; font-size: 12px; }
  /* Badge ticket inline dans le titre (côté client, point 1) -- même
     composant que .g-hero-ligne-equipe, juste plus compact et sans marge
     propre (le gap de .g-nego-nom s'en charge). */
  .g-ticket-wrap.-inline-titre .g-ticket-pill { height: 26px; padding: 0 10px; }
  .g-membre-menu { position: absolute; top: 34px; left: 0; right: auto; width: 200px; background: #fff; border-radius: 12px; border: 1px solid #d7e4f5;
    box-shadow: 0 20px 50px rgba(8,16,30,0.35); color: #101828; z-index: 45; overflow: hidden; padding: 8px; }
  .g-membre-menu-nom { font-size: 12.5px; font-weight: 800; padding: 4px 8px 8px; border-bottom: 1px solid #eef1f6; margin-bottom: 4px; }
  .g-membre-menu button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 7px 8px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: #1e293b; cursor: pointer; font-family: var(--font-body); }
  .g-membre-menu button:hover { background: #f5f9ff; }
  .g-membre-menu button.-danger { color: #b91c1c; }

  /* File d'étapes -- le guide, toujours visible, navigable dans le désordre.
     Retour de l'utilisateur du 14/09/2026 : défilante horizontalement plutôt
     que de passer à la ligne -- même pattern que .g-bande-outils (Échange de
     Fichiers/Outils de Négociation), pas une nouvelle invention : juste
     flex-wrap: nowrap pour activer l'overflow-x déjà posé ci-dessous.
     .g-etapes-ligne regroupe la frise et l'œil du client sur une seule
     ligne (point 4) -- la frise prend toute la place restante et défile,
     l'œil ne rétrécit jamais. */
  .g-etapes-ligne { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .g-etapes { display: flex; align-items: center; flex: 1; min-width: 0; flex-wrap: nowrap; gap: 0; overflow-x: auto; padding-bottom: 2px; }
  .g-etape { display: flex; align-items: center; }
  .g-etape-lien { width: 22px; height: 3px; background: rgba(255,255,255,0.18); flex-shrink: 0; }
  .g-etape-lien.-faite { background: var(--evx-blue-light); }
  .g-etape-bouton { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 4px; font-family: var(--font-body); flex-shrink: 0; }
  .g-etape-bouton:disabled { cursor: not-allowed; opacity: 0.55; }
  .g-etape-rond { width: 24px; height: 24px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800;
    border: 2px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.04); }
  .g-etape-bouton.-faite .g-etape-rond { border-color: var(--evx-blue-light); color: var(--evx-blue-light); background: rgba(63,150,234,0.12); }
  .g-etape-bouton.-actuelle .g-etape-rond { border-color: var(--evx-blue-light); color: #fff; background: var(--evx-blue-light); box-shadow: 0 0 0 4px rgba(63,150,234,0.22); }
  .g-etape-label { font-size: 9px; color: rgba(255,255,255,0.55); max-width: 62px; text-align: center; line-height: 1.2; }
  .g-etape-bouton.-actuelle .g-etape-label { color: #fff; font-weight: 700; }

  /* Indicateur d'étape compact (précédent/actuel/suivant) -- remplace la
     frise complète côté Négociateur/Direction en mobile (retour de
     l'utilisateur du 14/09/2026, en-tête trop haute). Masqué par défaut
     (bureau garde la frise complète) ; réapparaît sous le seuil mobile,
     voir @media plus bas. Le rond réutilise le même style que la frise
     (.g-etape-rond), juste hors du contexte .g-etape-bouton -- d'où la
     variante directe .-actuelle ci-dessous. */
  .g-etape-compacte { display: none; align-items: center; gap: 6px; flex-shrink: 0; }
  .g-etape-rond.-actuelle { border-color: var(--evx-blue-light); color: #fff; background: var(--evx-blue-light); box-shadow: 0 0 0 3px rgba(63,150,234,0.22); }
  .g-etape-nav { flex-shrink: 0; width: 22px; height: 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08); color: #fff; font-size: 13px; font-weight: 900; cursor: pointer; font-family: var(--font-body);
    display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; }
  .g-etape-nav:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Œil du client -- remplace l'ancienne case à cocher (retour de
     l'utilisateur du 14/09/2026 : "une icône compacte œil + Client",
     ouvre une modale Oui/Non plutôt qu'un interrupteur en ligne, pour
     gagner une ligne entière dans l'en-tête). Posée à côté de la frise
     d'étapes (.g-etapes-ligne), jamais compressée. */
  .g-btn-oeil-client { flex-shrink: 0; display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.75); font-size: 11px; font-weight: 700;
    cursor: pointer; font-family: var(--font-body); white-space: nowrap; }
  .g-btn-oeil-client.-actif { border-color: var(--evx-blue-light); color: #fff; background: rgba(63,150,234,0.18); }

  .g-inline-btn { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 5px 12px; border: 1px solid var(--evx-blue); background: #fff; color: var(--evx-blue); cursor: pointer; font-family: var(--font-body); white-space: nowrap; text-decoration: none; display: inline-block; flex-shrink: 0; }
  .g-hero-titre-simple { font-family: var(--font-display); font-size: 20px; font-weight: 900; }
  .g-hero-sous { font-size: 13px; color: var(--evx-onDark-secondary); margin-top: 6px; }

  /* Bandeau de verrouillage */
  .g-verrou-bandeau { flex-shrink: 0; background: #fff4f4; border-bottom: 1px solid #f3c9c9; color: #8a2020; font-size: 12.5px; font-weight: 700;
    padding: 9px 24px; display: flex; align-items: center; gap: 8px; }

  /* ---- Zone de scène (stage + panneaux flottants) ---- */
  .g-scene-zone { position: relative; flex: 1; min-width: 0; min-height: 0; overflow-y: auto; }
  .g-scene { max-width: 1080px; margin: 0 auto; padding: 22px 24px 60px; }

  /* Conseil d'étape déplacé dans l'en-tête (retour du 14/09/2026 : gagner
     de la hauteur pour la scène) -- une ampoule qui s'ouvre au clic plutôt
     qu'un bandeau toujours visible. Largeur en min() plutôt qu'un @media
     séparé -- un @media placé plus tôt dans la feuille avait déjà perdu une
     fois face à cette même règle de base (spécificité égale, ordre de
     source qui tranche) ; bug réel retrouvé le 15/09/2026 en auditant toute
     l'appli en mobile : le popover débordait jusqu'à x=560 sur un écran de
     375px de large. min() rend ce genre de régression impossible : se
     comporte comme 300px fixe sur tout écran large (100vw-24px y dépasse
     toujours 300px), se rétrécit tout seul en dessous. */
  .g-conseil-panel { position: absolute; top: 40px; left: 0; width: min(300px, calc(100vw - 24px)); background: #fff; border-radius: 12px; border: 1px solid #d7e4f5;
    box-shadow: 0 20px 50px rgba(8,16,30,0.35); color: #1e3a5f; z-index: 45; padding: 14px 16px; font-size: 13px; line-height: 1.5; }
  .g-conseil-panel b { color: var(--evx-blue); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }

  /* ---- La scène est un tableau vertical : les deux bandes d'outils
     restent minces en haut, et TOUT le reste de la hauteur va au grand
     aperçu central -- retour du 14/09/2026 : "occuper moins de place en
     haut pour pouvoir avoir plus de place en bas", décisif au format
     smartphone. ---- */
  .g-scene { display: flex; flex-direction: column; min-height: 100%; }
  .g-stage-entete { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .g-stage-titre { font-family: var(--font-display); font-size: 13px; font-weight: 800; color: #101828; text-transform: uppercase; letter-spacing: 0.4px; }
  /* Replier "Outils de négociation" pour gagner de la place -- retour du
     14/09/2026 : "avoir plus de place [pour] expliquer une situation". */
  .g-toggle-outils { flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--evx-blue);
    background: var(--evx-blue); color: #fff; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .g-toggle-outils:hover { background: #1f4f88; }

  /* ---- Bandes d'outils : une ligne horizontale réservée par niveau, jamais
     de retour à la ligne -- on navigue horizontalement (retour du
     14/09/2026). Cliquer une vignette de niveau 1 ouvre une seconde bande
     juste en dessous, dans le même écran -- jamais un autre écran. ---- */
  /* Zones colorées -- les deux bandes d'outils doivent se distinguer d'un
     coup d'œil de la scène/grand aperçu (retour du 14/09/2026 : "un effet
     visuel, une couleur... pour qu'on puisse les identifier directement"). */
  /* Accent des deux côtés -- "comme entre parenthèses" (retour du 14/09/2026) :
     une bande de couleur à l'ouverture ET à la fermeture, pour donner du
     style plutôt qu'un simple filet à gauche. */
  .g-bande-zone { border-radius: 14px; padding: 7px 12px 4px; margin-bottom: 10px; border-left: 4px solid var(--evx-blue); border-right: 4px solid var(--evx-blue); }
  .g-bande-zone.-niveau1 { background: linear-gradient(135deg, rgba(63,150,234,0.12), rgba(63,150,234,0.03)); border-left-color: var(--evx-blue); border-right-color: var(--evx-blue); }
  .g-bande-zone.-niveau2 { background: linear-gradient(135deg, rgba(14,27,48,0.07), rgba(63,150,234,0.05)); border-left-color: var(--evx-navy); border-right-color: var(--evx-navy); }
  .g-bande-outils { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; flex-shrink: 0; }
  .g-bande-outils .g-vignette-carte { flex: 0 0 152px; }
  .g-bande-composants .g-vignette-carte { flex: 0 0 122px; }
  /* La bande des sous-outils doit rester nettement moins haute que celle
     des outils -- retour du 14/09/2026 : "c'est un gâchis d'espace", au
     moins un tiers de moins. */
  .g-bande-composants .g-vignette-mini { height: 34px; }
  /* Étiquette des vignettes du bas : coins carrés, fond noir/texte blanc,
     espace réduit -- consigne du 14/09/2026. */
  .g-bande-composants .g-vignette-carte { border-radius: 0; }
  .g-bande-composants .g-vignette-ligne { padding: 3px 8px; background: var(--evx-navy); }
  .g-bande-composants .g-vignette-nom { font-size: 11px; color: #fff; }
  .g-bande-composants .g-vignette-action .g-chevron, .g-bande-composants .g-btn-symbolique { color: var(--evx-blue-light); }
  .g-vignette-carte { background: #fff; border: 1px solid #d7e4f5; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 26px rgba(26,58,99,0.07);
    display: flex; flex-direction: column; transition: box-shadow 0.15s ease, transform 0.15s ease; }
  .g-vignette-carte.-cliquable { cursor: pointer; }
  .g-vignette-carte.-cliquable:hover { box-shadow: 0 16px 34px rgba(26,58,99,0.13); transform: translateY(-2px); }
  .g-vignette-carte.-ouverte { border-color: var(--evx-blue); box-shadow: 0 0 0 3px rgba(63,150,234,0.25); }
  /* Bande de titre du niveau 2 : une bande TRÈS fine collée en haut de la
     plaque -- retour du 14/09/2026 : "trop d'espace en haut... réserve
     juste une bande très fine... le titre et tout envoyer, tout petit". */
  .g-bande-titre { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 5px; flex-shrink: 0; }
  .g-bande-titre b { font-family: var(--font-display); font-size: 10.5px; color: #101828; }
  .g-bande-titre .g-inline-btn { padding: 3px 10px; font-size: 10px; }

  /* Total de documents / non lus, écrit en toutes lettres -- avant le
     bouton de repli des outils ET à côté de "+ Ajouter un fichier" (retour
     du 14/09/2026 : "je veux aussi que ce soit écrit"). */
  .g-echange-compteur { font-size: 11px; color: #64748b; font-weight: 600; white-space: nowrap; }
  /* Mention "vu"/"lu" du client, écrite sous le nom du fichier dans le
     Grand Aperçu -- équipe seulement (retour du 14/09/2026). */
  .g-statut-lecture { display: block; font-size: 11px; margin-top: 3px; color: #94a3b8; }
  .g-statut-lecture.-vu { color: #b7791f; font-weight: 700; }
  .g-statut-lecture.-lu { color: #16a34a; font-weight: 700; }

  /* Image dominante, légende réduite à une seule ligne symbolique (retour
     du 14/09/2026 : "l'espace réservé au texte occupe la moitié de la
     vignette... tout juste symbolique en bas sur une même ligne"). */
  .g-vignette-image-wrap { position: relative; flex-shrink: 0; }
  .g-vignette-badge-recommande { position: absolute; top: 7px; left: 7px; width: 8px; height: 8px; border-radius: 999px;
    background: var(--evx-blue-light); box-shadow: 0 0 0 2px rgba(255,255,255,0.75); }
  .g-vignette-badge-complet { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 999px;
    background: #22c55e; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px rgba(255,255,255,0.85); }
  .g-vignette-ligne { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 9px; }
  .g-vignette-nom { font-size: 12px; font-weight: 700; color: #101828; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .g-vignette-action { flex-shrink: 0; font-size: 13px; line-height: 1; display: flex; align-items: center; }
  .g-vignette-action .-envoye { color: #22c55e; font-size: 15px; }
  .g-vignette-action .g-chevron { color: var(--evx-blue); font-size: 16px; font-weight: 800; }
  /* Juste une flèche, jamais un bouton en cercle bordé -- consigne du
     14/09/2026 : "ne mets pas la flèche dans un bouton". */
  .g-btn-symbolique { border: none; background: none; color: var(--evx-blue); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; font-family: var(--font-body); }
  .g-btn-symbolique:hover { color: #1f4f88; }

  .g-vignette-mock { width: 100%; height: 66px; position: relative; overflow: hidden; background: #eef4fb; flex-shrink: 0; }
  .g-mock-presentation { background: linear-gradient(150deg, var(--evx-navy-deep), var(--evx-navy)); padding: 10px 12px; }
  .g-mock-presentation .mock-barre { display: flex; gap: 4px; margin-bottom: 8px; }
  .g-mock-presentation .mock-barre span { width: 5px; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.35); }
  .g-mock-presentation .mock-titre { width: 62%; height: 8px; border-radius: 3px; background: linear-gradient(90deg, var(--evx-blue-light), rgba(63,150,234,0.5)); margin-bottom: 7px; }
  .g-mock-presentation .mock-ligne { width: 80%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.22); margin-bottom: 4px; }
  .g-mock-presentation .mock-ligne.-courte { width: 45%; }
  .g-mock-presentation .mock-cta { position: absolute; bottom: 10px; right: 12px; width: 30px; height: 10px; border-radius: 999px; background: var(--evx-blue-light); }
  .g-mock-cdc { background: #fff; padding: 7px 10px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
  .g-mock-cdc .mock-check-row { display: flex; align-items: center; gap: 6px; }
  .g-mock-cdc .mock-check { width: 9px; height: 9px; border-radius: 3px; border: 1.5px solid #c3d6ee; flex-shrink: 0; }
  .g-mock-cdc .mock-check.-fait { background: var(--evx-blue); border-color: var(--evx-blue); }
  .g-mock-cdc .mock-trait { flex: 1; height: 4px; border-radius: 2px; background: #e3ecf7; }
  .g-mock-cdc .mock-trait.-courte { max-width: 55%; }
  .g-mock-socle { background: #eef4fb; display: flex; align-items: center; justify-content: center; }
  .g-mock-socle .mock-feuillet { position: absolute; width: 40px; height: 33px; background: #fff; border: 1px solid #d7e4f5; border-radius: 5px; box-shadow: 0 3px 7px rgba(26,58,99,0.10);
    transform: translate(calc(var(--i) * 4px), calc(var(--i) * -4px)) rotate(calc(var(--i) * -3deg)); }
  .g-mock-socle .mock-feuillet[style*="--i:0"] { background: linear-gradient(160deg, #fff, #eaf3ff); }
  .g-mock-captures img, .g-mock-mini-captures img, .g-mock-licences img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .g-vignette-mini { width: 100%; height: 56px; position: relative; overflow: hidden; background: #eef4fb; flex-shrink: 0; }
  .g-mock-mini-page { background: linear-gradient(160deg, #fff, #eaf3ff); display: flex; align-items: center; justify-content: center; }
  .g-mock-mini-page span { font-family: var(--font-display); font-size: 15px; font-weight: 900; color: var(--evx-blue); }
  .g-mock-mini-bloc { background: linear-gradient(150deg, var(--evx-navy-deep), var(--evx-navy)); display: flex; align-items: center; justify-content: center; }
  .g-mock-mini-bloc span { font-size: 15px; color: var(--evx-blue-light); }
  .g-mock-mini-licence { background: linear-gradient(180deg, rgba(63,150,234,0.20), #fff); border-bottom: 3px solid var(--evx-blue); }

  /* ---- Grand aperçu central -- le vrai espace de travail, occupe tout le
     reste de la hauteur disponible sous les deux bandes. ---- */
  .g-stage-grand { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 260px; margin-top: 6px; }
  /* Contour bleu net autour de l'espace de travail -- retour du 14/09/2026 :
     "mets un petit trait bleu autour" (le contour précédent était trop pâle
     pour vraiment se voir). */
  .g-stage-vide { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px;
    color: #8ca2bd; background: #f5f9ff; border: 1.5px dashed var(--evx-blue-light); border-radius: 16px; padding: 30px; }
  .g-stage-vide-icone { font-size: 26px; }
  .g-stage-vide p { font-size: 13px; max-width: 320px; margin: 0; }
  .g-grand-apercu { flex: 1; display: flex; flex-direction: column; background: #fff; border: 1.5px solid var(--evx-blue-light); border-radius: 16px;
    overflow: hidden; box-shadow: 0 14px 34px rgba(26,58,99,0.08); }
  .g-grand-image { flex: 1; min-height: 200px; position: relative; overflow: auto; }
  .g-grand-legende { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-top: 1px solid #eef1f6; }
  .g-grand-nom { font-family: var(--font-display); font-size: 14px; font-weight: 800; color: #101828; }
  .g-grand-envoye { color: #22c55e; font-weight: 700; font-size: 13px; border: none; background: none; padding: 0; font-family: var(--font-body); }
  button.g-grand-envoye { cursor: pointer; }
  button.g-grand-envoye:hover { color: #16a34a; text-decoration: underline; }
  .g-grand-envoyer { background: linear-gradient(135deg,#3f96ea,#1c6fd9); border: none; color: #fff; font-weight: 800; font-size: 12.5px; padding: 9px 18px; border-radius: 999px; cursor: pointer; font-family: var(--font-body); display: inline-flex; align-items: center; }

  /* Dossier d'échange (retour du 14/09/2026) : vignette-dossier à part,
     jamais une image, avec compteur total + compteur "nouveaux" clignotant.
     L'icône elle-même EST la vignette -- AUCUN cadre autour, ni sombre ni
     blanc, PAS MÊME la carte blanche standard des autres vignettes : elle
     repose directement sur le fond de la bande, comme une icône de bureau
     (retour du 14/09/2026, répété plusieurs fois -- la carte blanche
     restante était "le même modèle", juste avec un dessin différent dedans). */
  .g-carte-dossier { background: none; border: none; box-shadow: none; overflow: visible; }
  .g-carte-dossier.-cliquable:hover { box-shadow: none; transform: translateY(-2px); }
  .g-carte-dossier .g-vignette-image-wrap { display: flex; align-items: center; justify-content: center; height: 88px; background: none; }
  /* Conteneur exactement à la taille de l'icône (84px) -- les badges se
     positionnent par rapport À LUI, pas à la carte entière (152px), sinon
     ils ne tombent pas sur les coins réels de l'image (retour du 14/09/2026
     : "tes écritures ne sont pas sur l'icône... ils sont à côté"). */
  .g-dossier-icone-cadre { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
  .g-dossier-icone-cadre img { display: block; }
  .g-carte-dossier .g-vignette-ligne { background: none; }
  .g-dossier-icone-wrap { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--evx-blue-light); }
  .g-bande-composants .g-dossier-icone-wrap { color: var(--evx-blue-light); background: var(--evx-navy); height: 34px; }
  /* Chiffres superposés sur la zone sombre de l'icône -- jamais une ligne
     blanche à part (retour du 14/09/2026). Total en bas à gauche, nouveaux
     en haut à droite, comme les autres badges de vignette. */
  .g-dossier-total { position: absolute; bottom: 2px; left: 2px; font-family: var(--font-display); font-weight: 900; font-size: 15px; color: #101828; text-shadow: 0 1px 3px rgba(255,255,255,0.8); }
  /* Nettement plus grand que le total -- c'est ce qui doit sauter aux yeux
     (retour du 14/09/2026 : "bien plus grand que le un à gauche"). Bien
     dans le coin, à l'écart de l'icône elle-même -- jamais par-dessus. */
  .g-dossier-nouveaux { position: absolute; top: 0; right: 0; font-family: var(--font-display); font-weight: 900; font-size: 18px; color: #fff; background: #dc2626; border-radius: 999px; min-width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0 7px; box-shadow: 0 0 0 2px #fff; animation: g-clignote 1.4s ease-in-out infinite; }
  @keyframes g-clignote { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  /* Fichier reçu pas encore consulté : nom en rouge + point rouge sur
     l'icône, bien visible -- consigne du 14/09/2026. */
  .g-vignette-carte.-nouveau .g-vignette-nom { color: #dc2626; font-weight: 800; }
  .g-point-nouveau { position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; border-radius: 999px; background: #dc2626; box-shadow: 0 0 0 2px #fff; }
  .g-dossier-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .g-dossier-actions .g-btn-symbolique { font-size: 17px; text-decoration: none; }
  .g-btn-symbolique.-danger { color: #dc2626; }
  .g-dossier-apercu-vide { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #8ca2bd; padding: 30px; text-align: center; }
  .g-dossier-apercu-vide svg { width: 40px; height: 40px; }
  .g-dossier-apercu-vide p { font-size: 13px; max-width: 280px; margin: 0; }

  .g-grand-image img { width: 100%; height: 100%; object-fit: contain; background: #0e1b30; display: block; }

  .g-envoi-recent { margin-top: 18px; font-size: 11.5px; color: #7f93ac; }
  .g-envoi-recent b { color: #475467; }

  .g-hint { font-size: 11.5px; color: #7f93ac; margin-top: 8px; }
  .g-erreur { color: #b91c1c; font-size: 12.5px; font-weight: 700; padding: 40px 20px; text-align: center; }
  .g-chargement { text-align: center; padding: 80px 20px; color: #64748b; font-size: 13px; }

  .g-bientot { text-align: center; padding: 60px 20px; }
  .g-bientot .g-bientot-icone { font-size: 32px; margin-bottom: 14px; }
  .g-bientot h3 { font-family: var(--font-display); font-size: 16px; color: #101828; margin: 0 0 8px; }
  .g-bientot p { font-size: 13px; color: #64748b; max-width: 380px; margin: 0 auto; }

  /* ---- Zone de corps : barre latérale + scène + colonne latérale côte à
     côte, EN DESSOUS de l'en-tête (retour du 14/09/2026 : "contrairement au
     menu de gauche, ce menu de droite prend effet en dessous de la barre
     d'en-tête... ainsi ce ne sont que les éléments de l'intérieur qui se
     redimensionnent" -- l'en-tête garde toujours la même forme, quoi qu'il
     se passe ici). Retour du 16/09/2026 : la barre latérale gauche a rejoint
     cette même zone, pour la même raison. ---- */
  .g-corps-zone { flex: 1; min-height: 0; display: flex; }

  /* ---- Colonne latérale unifiée : Tchat Client / Notes / Échanges internes
     en onglets, permanente, rétractable en fine bande -- exactement le même
     système que la barre latérale gauche. Largeur réglable au maximum (une
     poignée de redimensionnement), mais jamais très grande par défaut. ---- */
  .g-colonne-laterale { position: relative; width: 320px; flex-shrink: 0; background: #fff; border-left: 2px solid #c3d6ee;
    display: flex; flex-direction: column; transition: width 0.18s ease; }
  .g-colonne-laterale.-repliee { width: 64px; }
  .g-colonne-resize { position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: col-resize; z-index: 2; }
  .g-colonne-resize::after { content: ''; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: transparent; }
  .g-colonne-resize:hover::after, .g-colonne-resize.-actif::after { background: var(--evx-blue-light); }

  /* En-tête de la colonne en bleu nuit -- retour du 14/09/2026 : "tout est
     blanc de l'en-tête jusqu'en bas, il faut utiliser une couleur" ; reprend
     l'identité de la barre latérale gauche pour donner un vrai style. */
  .g-colonne-top { display: flex; align-items: center; gap: 4px; padding: 9px 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--evx-navy-deep), var(--evx-navy)); }
  .g-colonne-onglet { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 8px 4px;
    border-radius: 8px; border: none; background: none; cursor: pointer; font-size: 14px; color: rgba(255,255,255,0.5); font-family: var(--font-body); }
  .g-colonne-onglet.-actif { background: rgba(255,255,255,0.16); color: #fff; }
  /* Le bouton de repli doit se distinguer nettement des 3 onglets -- retour
     du 14/09/2026 : "confondu aux différents boutons... utilise juste des
     flèches, mais plus grandes et plus visibles" -- une simple flèche nue,
     sans fond ni cadre, pour qu'elle ne ressemble à aucun des trois onglets. */
  .g-toggle-colonne { flex-shrink: 0; width: 28px; height: 30px; border: none; background: none;
    color: #fff; cursor: pointer; font-size: 26px; font-weight: 900; line-height: 1;
    display: flex; align-items: center; justify-content: center; font-family: var(--font-body); }
  .g-toggle-colonne:hover { color: var(--evx-blue-light); }

  .g-colonne-repliee-barre { display: flex; flex-direction: column; align-items: center; height: 100%; padding: 14px 0; gap: 16px;
    background: linear-gradient(180deg, var(--evx-navy-deep), var(--evx-navy)); }
  .g-colonne-icone-repliee { position: relative; width: 38px; height: 38px; border-radius: 999px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); font-size: 17px;
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .g-colonne-icone-repliee.-actif { background: rgba(255,255,255,0.18); color: #fff; }
  .g-colonne-icone-repliee.-pulse { animation: g-pulse-chat 1.15s ease-in-out infinite; }
  @keyframes g-pulse-chat { 0%, 100% { box-shadow: 0 0 0 0 rgba(28,111,217,0.35); } 50% { box-shadow: 0 0 0 9px rgba(28,111,217,0); } }
  .g-badge-compte { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px;
    background: #e0605f; color: #fff; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #fff; }
  .g-pastille-onglet { position: absolute; top: 4px; right: 14px; width: 7px; height: 7px; border-radius: 999px; background: #f0a860; }

  /* Fond légèrement dégradé -- retour du 14/09/2026 : "l'arrière-plan est
     tout blanc... il faudrait une petite couleur, un dégradé gris, quelque
     chose pour ressortir" -- jamais un aplat plat derrière les bulles. */
  .g-colonne-corps { flex: 1; overflow-y: auto; padding: 14px 16px; background: linear-gradient(180deg, #f7f9fc, #eef2f7); }
  .g-colonne-pied { flex-shrink: 0; padding: 12px 16px 16px; border-top: 1px solid #eef1f6; }
  .g-colonne-pied .g-form-row { margin-top: 0; }
  .g-colonne-pied textarea { width: 100%; box-sizing: border-box; }

  /* Bulles de tchat façon messagerie moderne (WhatsApp, retour du
     14/09/2026 après un premier essai raté avec une pointe en triangle --
     "la finition n'est pas du tout bien"). Le sens se lit par UN SEUL coin
     sec (border-radius asymétrique, jamais de triangle rapporté) + l'
     alignement gauche/droite -- l'alignement reste TOUJOURS "moi/l'autre"
     (pour se repérer d'un coup d'œil, quel que soit son rôle), mais la
     COULEUR suit maintenant le RÔLE de l'auteur (retour du 14/09/2026,
     tranché : "quand le support s'exprime... on sait que cela vient du
     support", partout, peu importe qui regarde) -- classe .-fonce,
     indépendante de .-moi. Exception : le client, dans SON tchat, garde le
     simple moi/EVOTEX d'origine (règle plus ancienne du 16/09/2026 --
     jamais de fuite sur qui, précisément côté équipe, lui répond), voir
     rendreFilMessages(). Les autres auteurs (hors Support) gardent en plus
     un nom coloré individuellement -- 2-3 intervenants jamais confondables. */
  .g-msg-liste { display: flex; flex-direction: column; gap: 10px; }
  .g-msg { max-width: 78%; align-self: flex-start; background: #fff; border: 2px solid var(--evx-blue); border-radius: 4px 16px 16px 16px;
    padding: 8px 12px 6px; font-size: 13px; color: #1e293b; position: relative; box-shadow: 0 3px 10px rgba(26,58,99,0.1); }
  .g-msg.-moi { align-self: flex-end; border-radius: 16px 4px 16px 16px; }
  .g-msg.-fonce { background: #1a3a63; border-color: #1a3a63; color: #fff; }
  .g-msg .meta { font-size: 10.5px; color: #5b7fa6; font-weight: 800; margin-bottom: 3px; }
  .g-msg.-fonce .meta { color: rgba(255,255,255,0.8); }
  .g-msg-heure { font-size: 10px; color: #9fb3cc; text-align: right; margin-top: 3px; }
  .g-msg.-fonce .g-msg-heure { color: rgba(255,255,255,0.7); }
  /* Regroupement par jour -- retour du 14/09/2026 : "la date, régroupons-la
     par date... l'heure à la fin du message, pas au début" -- plus de
     date répétée sur chaque message, seulement l'heure en pied de bulle. */
  .g-date-separateur { text-align: center; margin: 14px 0 4px; }
  .g-date-separateur span { display: inline-block; background: #fff; color: #4a6d99; font-size: 10.5px; font-weight: 700; padding: 4px 14px; border-radius: 999px; box-shadow: 0 1px 4px rgba(26,58,99,0.12); }
  .g-msg-supprime { color: #94a3b8; font-style: italic; font-size: 12.5px; }
  .g-msg.-fonce .g-msg-supprime { color: rgba(255,255,255,0.75); }
  .g-msg-vocal { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .g-msg-vocal audio { height: 32px; max-width: 190px; vertical-align: middle; }
  .g-msg .g-hint { color: #7f93ac; }
  .g-msg.-fonce .g-hint, .g-msg.-fonce .g-btn-symbolique { color: rgba(255,255,255,0.85); }
  .g-msg-supprimer { border: none; background: none; color: #94a3b8; cursor: pointer; font-size: 12px; padding: 0 0 0 4px; opacity: 0.65; }
  .g-msg-supprimer:hover { opacity: 1; color: #dc2626; }
  .g-msg.-fonce .g-msg-supprimer { color: rgba(255,255,255,0.75); }
  .g-msg.-fonce .g-msg-supprimer:hover { color: #fff; }

  /* Bulle d'enregistrement en direct -- retour du 14/09/2026 : "pas le
     micro, mais LA BULLE... qu'il y ait un mouvement sur la bulle pendant
     tout le temps où on s'exprime". Barres animées en continu (jamais
     immobiles) + halo dont l'intensité suit le niveau réel du micro
     (--niveau-vocal, posé en JS). */
  .g-bulle-enregistrement { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px;
    background: #fdeaea; border: 1.5px solid #dc2626; border-radius: 10px; color: #dc2626; z-index: 1;
    box-shadow: 0 0 0 calc(2px + 5px * var(--niveau-vocal, 0.3)) rgba(220,38,38,0.18); transition: box-shadow 0.1s linear; }
  .g-vocal-minuteur { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .g-vocal-barres { display: flex; align-items: center; gap: 3px; height: 22px; flex-shrink: 0; }
  .g-vocal-barres span { width: 3px; border-radius: 2px; background: currentColor; display: block; animation: g-barre-vocale 0.9s ease-in-out infinite; }
  .g-vocal-barres span:nth-child(1) { height: 8px; animation-delay: 0s; }
  .g-vocal-barres span:nth-child(2) { height: 16px; animation-delay: 0.15s; }
  .g-vocal-barres span:nth-child(3) { height: 22px; animation-delay: 0.3s; }
  .g-vocal-barres span:nth-child(4) { height: 14px; animation-delay: 0.45s; }
  .g-vocal-barres span:nth-child(5) { height: 10px; animation-delay: 0.6s; }
  @keyframes g-barre-vocale { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }

  /* Icônes du pied de tchat (micro/trombone) -- retour du 14/09/2026 :
     "un gros bouton envoyer, un gros bouton avec un minuscule micro
     dedans... la trombone, on ne la voit pas" -- même gabarit que le bouton
     Envoyer (rond, contour net, fond visible), plus une vraie icône SVG à
     la place de l'émoji. */
  .g-btn-icone-tchat { width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; background: #eef4fc;
    border: 1.5px solid var(--evx-blue-light); color: var(--evx-blue); display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; }
  .g-btn-icone-tchat:hover { background: #e0ecfb; }
  /* --niveau-vocal (0 à 1) vient du niveau réel capté par le micro
     (AnalyserNode) -- l'anneau respire avec la voix, pas une animation
     jouée au hasard (retour du 14/09/2026 : "être sûr que le micro est en
     plein enregistrement"). Le silence prolongé arrête et envoie tout seul
     -- voir SILENCE_LIMITE_MS dans le JS. */
  .g-btn-icone-tchat.-enregistrement { --niveau-vocal: 0.3; background: #fdeaea; border-color: #dc2626; color: #dc2626; width: auto; padding: 0 12px;
    font-size: 11px; font-weight: 800; gap: 5px; animation: g-pulse-vocal 1s ease-in-out infinite;
    box-shadow: 0 0 0 calc(3px + 5px * var(--niveau-vocal)) rgba(220,38,38,calc(0.28 * var(--niveau-vocal) + 0.06)); }
  .g-vocal-duree-enreg { font-variant-numeric: tabular-nums; }
  @keyframes g-pulse-vocal { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  /* Coché de confirmation, bref, à la fin de l'enregistrement -- retour du
     14/09/2026 : "une animation... à la fin aussi de l'enregistrement". */
  .g-btn-icone-tchat.-envoye { background: #e7f7ec; border-color: #16a34a; color: #16a34a; animation: g-envoye-pop 0.35s ease; }
  @keyframes g-envoye-pop { 0% { transform: scale(0.6); opacity: 0.4; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }

  /* Lecteur vocal maison dans la bulle -- retour du 14/09/2026 : "lorsqu'on
     écoute aussi, il faudrait que ça se présente de façon vraiment
     professionnelle et moderne" -- jamais le <audio controls> natif, brut
     et différent d'un navigateur à l'autre. */
  .g-lecteur-vocal { display: flex; align-items: center; gap: 9px; min-width: 176px; }
  .g-lecteur-play { width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; border: none; background: var(--evx-blue);
    color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .g-msg.-fonce .g-lecteur-play { background: #fff; color: #1a3a63; }
  .g-lecteur-vocal.-enlecture .g-lecteur-play { animation: g-lecteur-respire 1.3s ease-in-out infinite; }
  @keyframes g-lecteur-respire { 0%, 100% { box-shadow: 0 0 0 0 rgba(28,111,217,0.35); } 50% { box-shadow: 0 0 0 5px rgba(28,111,217,0); } }
  .g-msg.-fonce .g-lecteur-vocal.-enlecture .g-lecteur-play { animation-name: g-lecteur-respire-clair; }
  @keyframes g-lecteur-respire-clair { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.45); } 50% { box-shadow: 0 0 0 5px rgba(255,255,255,0); } }
  .g-lecteur-corps { flex: 1; min-width: 80px; }
  .g-lecteur-barre { height: 4px; border-radius: 999px; background: rgba(28,111,217,0.15); overflow: hidden; }
  .g-msg.-fonce .g-lecteur-barre { background: rgba(255,255,255,0.3); }
  .g-lecteur-progression { height: 100%; width: 0%; background: var(--evx-blue); border-radius: inherit; }
  .g-msg.-fonce .g-lecteur-progression { background: #fff; }
  .g-lecteur-duree { font-size: 10.5px; color: #7f93ac; margin-top: 3px; display: block; font-variant-numeric: tabular-nums; }
  .g-msg.-fonce .g-lecteur-duree { color: rgba(255,255,255,0.85); }

  .g-form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .g-form-row input, .g-form-row select { font-size: 12.5px; padding: 8px 9px; border-radius: 7px; border: 1px solid #c3d6ee; font-family: var(--font-body); }
  .g-form-row textarea { flex: 1; min-width: 200px; font-size: 13px; padding: 9px 10px; border-radius: 7px; border: 1px solid #c3d6ee; font-family: var(--font-body); resize: vertical; }
  .g-form-row button { background: linear-gradient(135deg,#3f96ea,#1c6fd9); border: none; color: #fff; font-weight: 800; font-size: 12.5px; padding: 9px 16px; border-radius: 999px; cursor: pointer; font-family: var(--font-body); }

  .g-notes-mine { width: 100%; box-sizing: border-box; font-size: 13px; padding: 10px; border-radius: 8px; border: 1px solid #c3d6ee;
    font-family: var(--font-body); resize: vertical; background: #fff; box-shadow: 0 2px 8px rgba(26,58,99,0.07); }
  .g-notes-separateur { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; font-weight: 800; margin: 18px 0 10px; }
  .g-liste { display: flex; flex-direction: column; gap: 8px; }
  .g-item { display: flex; flex-wrap: wrap; gap: 2px 10px; background: linear-gradient(180deg, #fff, #f5f9ff); border: 1px solid #e3ecf7; border-radius: 9px; padding: 10px 12px; box-shadow: 0 2px 6px rgba(26,58,99,0.05); }
  .g-item .info { display: flex; flex-direction: column; flex: 1 1 200px; min-width: 0; }
  .g-item .info b { font-size: 12.5px; color: #101828; }
  .g-item .info span { font-size: 12.5px; color: #475467; overflow-wrap: break-word; }

  /* Modale légère -- ajout de membre */
  .g-modal-fond { position: fixed; inset: 0; background: rgba(10,20,36,0.55); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
  .g-modal { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 30px 70px rgba(8,16,30,0.4); }
  .g-modal h3 { font-family: var(--font-display); font-size: 16px; margin: 0 0 16px; color: #101828; }
  .g-modal .g-form-row { flex-direction: column; margin-top: 0; }
  .g-modal .g-form-row input, .g-modal .g-form-row select { width: 100%; box-sizing: border-box; }
  .g-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .g-modal-actions button.-annuler { background: none; border: 1px solid #c3d6ee; color: #475467; border-radius: 999px; padding: 9px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: var(--font-body); }

  @media (max-width: 768px) {
    /* Déclencheur ancré DANS le bandeau d'en-tête (.g-hero), au même niveau
       que le titre -- retour explicite de l'utilisateur du 14/09/2026 : "le
       menu Espace de travail... doit vivre dans le bandeau d'en-tête... pas
       comme élément flottant ou mal positionné ailleurs". Placé en absolu
       par rapport à .g-hero (position: relative, commun à tous les
       panneaux) ; le padding de .g-hero n'est élargi QUE quand le hamburger
       existe réellement (:has) -- retour du 14/09/2026, point 2 du bandeau
       client : "marges trop généreuses" -- le client (sidebar masquée, pas
       de hamburger) n'a plus aucune raison de porter ces 58px, jamais
       utilisés chez lui. z-index au-dessus du menu plein écran pour rester
       cliquable et pouvoir refermer (icône ↔ ✕, voir JS). Chevron de repli
       desktop caché -- sans objet pour un menu plein écran. */
    .g-hero:has(#btn-hamburger) { padding-left: 58px !important; }
    .g-btn-hamburger { display: flex; position: absolute; top: 14px; left: 14px; z-index: 90; }

    /* Popover "Conseil" détaché de l'icône en mobile -- bug réel trouvé le
       15/09/2026 en auditant toute l'appli : l'ampoule est collée en fin de
       titre (position variable selon la longueur du nom de la négociation),
       et min(300px, calc(100vw - 24px)) seul ne suffit pas -- rien ne borne
       la position de départ (left:0 relatif à l'icône), donc le popover
       pouvait déborder jusqu'à x=560 sur un écran de 375px de large, même
       largeur capée. Ancré au viewport plutôt qu'à l'icône en dessous de ce
       seuil : ne déborde plus jamais, quelle que soit la longueur du nom.
       Placé volontairement ici, tout en bas de la feuille -- un @media plus
       haut avait déjà perdu deux fois de suite face à la règle de base
       (spécificité égale, l'ordre de source tranche). */
    .g-conseil-panel { position: fixed; top: 74px; left: 12px; right: 12px; width: auto; }
    .g-toggle-sidebar { display: none; }

    /* Titre jamais wrappé (point 5 du bandeau client, retour du 14/09/2026) :
       police réduite d'abord -- l'ellipsis de .g-nego-nom-texte (CSS de
       base) ne sert qu'en tout dernier recours. */
    .g-nego-nom { font-size: 15px; }

    /* Badge ticket compact (point 1) -- moins de hauteur/padding pour tenir
       sur la même ligne que les pastilles de membres (26px). */
    .g-ticket-pill { height: 26px; padding: 0 8px; font-size: 10.5px; gap: 4px; }

    /* En-tête Négociateur/Direction compressée (retour de l'utilisateur du
       14/09/2026, tour suivant celui du bandeau client) : la frise complète
       des 6 étapes gardait toute sa propre ligne même défilante -- bascule
       vers l'indicateur compact (précédent/actuel/suivant), rejoint la
       rangée équipe/ticket. Contenu inchangé, seule la présentation change.
       Le libellé "ÉQUIPE -- Nom" devient superflu à ce point (le titre
       l'affiche déjà juste au-dessus) -- masqué pour regagner de la place,
       jamais le titre lui-même (toujours visible, voir .g-nego-nom). */
    .g-equipe-nego-nom { display: none; }
    .g-etapes-ligne.-equipe { display: none; }
    .g-etape-compacte { display: flex; }

    /* Menu déroulant VERTICAL plein écran -- retour testeurs du 14/09/2026
       ("la barre latérale se superpose au contenu... cliquer sur un item
       peut activer un élément complètement différent"), précisé ensuite par
       l'utilisateur : jamais un tiroir latéral qui partage l'espace avec la
       scène -- entièrement hors du flux (position: fixed), fermé par défaut
       (hors écran, au-dessus), ouvert en recouvrant tout l'écran. */
    .g-sidebar { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 80;
      width: 100% !important; max-width: 100% !important; padding: 70px 18px 18px !important;
      flex-direction: column !important; overflow-y: auto; overflow-x: hidden;
      transform: translateY(-100%); transition: transform 0.22s ease; }
    .g-sidebar.-ouverte-mobile { transform: translateY(0); }
    .g-sidebar-top { display: none; }
    .g-nav-item .g-nav-label, .g-sidebar-user, .g-btn-label, .g-role-mur { display: block !important; }
    .g-nav-item { justify-content: flex-start !important; padding: 12px !important; font-size: 14px !important; }
    .g-sidebar-bas { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 14px; }

    .g-hero-top { flex-direction: column; }
    .g-hero-droite { width: 100%; justify-content: space-between; }
    .g-corps-zone { flex-direction: column; }

    /* Pied de page FIXE (Tchat Client / Notes / Échanges) -- retour de
       l'utilisateur du 14/09/2026, qui revient sur l'overlay plein écran
       essayé juste avant : "le tchat reste en pied de page fixe... jamais
       en overlay plein écran qui apparaît/disparaît". position: fixed dans
       les DEUX états (replié ET ouvert) -- seule la hauteur change, jamais
       la position : toujours ancré en bas, jamais un panneau qui recouvre
       tout l'écran. Clic sur une icône (repliée OU dans les onglets
       ouverts) bascule ouvert/fermé -- voir ouvrirOngletColonne() ; plus
       besoin des flèches "→"/"←", masquées ci-dessous. */
    .g-colonne-laterale { position: fixed; left: 0; right: 0; bottom: 0; z-index: 85;
      width: 100% !important; border-left: none; border-top: 1px solid #d7e4f5; }
    .g-colonne-laterale.-repliee { height: 60px; }
    .g-colonne-laterale:not(.-repliee) { height: 70vh; }
    .g-colonne-repliee-barre { flex-direction: row; height: auto; padding: 10px; }
    .g-toggle-colonne { display: none; }

    /* Rangées de cartes -- retour testeurs du 14/09/2026 : "débordent
       horizontalement au lieu de passer à la ligne" (colonnes figées
       repeat(N,1fr)). Grille souple à la place, même principe que
       .cc-kpi-grille qui fonctionnait déjà. */
    .tb-kpi-grille { grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); }
    .tb-outils-grille { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .cc-summary-grille { grid-template-columns: 1fr; gap: 4px 0; }
  }
</style>
</head>
<body>
<div class="g-shell">
  <!-- Le hamburger mobile (#btn-hamburger) est injecté par JS DANS le
       bandeau .g-hero lui-même (voir injecterHamburger()), pas ici en dur --
       retour explicite de l'utilisateur du 14/09/2026 : il doit vivre au
       même niveau que le titre de la négociation, jamais comme une barre
       séparée au-dessus. -->
  <div id="hero"><div class="g-chargement">Chargement…</div></div>
  <div id="verrou-bandeau"></div>
  <div class="g-corps-zone">
    <aside class="g-sidebar" id="sidebar"></aside>
    <div class="g-scene-zone"><div class="g-scene" id="corps"></div></div>
