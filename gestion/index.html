// Le vrai outil (fichiers réels de evotex-commercial/index.html, chargés en
// tête de page -- voir window.Views) s'affiche désormais ici en direct,
// monté nativement dans le document, plutôt qu'une maquette ou une iframe --
// retour du 16/09/2026 : "les négociateurs peuvent voir ça", et refus explicite
// de toute solution en frontière de document ("pas de raccourci, pas
// d'iframe -- le vrai code, directement dans la page"). "captures" reste une
// vraie image ; les composants sans page dédiée (accroche, pages du Socle)
// retombent sur l'outil entier. "licences" est un cas double, tranché le
// 14/09/2026 : la version complète (vrai code, onglets cliquables) s'affiche
// en haut dès l'ouverture de l'outil, et les 4 captures dans la bande de
// composants juste en dessous restent, elles, des images statiques -- cf.
// OUTILS_EN_IMAGE_SI_COMPOSANT plus bas.
const CLE_VUE_PAR_OUTIL = { presentation: 'presentation', cdc: 'besoins', licences: 'licences', socle: 'socle' };

// Légende du dossier d'échange -- distincte du reste : pas de "Envoyer au
// client" à sens unique, mais dépôt bidirectionnel + retrait + promotion
// éventuelle vers Mes Documents. #grand-image (l'aperçu du fichier
// lui-même) est rempli à part, par rafraichirGrandApercu, comme pour
// captures/licences.
function rendreGrandApercuEchange(d, estDirectionReelle, fichierId) {
  const peutEnvoyer = estDirectionReelle && !d.voirComme;
  const fichiers = (d.dossierPartage || {}).fichiers || [];
  if (!fichierId) {
    return `<div class="g-grand-apercu">
      <div class="g-grand-image" id="grand-image"></div>
      <div class="g-grand-legende">
        <div class="g-grand-nom">Échange de Fichiers</div>
        <label class="g-grand-envoyer" for="input-fichier-partage">Déposer un fichier<input type="file" id="input-fichier-partage" accept="${ACCEPT_FICHIER_PARTAGE}" hidden></label>
      </div>
    </div>`;
  }
  const fichier = fichiers.find(f => String(f.id) === String(fichierId));
  if (!fichier) return `<div class="g-stage-vide"><div class="g-stage-vide-icone">🖥️</div><p>Fichier introuvable.</p></div>`;
  const libelleMesDocuments = 'Échange de Fichiers — ' + fichier.nom_fichier;
  const dejaEnvoye = (d.liensClient || []).some(l => l.libelle === libelleMesDocuments);
  // Direction et Négociateur peuvent retirer n'importe quel fichier (jamais
  // en mode "voir comme", qui reste un aperçu en lecture seule) ; le client
  // ne retire que ses propres dépôts -- symétrique à la règle serveur.
  const peutSupprimerToutFichier = (d.monRoleReel === 'direction' || d.monRoleReel === 'negociateur') && !d.voirComme;
  const peutRetirerPropre = d.role === 'client' && fichier.envoye_par_role === 'client' && String(fichier.envoye_par_id) === String(etat.moi?.id);
  const peutSupprimer = peutSupprimerToutFichier || peutRetirerPropre;
  // Mention "vu"/"lu" écrite, avec horodatage -- consigne du 14/09/2026 :
  // le négociateur veut savoir si (et quand) LE CLIENT a vu, puis lu, un
  // fichier envoyé par l'équipe. Jamais montré côté client, ni pour les
  // fichiers déposés par le client lui-même (il sait déjà qu'il l'a envoyé).
  let statutLecture = '';
  if (d.role !== 'client' && fichier.envoye_par_role !== 'client') {
    if (fichier.clientLuLe) {
      statutLecture = `<span class="g-statut-lecture -lu">Lu par le client le ${new Date(fichier.clientLuLe).toLocaleString('fr-FR')}</span>`;
    } else if (fichier.clientVuLe) {
      statutLecture = `<span class="g-statut-lecture -vu">Vu par le client le ${new Date(fichier.clientVuLe).toLocaleString('fr-FR')} · pas encore ouvert</span>`;
    } else {
      statutLecture = `<span class="g-statut-lecture">Pas encore vu par le client</span>`;
    }
  }
  return `<div class="g-grand-apercu">
    <div class="g-grand-image" id="grand-image"></div>
    <div class="g-grand-legende">
      <div>
        <div class="g-grand-nom">${escapeHtml(fichier.nom_fichier)}</div>
        <span class="g-hint" style="margin:0">${tailleLisible(fichier.taille_octets)} · déposé par ${escapeHtml(fichier.envoye_par_nom)}</span>
        ${statutLecture}
      </div>
      <div class="g-dossier-actions">
        <a class="g-btn-symbolique" href="/api/gestion/fichier?id=${fichier.id}" target="_blank" title="Ouvrir / télécharger">⇩</a>
        ${peutEnvoyer
          ? (dejaEnvoye
              ? `<button class="g-btn-symbolique -envoye" title="Cliquer pour annuler l'envoi" data-retirer-lien data-lien-libelle="${escapeHtml(libelleMesDocuments)}">✓</button>`
              : `<button class="g-btn-symbolique" title="Envoyer vers Mes Documents" data-envoyer-fichier="${fichier.id}" data-envoyer-fichier-libelle="${escapeHtml(libelleMesDocuments)}">➜</button>`)
          : ''}
        ${peutSupprimer ? `<button class="g-btn-symbolique -danger" title="Retirer ce fichier" data-supprimer-fichier="${fichier.id}">✕</button>` : ''}
      </div>
    </div>
  </div>`;
}

function rendreGrandApercu(d, estDirectionReelle) {
  const focus = etat.itemFocus;
  if (!focus) {
    const texteVide = d.role === 'client'
      ? "Sélectionnez un outil ou un élément ci-dessus pour l'afficher ici en grand."
      : "Sélectionnez un outil ou un élément ci-dessus pour l'aperçu voir ici en grand, avant de l'envoyer au client.";
    return `<div class="g-stage-vide"><div class="g-stage-vide-icone">🖥️</div><p>${texteVide}</p></div>`;
  }
  const outil = (d.tousLesOutils || []).find(o => o.id === focus.outilId);
  if (!outil) return '';
  if (outil.id === 'echange') return rendreGrandApercuEchange(d, estDirectionReelle, focus.composantId);
  const composants = COMPOSANTS[outil.id];
  const composant = focus.composantId ? (composants || []).find(c => c.id === focus.composantId) : null;
  const libelleComplet = composant ? outil.libelle + ' — ' + composant.libelle : outil.libelle;
  const envoye = (d.liensClient || []).some(l => l.libelle === libelleComplet);
  const urlEnvoi = composant ? (composant.url || outil.url) : outil.url;
  const peutEnvoyer = estDirectionReelle && !d.voirComme;
  return `<div class="g-grand-apercu">
    <div class="g-grand-image" id="grand-image"></div>
    <div class="g-grand-legende">
      <div class="g-grand-nom">${escapeHtml(libelleComplet)}</div>
      ${envoye
        ? (peutEnvoyer ? `<button class="g-grand-envoye" title="Cliquer pour annuler l'envoi" data-retirer-lien data-lien-libelle="${escapeHtml(libelleComplet)}">✓ Envoyé au client</button>` : '<span class="g-grand-envoye">✓ Envoyé au client</span>')
        : (peutEnvoyer ? `<button class="g-grand-envoyer" data-envoyer-grand data-composant-libelle="${escapeHtml(libelleComplet)}" data-composant-url="${escapeHtml(urlEnvoi)}">Envoyer au client</button>` : '')}
    </div>
  </div>`;
}

// #stage-grand est rempli ICI, à part de la reconstruction générale du
// #corps -- une vue montée nativement (avec ses propres écouteurs internes)
// ne doit jamais être redémontée simplement parce que le sondage silencieux
// de 12s a tourné ; elle n'est reconstruite que si la sélection
// (outil/composant) a réellement changé. Le bouton "Envoyer au client" vit
// dans cette même zone, donc câblé ici uniquement -- jamais via
// attacherEvenementsNegociation (qui, elle, tourne à chaque sondage et
// dupliquerait l'écouteur).
function rafraichirGrandApercu(d, estDirectionReelle) {
  const zone = document.getElementById('stage-grand');
  if (!zone) return;
  const focus = etat.itemFocus;
  // Le rôle affiché (d.role/d.voirComme) doit faire partie de la clé --
  // sinon basculer "Vue Client" en live (même outil/rien de sélectionné)
  // laisserait le contenu de la vue précédente (ex. bouton "Envoyer au
  // client") affiché à tort, contrairement à "je vois exactement comme il
  // voit" (retour du 16/09/2026).
  const cle = (focus ? focus.outilId + '::' + (focus.composantId || '') : '') + '::' + d.role + '::' + (d.voirComme || '');
  if (zone.dataset.cle === cle) return;
  zone.dataset.cle = cle;
  zone.innerHTML = rendreGrandApercu(d, estDirectionReelle);
  const btn = zone.querySelector('[data-envoyer-grand]');
  if (btn) btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: etat.negociationId, action: 'ajouter_lien_client', libelle: btn.dataset.composantLibelle, url: btn.dataset.composantUrl }) });
    // "envoyé" a changé mais pas outilId/composantId -- la "cle" seule ne le
    // détecterait pas (même bug de fond que la modale plus haut, dans l'autre
    // sens : ici il FAUT reconstruire). On invalide explicitement.
    zone.dataset.cle = '';
    await chargerNegociation();
  });
  const btnRetirer = zone.querySelector('[data-retirer-lien]');
  if (btnRetirer) btnRetirer.addEventListener('click', async (e) => {
    e.stopPropagation();
    await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: etat.negociationId, action: 'retirer_lien_client', libelle: btnRetirer.dataset.lienLibelle }) });
    zone.dataset.cle = '';
    await chargerNegociation();
  });
  const btnEnvoyerFichier = zone.querySelector('[data-envoyer-fichier]');
  if (btnEnvoyerFichier) btnEnvoyerFichier.addEventListener('click', async (e) => {
    e.stopPropagation();
    await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: etat.negociationId, action: 'ajouter_lien_client',
        libelle: btnEnvoyerFichier.dataset.envoyerFichierLibelle, url: '/api/gestion/fichier?id=' + btnEnvoyerFichier.dataset.envoyerFichier }) });
    zone.dataset.cle = '';
    await chargerNegociation();
  });
  const btnSupprimerFichier = zone.querySelector('[data-supprimer-fichier]');
  if (btnSupprimerFichier) btnSupprimerFichier.addEventListener('click', async (e) => {
    e.stopPropagation();
    await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: etat.negociationId, action: 'supprimer_fichier_partage', fichierId: Number(btnSupprimerFichier.dataset.supprimerFichier) }) });
    etat.itemFocus = { outilId: 'echange', composantId: null };
    zone.dataset.cle = '';
    await chargerNegociation();
  });
  const inputFichier = zone.querySelector('#input-fichier-partage');
  if (inputFichier) inputFichier.addEventListener('change', async () => {
    const fichier = inputFichier.files && inputFichier.files[0];
    inputFichier.value = '';
    if (!fichier) return;
    const depot = await televerserFichierPartage(fichier);
    if (!depot) return;
    zone.dataset.cle = '';
    await chargerNegociation();
  });
  if (!focus) return;
  const outil = (d.tousLesOutils || []).find(o => o.id === focus.outilId);
  const imageZone = zone.querySelector('#grand-image');
  if (!outil || !imageZone) return;
  if (outil.id === 'echange') {
    if (!focus.composantId) {
      // Le centre de l'espace de travail reste l'espace neutre habituel --
      // pas une réplique de l'icône du dossier -- tant qu'aucun fichier
      // précis n'a été cliqué (retour du 14/09/2026 : "ce n'est pas l'icône
      // ... qui s'affiche. Tu as notre espace de travail habituel").
      const dp = d.dossierPartage || { fichiers: [] };
      const texteVide = (dp.fichiers || []).length > 0
        ? "Cliquez sur un fichier ci-dessus pour l'afficher ici en grand."
        : "Aucun fichier pour l'instant -- déposez-en un avec « Déposer un fichier » ci-contre.";
      imageZone.innerHTML = `<div class="g-stage-vide"><div class="g-stage-vide-icone">🖥️</div><p>${texteVide}</p></div>`;
      return;
    }
    const fichier = ((d.dossierPartage || {}).fichiers || []).find(f => String(f.id) === String(focus.composantId));
    if (fichier && (fichier.type_mime || '').startsWith('image/')) {
      imageZone.innerHTML = `<img src="/api/gestion/fichier?id=${fichier.id}" alt="">`;
    } else {
      imageZone.innerHTML = `<div class="g-dossier-apercu-vide">${iconeFichier(fichier?.type_mime)}<p>Aperçu non disponible pour ce type de fichier -- utilisez ⇩ pour l'ouvrir.</p></div>`;
    }
    return;
  }
  if (outil.id === 'captures' || (outil.id === 'licences' && focus.composantId)) {
    const composants = COMPOSANTS[outil.id];
    const composant = focus.composantId ? (composants || []).find(c => c.id === focus.composantId) : null;
    imageZone.innerHTML = `<img src="${escapeHtml(composant ? composant.url : outil.url)}" alt="">`;
  } else {
    montrerVueReelle(imageZone, CLE_VUE_PAR_OUTIL[outil.id]);
  }
}

function apercuComposant(outilId, comp) {
  if (outilId === 'captures' || outilId === 'licences') return `<div class="g-vignette-mini g-mock-mini-captures"><img src="${escapeHtml(comp.url)}" alt=""></div>`;
  if (outilId === 'socle') return `<div class="g-vignette-mini g-mock-mini-page"><span>${escapeHtml(comp.libelle.replace('Page ', ''))}</span></div>`;
  const symboles = { accroche: '✦', modules: '▦', pourquoi: '◈', cta: '➜' };
  return `<div class="g-vignette-mini g-mock-mini-bloc"><span>${symboles[comp.id] || '•'}</span></div>`;
}

// Retrouve l'outil (et le composant, le cas échéant) correspondant à un
// libellé de negociation_liens_client -- sert à donner au client une vraie
// vignette-image (pas un lien nu) pour ce qu'on lui a envoyé, en réutilisant
// exactement l'apparence et le Grand Aperçu déjà utilisés côté Direction.
// Trace, pour la Direction seule (Boîte noire), qu'un CLIENT RÉEL (jamais
// une équipe qui consulte ses propres outils, jamais un "voir comme") a
// réellement ouvert un document de "Mes Documents" -- pas juste "il s'est
// connecté" (retour du 14/09/2026 : "vu, ça veut dire vu réellement, il l'a
// ouvert"). Silencieux pour le client -- jamais d'accusé de réception affiché.
// "Lu", fichier par fichier -- distinct du "vu" du dossier dans son
// ensemble (marquer_dossier_partage_vu, déclenché à l'ouverture). Ouvrir le
// dossier montre la liste ; chaque fichier reste marqué "nouveau" tant qu'il
// n'a pas été cliqué lui-même (retour du 14/09/2026). Mise à jour optimiste
// immédiate (le point rouge et le compteur de la vignette disparaissent tout
// de suite, sans attendre le prochain sondage) -- l'appel serveur part en
// tâche de fond, comme marquerDocumentVuSiClient ci-dessous.
function marquerFichierLuSiNouveau(d, fichierId) {
  const dp = d.dossierPartage;
  if (!dp) return;
  const fichier = (dp.fichiers || []).find(f => String(f.id) === String(fichierId));
  if (!fichier || !fichier.nouveau) return;
  fichier.nouveau = false;
  dp.nouveaux = (dp.fichiers || []).filter(f => f.nouveau).length;
  api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ negociationId: etat.negociationId, action: 'marquer_fichier_lu', fichierId: Number(fichierId) }) });
}

function marquerDocumentVuSiClient(d, outilId, composantId) {
  if (d.role !== 'client' || d.monRoleReel !== 'client' || d.voirComme) return;
  const outil = (d.tousLesOutils || []).find(o => o.id === outilId);
  if (!outil) return;
  const composant = composantId ? (COMPOSANTS[outilId] || []).find(c => c.id === composantId) : null;
  const libelle = composant ? outil.libelle + ' — ' + composant.libelle : outil.libelle;
  if (!(d.liensClient || []).some(l => l.libelle === libelle)) return;
  api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ negociationId: etat.negociationId, action: 'marquer_document_vu', libelle }) });
}

function trouverOutilEtComposantParLibelle(d, libelle) {
  for (const outil of (d.tousLesOutils || [])) {
    if (outil.libelle === libelle) return { outil, composant: null };
    for (const composant of (COMPOSANTS[outil.id] || [])) {
      if (outil.libelle + ' — ' + composant.libelle === libelle) return { outil, composant };
    }
  }
  return null;
}

// Vue restreinte du client (et de la Direction en "voir comme lui") : "Mes
// Documents" ne montre QUE ce qui a été explicitement envoyé -- jamais le
// catalogue complet -- consigne du 14/09/2026, pour que le nom soit vrai.
// Retourne juste les cartes (pas d'enveloppe) -- combinées avec la carte du
// dossier d'échange dans UNE seule bande par rendreStageOutils (retour du
// 14/09/2026 : "sur la même ligne", jamais une bande à part).
function rendreCartesMesDocuments(d) {
  const liens = d.liensClient || [];
  return liens.map(lien => {
    const trouve = trouverOutilEtComposantParLibelle(d, lien.libelle);
    if (!trouve) return '';
    const { outil, composant } = trouve;
    const apercu = composant ? apercuComposant(outil.id, composant) : apercuOutil(outil.id);
    const focusee = etat.itemFocus && etat.itemFocus.outilId === outil.id && (etat.itemFocus.composantId || null) === (composant ? composant.id : null);
    const attrClic = composant ? `data-focus-composant="${outil.id}::${composant.id}"` : `data-focus-outil="${outil.id}"`;
    return `<div class="g-vignette-carte -cliquable ${focusee ? '-ouverte' : ''}" ${attrClic} title="${escapeHtml(lien.libelle)}">
      <div class="g-vignette-image-wrap">${apercu}</div>
      <div class="g-vignette-ligne"><span class="g-vignette-nom">${escapeHtml(lien.libelle)}</span></div>
    </div>`;
  }).join('');
}

// Vignette-dossier (première ligne) et bande de contenu (deuxième ligne) du
// dossier d'échange -- factorisées car réutilisées à l'identique côté
// équipe (une vignette parmi d'autres dans la bande) ET côté client (sa
// propre petite section, à part de "Mes Documents").
function rendreCarteEchange(d) {
  const ouvert = etat.outilOuvert === 'echange';
  const outil = (d.tousLesOutils || []).find(o => o.id === 'echange');
  const libelle = outil ? outil.libelle : 'Échange de Fichiers';
  const dp = d.dossierPartage || { total: 0, nouveaux: 0 };
  // Les chiffres vivent DANS la zone sombre de l'icône (comme les autres
  // badges de vignette), jamais dans une ligne blanche à part en dessous --
  // ça gonflait la carte plus haut que toutes ses voisines (retour du
  // 14/09/2026 : "l'espace réservé en bas [devenu] beaucoup plus grand").
  return `<div class="g-vignette-carte -cliquable g-carte-dossier ${ouvert ? '-ouverte' : ''}" data-ouvrir-outil="echange" title="${escapeHtml(libelle)}">
    <div class="g-vignette-image-wrap g-dossier-icone-wrap"><div class="g-dossier-icone-cadre">${iconeDossier(dp.total > 0)}
      ${dp.total > 0 ? `<span class="g-dossier-total" title="Fichiers au total">${dp.total}</span>` : ''}
      ${dp.nouveaux > 0 ? `<span class="g-dossier-nouveaux" title="${dp.nouveaux} nouveau(x) depuis votre dernière visite">${dp.nouveaux}</span>` : ''}
    </div></div>
    <div class="g-vignette-ligne"><span class="g-vignette-nom">${escapeHtml(libelle)}</span><span class="g-chevron">${ouvert ? '︿' : '›'}</span></div>
  </div>`;
}
function rendreBandeEchange(d) {
  const fichiers = (d.dossierPartage || {}).fichiers || [];
  // Le bouton est un <label for> qui enveloppe directement l'input caché --
  // le sélecteur de fichiers s'ouvre nativement, en un clic, sans dépendre
  // d'un écouteur JS ni d'un détour par le Grand Aperçu (retour du
  // 14/09/2026 : "ce bouton ne travaille pas").
  return `<div class="g-bande-zone -niveau2">
    <div class="g-bande-titre"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b>Échange de Fichiers</b>${texteCompteurDossier(d.dossierPartage)}</div>
      <label class="g-inline-btn" for="input-fichier-partage-bande">+ Ajouter un fichier<input type="file" id="input-fichier-partage-bande" accept="${ACCEPT_FICHIER_PARTAGE}" hidden></label>
    </div>
    <div class="g-bande-outils g-bande-composants">` +
    (fichiers.length
      ? fichiers.map(f => {
          const focusee = etat.itemFocus && etat.itemFocus.outilId === 'echange' && etat.itemFocus.composantId === String(f.id);
          return `<div class="g-vignette-carte -cliquable ${focusee ? '-ouverte' : ''} ${f.nouveau ? '-nouveau' : ''}" data-focus-fichier="${f.id}" title="${escapeHtml(f.nom_fichier)}${f.nouveau ? ' (nouveau)' : ''}">
            <div class="g-vignette-image-wrap g-dossier-icone-wrap">${iconeFichier(f.type_mime)}${f.nouveau ? '<span class="g-point-nouveau"></span>' : ''}</div>
            <div class="g-vignette-ligne"><span class="g-vignette-nom">${escapeHtml(f.nom_fichier)}</span></div>
          </div>`;
        }).join('')
      : '<p class="g-hint">Rien pour l\'instant -- déposez un fichier avec le bouton ci-dessus.</p>') + '</div></div>';
}

function rendreStageOutils(d, etapeActuelle, estDirectionReelle) {
  if (d.role === 'client') {
    // UNE SEULE ligne pour le client -- le dossier d'échange à l'extrémité
    // gauche, puis "Mes Documents" (envois choisis par Direction) juste à
    // sa suite, jamais une bande à part par item -- consigne du 14/09/2026,
    // ferme : "pourquoi trois lignes... nous faisons tout pour éviter de
    // surcharger la page". Un seul bouton de repli pour tout le bloc.
    // Le compteur (total + non lus) manquait ici -- posé seulement côté
    // équipe jusqu'ici (retour du 14/09/2026 : "tu as fait quelque chose
    // mais d'un seul côté... ces informations n'existent même pas du côté
    // client... bien plus quand c'est fermé parce que c'est beaucoup plus
    // important à ce niveau"). Même texteCompteurDossier() que côté équipe,
    // visible que le bloc soit ouvert ou replié.
    const enteteClient = `<div class="g-stage-entete"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="g-stage-titre">Mes Documents</div>${texteCompteurDossier(d.dossierPartage)}</div><button class="g-toggle-outils" id="btn-toggle-outils" title="${etat.outilsReplies ? 'Déplier' : 'Replier'}">${etat.outilsReplies ? '▾' : '▴'}</button></div>`;
    if (etat.outilsReplies) {
      return `<div class="g-bande-zone -niveau1">${enteteClient}</div>`;
    }
    const cartesDocuments = rendreCartesMesDocuments(d);
    let htmlClient = `<div class="g-bande-zone -niveau1">${enteteClient}<div class="g-bande-outils">${rendreCarteEchange(d)}${cartesDocuments}</div>` +
      (cartesDocuments ? '' : '<p class="g-hint">Rien pour l\'instant -- votre interlocuteur EVOTEX vous enverra ici les documents utiles à votre projet.</p>') +
      '</div>';
    if (etat.outilOuvert === 'echange') htmlClient += rendreBandeEchange(d);
    return htmlClient;
  }
  const peutEnvoyer = estDirectionReelle && !d.voirComme;
  const dejaAjoute = (libelle) => (d.liensClient || []).some(l => l.libelle === libelle);
  const recommandes = etapeActuelle?.recommandes || [];
  const outilsTries = [...(d.tousLesOutils || [])].sort((a, b) => recommandes.includes(b.id) - recommandes.includes(a.id));

  // Le total de documents (et le nombre non lus) est écrit juste avant le
  // bouton de repli -- consigne du 14/09/2026, pour que le négociateur le
  // voie même quand la bande "Échange de Fichiers" est repliée/fermée.
  const entete = `<div class="g-stage-entete"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="g-stage-titre">Outils de négociation</div>${texteCompteurDossier(d.dossierPartage)}</div><button class="g-toggle-outils" id="btn-toggle-outils" title="${etat.outilsReplies ? 'Déplier les outils' : 'Replier les outils'}">${etat.outilsReplies ? '▾' : '▴'}</button></div>`;
  if (etat.outilsReplies) {
    return `<div class="g-bande-zone -niveau1">${entete}</div>`;
  }

  let html = `<div class="g-bande-zone -niveau1">${entete}
    <div class="g-bande-outils">` +
    outilsTries.map(o => {
      const estRecommande = recommandes.includes(o.id);
      const composants = COMPOSANTS[o.id];
      const ouvert = etat.outilOuvert === o.id;
      if (o.id === 'echange') return rendreCarteEchange(d);
      if (composants) {
        const nbEnvoyes = composants.filter(c => dejaAjoute(o.libelle + ' — ' + c.libelle)).length;
        const complet = nbEnvoyes === composants.length;
        // La ligne du haut (l'outil entier -- "la version complète") a
        // besoin de son propre envoi, indépendant des composants du bas --
        // consigne du 14/09/2026 : sans ça, aucun moyen de donner au client
        // le tout, seulement les morceaux.
        const envoyeEntier = dejaAjoute(o.libelle);
        return `<div class="g-vignette-carte -cliquable ${ouvert ? '-ouverte' : ''}" data-ouvrir-outil="${o.id}" title="${escapeHtml(o.libelle)}">
          <div class="g-vignette-image-wrap">${apercuOutil(o.id)}
            ${estRecommande ? '<span class="g-vignette-badge-recommande" title="Recommandé à cette étape"></span>' : ''}
            ${complet ? '<span class="g-vignette-badge-complet" title="Tout envoyé">✓</span>' : ''}
          </div>
          <div class="g-vignette-ligne"><span class="g-vignette-nom">${escapeHtml(o.libelle)}</span><span class="g-vignette-action">
            ${envoyeEntier
              ? (peutEnvoyer ? `<button class="g-btn-symbolique -envoye" title="Cliquer pour annuler l'envoi" data-retirer-lien data-lien-libelle="${escapeHtml(o.libelle)}">✓</button>` : '<span class="-envoye" title="Envoyé au client">✓</span>')
              : (peutEnvoyer ? `<button class="g-btn-symbolique" title="Envoyer le tout au client" data-ajouter-outil="${escapeHtml(o.libelle)}" data-ajouter-outil-url="${escapeHtml(o.url)}">➜</button>` : '')}
            <span class="g-chevron">${ouvert ? '︿' : '›'}</span>
          </span></div>
        </div>`;
      }
      const envoye = dejaAjoute(o.libelle);
      const focusee = etat.itemFocus && etat.itemFocus.outilId === o.id && !etat.itemFocus.composantId;
      return `<div class="g-vignette-carte -cliquable ${focusee ? '-ouverte' : ''}" data-focus-outil="${o.id}" title="${escapeHtml(o.libelle)}">
        <div class="g-vignette-image-wrap">${apercuOutil(o.id)}
          ${estRecommande ? '<span class="g-vignette-badge-recommande" title="Recommandé à cette étape"></span>' : ''}
        </div>
        <div class="g-vignette-ligne"><span class="g-vignette-nom">${escapeHtml(o.libelle)}</span><span class="g-vignette-action">
          ${envoye
            ? (peutEnvoyer ? `<button class="g-btn-symbolique -envoye" title="Cliquer pour annuler l'envoi" data-retirer-lien data-lien-libelle="${escapeHtml(o.libelle)}">✓</button>` : '<span class="-envoye" title="Envoyé au client">✓</span>')
            : (peutEnvoyer ? `<button class="g-btn-symbolique" title="Envoyer au client" data-ajouter-outil="${escapeHtml(o.libelle)}" data-ajouter-outil-url="${escapeHtml(o.url)}">➜</button>` : '')}
        </span></div>
      </div>`;
    }).join('') + '</div></div>';

  if (etat.outilOuvert === 'echange') {
    html += rendreBandeEchange(d);
    return html;
  }

  if (etat.outilOuvert) {
    const outil = (d.tousLesOutils || []).find(o => o.id === etat.outilOuvert);
    const composants = COMPOSANTS[etat.outilOuvert] || [];
    const restants = composants.filter(c => !dejaAjoute(outil.libelle + ' — ' + c.libelle));
    html += `<div class="g-bande-zone -niveau2">
      <div class="g-bande-titre"><b>${escapeHtml(outil.libelle)}</b>${peutEnvoyer && restants.length ? '<button class="g-inline-btn" id="btn-tout-envoyer">Tout envoyer (' + restants.length + ')</button>' : ''}</div>
      <div class="g-bande-outils g-bande-composants">` +
      composants.map(c => {
        const libelleComplet = outil.libelle + ' — ' + c.libelle;
        const envoye = dejaAjoute(libelleComplet);
        const focusee = etat.itemFocus && etat.itemFocus.outilId === outil.id && etat.itemFocus.composantId === c.id;
        return `<div class="g-vignette-carte -cliquable ${focusee ? '-ouverte' : ''}" data-focus-composant="${outil.id}::${c.id}" title="${escapeHtml(c.libelle)}">
          <div class="g-vignette-image-wrap">${apercuComposant(etat.outilOuvert, c)}</div>
          <div class="g-vignette-ligne"><span class="g-vignette-nom">${escapeHtml(c.libelle)}</span><span class="g-vignette-action">
            ${envoye
              ? (peutEnvoyer ? `<button class="g-btn-symbolique -envoye" title="Cliquer pour annuler l'envoi" data-retirer-lien data-lien-libelle="${escapeHtml(libelleComplet)}">✓</button>` : '<span class="-envoye" title="Envoyé">✓</span>')
              : (peutEnvoyer ? `<button class="g-btn-symbolique" title="Envoyer" data-ajouter-composant data-composant-libelle="${escapeHtml(libelleComplet)}" data-composant-url="${escapeHtml(c.url || outil.url)}">➜</button>` : '')}
          </span></div>
        </div>`;
      }).join('') + '</div></div>';
  }
  return html;
}

function rendreMenuMembre(m, peutAgir) {
  return `<div class="g-membre-menu">
    <div class="g-membre-menu-nom">${escapeHtml(m.nom)} · ${escapeHtml(libelleRole(m.role, m.titre_autre))}</div>
    ${peutAgir ? `<button data-voircomme="${m.utilisateur_id}">Voir comme</button>` : ''}
    ${peutAgir && m.role !== 'direction' ? `<button data-lien-invitation="${m.utilisateur_id}">Lien d'accès</button>` : ''}
    ${peutAgir ? `<button data-reinitialiser="${m.utilisateur_id}" data-reinitialiser-nom="${escapeHtml(m.nom)}">Réinitialiser le mot de passe</button>` : ''}
    ${peutAgir ? `<button data-forcer-deconnexion="${m.utilisateur_id}">Forcer la déconnexion</button>` : ''}
    ${peutAgir && m.role !== 'direction' ? `<button class="-danger" data-retirer="${m.utilisateur_id}">Retirer de la négociation</button>` : ''}
    ${!peutAgir ? '<div class="g-hint" style="padding:6px 8px">Lecture seule.</div>' : ''}
  </div>`;
}

// ---- Colonne latérale unifiée : Tchat Client / Notes / Échanges internes ----
// Toujours en dessous de l'en-tête, jamais à côté (l'en-tête garde toujours
// la même forme). Rétractable en fine bande comme la barre latérale gauche,
// largeur réglable à la souris (mémorisée), mais modeste par défaut.

// Bascule -- retour de l'utilisateur du 14/09/2026 : recliquer sur l'icône
// déjà active (Tchat Client / Notes / Échanges) referme le panneau au lieu
// de ne rien faire, pour les 3 icônes, que ce soit depuis la bande repliée,
// les onglets ouverts, ou le nouvel accès rapide du bandeau du haut (mobile).
function ouvrirOngletColonne(id) {
  if (!etat.colonneRepliee && etat.colonneOnglet === id) { reduireColonne(); return; }
  etat.colonneOnglet = id;
  etat.colonneRepliee = false;
  localStorage.setItem(CLE_COLONNE_REPLIEE, '0');
  localStorage.setItem(CLE_COLONNE_ONGLET, id);
  if (id === 'chat') marquerChatVu();
  if (etat.panneau === 'negociation') rendreNegociation();
  else rendreColonneLaterale(etat.detail);
}

function reduireColonne() {
  etat.colonneRepliee = true;
  localStorage.setItem(CLE_COLONNE_REPLIEE, '1');
  if (etat.panneau === 'negociation') rendreNegociation();
  else rendreColonneLaterale(etat.detail);
}

function rendreColonneLaterale(d) {
  const colonne = document.getElementById('colonne-laterale');
  if (!colonne) return;
  // Retour du 16/09/2026, tranché : le client garde cette même colonne
  // partagée -- mais UNIQUEMENT l'onglet Tchat (Notes/Échanges sont des
  // consignes internes, jamais pour lui). Forcé ici, pas juste caché --
  // un client ne doit jamais pouvoir se retrouver sur "notes"/"notif" même
  // via un vieux localStorage d'un compte interne utilisé sur ce navigateur.
  if (d.role === 'client' && etat.colonneOnglet !== 'chat') etat.colonneOnglet = 'chat';
  const onglets = d.role === 'client' ? ONGLETS_COLONNE.filter(o => o.id === 'chat') : ONGLETS_COLONNE;
  colonne.classList.toggle('-repliee', etat.colonneRepliee);
  // Le panneau latéral droit n'est plus jamais entièrement désactivé chez le
  // client (retour du 14/09/2026, revenu sur la décision du 14/09/2026 qui
  // masquait tout au repos) -- son seul accès au tchat était alors le bouton
  // de l'en-tête, désormais supprimé au profit de la SEULE barre fixe en
  // pied de page ("le tchat reste en pied de page fixe... jamais ailleurs") ;
  // le garder masqué ici aurait laissé le client sans aucun accès (bug
  // remonté par l'utilisateur : "la page est blanche... on ne voit pas les
  // boutons du chat"). Le client garde une seule icône (Tchat), les autres
  // onglets restant filtrés juste au-dessus.
  const nbNonLus = nbMessagesClientNonLus(d);
  const nbMessagesInternes = (d.messages || []).length;
  const pastilleDe = (id) => id === 'chat' ? (nbNonLus ? `<span class="g-badge-compte">${nbNonLus}</span>` : '')
    : id === 'notif' ? (nbMessagesInternes ? '<span class="g-pastille-onglet"></span>' : '') : '';

  if (etat.colonneRepliee) {
    // Le style en ligne posé par la poignée de redimensionnement doit être
    // effacé ici, sinon il prime sur la classe -repliee et le panneau reste
    // visuellement grand ouvert (bug du 14/09/2026).
    colonne.style.width = '';
    colonne.innerHTML = `<div class="g-colonne-repliee-barre">
      <button class="g-toggle-colonne" id="btn-toggle-colonne" title="Ouvrir">←</button>
      ${onglets.map(o => `<button class="g-colonne-icone-repliee ${o.id === 'chat' && nbNonLus ? '-pulse' : ''}" data-ouvrir-onglet="${o.id}" title="${escapeHtml(o.titre)}">${iconeOnglet(o.id)}${pastilleDe(o.id)}</button>`).join('')}
    </div>`;
    document.getElementById('btn-toggle-colonne').addEventListener('click', () => ouvrirOngletColonne(etat.colonneOnglet));
    colonne.querySelectorAll('[data-ouvrir-onglet]').forEach(btn => btn.addEventListener('click', () => ouvrirOngletColonne(btn.dataset.ouvrirOnglet)));
    return;
  }

  const largeurMemo = Number(localStorage.getItem(CLE_COLONNE_LARGEUR));
  if (largeurMemo) colonne.style.width = largeurMemo + 'px';

  let corps = '', pied = '';
  if (etat.colonneOnglet === 'chat') {
    const messages = d.messagesClient || [];
    const verrouille = !!d.verrouille;
    // Le client n'est JAMAIS bloqué par un ticket expiré (retour du
    // 16/09/2026 : seul le négociateur l'est) -- et peut désormais écrire
    // ici lui-même, dans cette même colonne partagée.
    const peutEcrire = (d.role === 'direction' || d.role === 'negociateur' || d.role === 'client') && !d.voirComme
      && !(verrouille && d.role !== 'direction' && d.role !== 'client');
    // Jamais le vrai nom de qui répond pour un client (retour du
    // 16/09/2026 : "même lorsqu'on change d'interlocuteur, il ne le
    // saurait pas") -- seule LA VUE du client anonymise ; l'équipe interne,
    // en regardant cette même colonne, continue de voir les vrais noms.
    const nomAffiche = (m) => String(m.auteur_id) === String(etat.moi.id) ? null : (d.role === 'client' ? 'EVOTEX' : m.auteur_nom);
    corps = `<div class="g-msg-liste" id="chat-colonne-liste">${messages.length ? rendreFilMessages(messages, d, 'client', nomAffiche)
      : '<div class="g-hint">Aucun échange avec le client pour l\'instant.</div>'}</div>`;
    pied = peutEcrire ? `<div class="g-form-row" style="position:relative"><textarea id="chat-colonne-texte" rows="2" placeholder="${d.role === 'client' ? 'Écrire à EVOTEX…' : 'Écrire au client…'}"></textarea>${rendreZoneEnregistrement('chat')}</div><div class="g-form-row" style="justify-content:flex-end;gap:8px"><button class="g-btn-icone-tchat" id="btn-vocal-chat" title="Message vocal">${iconeMicro()}</button><label class="g-btn-icone-tchat" for="input-piece-jointe-chat" title="Joindre un fichier">${iconeTrombone()}<input type="file" id="input-piece-jointe-chat" accept="${ACCEPT_FICHIER_PARTAGE}" hidden></label><button id="btn-envoyer-chat-colonne">Envoyer</button></div>`
      : (verrouille && d.role !== 'direction' ? '<div class="g-hint">Verrouillé — ticket expiré.</div>' : '');
  } else if (etat.colonneOnglet === 'notes') {
    const autres = (d.notesEquipe || []).filter(n => String(n.auteur_id) !== String(etat.moi.id) && n.texte && n.texte.trim());
    corps = `<div style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#94a3b8;font-weight:800;margin-bottom:8px">Ma note</div>
      <textarea id="mes-notes" class="g-notes-mine" rows="4" placeholder="Notes prises pendant la discussion…" ${d.voirComme ? 'disabled' : ''}>${escapeHtml(d.maNote || '')}</textarea>
      <div class="g-hint" id="notes-statut">${d.voirComme ? "Lecture seule en mode \"voir comme\"." : 'Enregistrement automatique.'}</div>
      <div class="g-notes-separateur">Notes des autres membres</div>
      <div class="g-liste">${autres.length ? autres.map(n => `<div class="g-item" style="align-items:flex-start"><div class="info"><b>${escapeHtml(n.auteur_nom)}</b><span>${escapeHtml(n.texte)}</span></div></div>`).join('')
        : '<div class="g-hint">Aucune note enregistrée par l\'équipe pour l\'instant.</div>'}</div>`;
  } else {
    const messages = d.messages || [];
    const peutEcrire = d.role !== 'client' && d.role !== 'apporteur' && d.role !== 'autre' && !d.voirComme;
    corps = `<div class="g-msg-liste">${messages.length ? rendreFilMessages(messages, d, 'interne', (m) => m.auteur_nom)
      : '<div class="g-hint">Aucun message pour l\'instant.</div>'}</div>`;
    pied = peutEcrire ? `<div class="g-form-row" style="position:relative"><textarea id="msg-texte" rows="2" placeholder="Écrire à l'équipe…"></textarea>${rendreZoneEnregistrement('interne')}</div><div class="g-form-row" style="justify-content:flex-end;gap:8px"><button class="g-btn-icone-tchat" id="btn-vocal-interne" title="Message vocal">${iconeMicro()}</button><label class="g-btn-icone-tchat" for="input-piece-jointe-interne" title="Joindre un fichier">${iconeTrombone()}<input type="file" id="input-piece-jointe-interne" accept="${ACCEPT_FICHIER_PARTAGE}" hidden></label><button id="btn-envoyer-message">Envoyer</button></div>` : '';
  }

  colonne.innerHTML = `
    <div class="g-colonne-resize" id="colonne-resize"></div>
    <div class="g-colonne-top">
      ${onglets.map(o => `<button class="g-colonne-onglet ${etat.colonneOnglet === o.id ? '-actif' : ''}" data-onglet="${o.id}" title="${escapeHtml(o.titre)}">${iconeOnglet(o.id)}${pastilleDe(o.id)}</button>`).join('')}
      <button class="g-toggle-colonne" id="btn-toggle-colonne" title="Réduire">→</button>
    </div>
    <div class="g-colonne-corps">${corps}</div>
    ${pied ? `<div class="g-colonne-pied">${pied}</div>` : ''}
  `;

  document.getElementById('btn-toggle-colonne').addEventListener('click', reduireColonne);
  colonne.querySelectorAll('[data-onglet]').forEach(btn => btn.addEventListener('click', () => ouvrirOngletColonne(btn.dataset.onglet)));
  attacherRedimensionnementColonne(colonne);

  const btnEnvoyerChat = document.getElementById('btn-envoyer-chat-colonne');
  if (btnEnvoyerChat) btnEnvoyerChat.addEventListener('click', async () => {
    const champ = document.getElementById('chat-colonne-texte');
    const texte = champ.value.trim();
    if (!texte) return;
    // Vidé tout de suite -- sinon le mécanisme qui préserve un brouillon en
    // cours de saisie (retour du 14/09/2026) préserve aussi, par erreur, le
    // message qu'on vient d'envoyer, qui réapparaît dupliqué dans le champ.
    champ.value = '';
    const rep = await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: etat.negociationId, action: 'poster_message_client', texte }) });
    if (!rep.ok) { alert(rep.erreur || 'Échec.'); champ.value = texte; return; }
    await chargerNegociation();
  });

  // Pièce jointe du tchat client -- dépose dans le même dossier d'échange
  // que "Échange de Fichiers" (source unique, mêmes droits/suppression),
  // puis annonce l'envoi par un message (retour du 14/09/2026 : "le chat
  // aussi doit pouvoir servir à ajouter des fichiers").
  const inputPieceJointeChat = document.getElementById('input-piece-jointe-chat');
  if (inputPieceJointeChat) inputPieceJointeChat.addEventListener('change', async () => {
    const fichier = inputPieceJointeChat.files && inputPieceJointeChat.files[0];
    inputPieceJointeChat.value = '';
    if (!fichier) return;
    const depot = await televerserFichierPartage(fichier);
    if (!depot) return;
    await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: etat.negociationId, action: 'poster_message_client', texte: '📎 Fichier partagé : ' + depot.nom + ' (voir Échange de Fichiers)' }) });
    await chargerNegociation();
  });

  const btnEnvoyerMsg = document.getElementById('btn-envoyer-message');
  if (btnEnvoyerMsg) btnEnvoyerMsg.addEventListener('click', async () => {
    const champ = document.getElementById('msg-texte');
    const texte = champ.value.trim();
    if (!texte) return;
    champ.value = '';
    const rep = await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: etat.negociationId, action: 'poster_message', texte }) });
    if (!rep.ok) { alert(rep.erreur || 'Échec.'); champ.value = texte; return; }
    await chargerNegociation();
  });

  const inputPieceJointeInterne = document.getElementById('input-piece-jointe-interne');
  if (inputPieceJointeInterne) inputPieceJointeInterne.addEventListener('change', async () => {
    const fichier = inputPieceJointeInterne.files && inputPieceJointeInterne.files[0];
    inputPieceJointeInterne.value = '';
    if (!fichier) return;
    const depot = await televerserFichierPartage(fichier);
    if (!depot) return;
    await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: etat.negociationId, action: 'poster_message', texte: '📎 Fichier partagé : ' + depot.nom + ' (voir Échange de Fichiers)' }) });
    await chargerNegociation();
  });

  const btnVocalChat = document.getElementById('btn-vocal-chat');
  if (btnVocalChat) btnVocalChat.addEventListener('click', () => basculerEnregistrementVocal('client'));
  const btnVocalInterne = document.getElementById('btn-vocal-interne');
  if (btnVocalInterne) btnVocalInterne.addEventListener('click', () => basculerEnregistrementVocal('interne'));
  // "Illusion de suppression" -- côté client comme côté équipe, dans le
  // même geste (retour du 14/09/2026).
  colonne.querySelectorAll('[data-supprimer-message]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.supprimerMessage);
      const canal = btn.dataset.canal;
      const action = canal === 'client' ? 'supprimer_message_client' : 'supprimer_message';
      const rep = await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ negociationId: etat.negociationId, action, id }) });
      if (!rep.ok) { alert(rep.erreur || 'Échec.'); return; }
      await chargerNegociation();
    });
  });

  const notesEl = document.getElementById('mes-notes');
  if (notesEl && !notesEl.disabled) {
    let minuterie = null;
    notesEl.addEventListener('input', () => {
      const statutEl = document.getElementById('notes-statut');
      if (statutEl) statutEl.textContent = 'Enregistrement…';
      clearTimeout(minuterie);
      minuterie = setTimeout(async () => {
        await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ negociationId: etat.negociationId, action: 'enregistrer_note', texte: notesEl.value }) });
        if (etat.detail) etat.detail.maNote = notesEl.value;
        if (statutEl) statutEl.textContent = 'Enregistré.';
      }, 800);
    });
  }

  const listeEl = document.getElementById('chat-colonne-liste');
  if (listeEl) listeEl.scrollTop = listeEl.scrollHeight;
  initialiserLecteursVocaux(colonne);
}

function attacherRedimensionnementColonne(colonne) {
  const poignee = document.getElementById('colonne-resize');
  if (!poignee) return;
  poignee.addEventListener('mousedown', (e) => {
    e.preventDefault();
    poignee.classList.add('-actif');
    document.body.style.userSelect = 'none';
    const onMove = (ev) => {
      const largeur = Math.min(Math.max(window.innerWidth - ev.clientX, 260), Math.round(window.innerWidth * 0.75));
      colonne.style.width = largeur + 'px';
    };
    const onUp = () => {
      poignee.classList.remove('-actif');
      document.body.style.userSelect = '';
      localStorage.setItem(CLE_COLONNE_LARGEUR, parseInt(colonne.style.width, 10));
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// Mot de passe simple généré automatiquement -- 6 caractères chiffres +
// lettres, jamais un mot de passe complexe (retour du 16/09/2026 : "pas de
// mot de passe complexe... six chiffres et lettres, c'est déjà bon").
// Alphabet sans 0/O/1/I pour ne jamais confondre un caractère à la lecture.
function genererMotDePasseSimple() {
  const car = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += car[Math.floor(Math.random() * car.length)];
  return s;
}

    if (!rep.ok) { alert(rep.erreur || 'Échec.'); return; }

function libelleRole(r, titreAutre) {
  if (r === 'autre') return titreAutre || 'Autre';
  // "Direction" ne s'affiche plus nulle part -- "Support" à la place (retour
  // du 14/09/2026). Le rôle technique (permissions, base de données) reste
  // "direction", inchangé -- seul l'étiquette visible change.
  return { direction: 'Support', negociateur: 'Négociateur', apporteur: "Apporteur d'affaires", client: 'Client' }[r] || r;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

  // visée d'une de ses négociations à l'autre, pas de sortir du mode. Hors
  // "voir comme", etat.voirCommeId est déjà nul -- rien ne change pour la
  // Direction qui navigue normalement entre ses propres négociations.
  if (sel) sel.addEventListener('change', async () => { etat.negociationId = Number(sel.value); etat.outilOuvert = null; etat.itemFocus = null; await chargerNegociation(); });

      await chargerNegociation();
    });

  document.querySelectorAll('[data-membre-menu]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.membreMenu);
      const nouveau = String(etat.menuMembreOuvert) === String(id) ? null : id;
      fermerTousLesPanneaux();
      etat.menuMembreOuvert = nouveau;
      rendreNegociation();
    });
  });
  document.addEventListener('click', () => {
    const estPopoverAncre = etat.panelActif === 'ticket' || etat.panelActif === 'conseil';
    if (estPopoverAncre || etat.menuMembreOuvert !== null) { etat.panelActif = estPopoverAncre ? null : etat.panelActif; etat.menuMembreOuvert = null; rendreNegociation(); }

  const btnOuvrirAjout = document.getElementById('btn-ouvrir-ajout-membre');

    e.stopPropagation();
    etat.menuMembreOuvert = null;
    etat.modalAjoutOuvert = true;
    rendreNegociation();
  });

  document.querySelectorAll('[data-voircomme]').forEach(btn => {
    btn.addEventListener('click', async (e) => {

        .map(eq => ({ negociation_id: eq.id, nom: eq.nom, membre: (eq.membres || []).find(m => String(m.utilisateur_id) === String(id) && m.actif) }))
        .filter(x => x.membre)

        // Marque le dossier "vu" dès l'ouverture -- éteint le badge
        // "nouveaux" (retour du 14/09/2026), sans bloquer le rendu immédiat.
        api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ negociationId: etat.negociationId, action: 'marquer_dossier_partage_vu' }) });
      }

  document.querySelectorAll('[data-focus-outil]').forEach(el => {
    el.addEventListener('click', () => {
      // Un outil sans composants (ex. Cahier des Charges) n'a pas de bande à
      // ouvrir -- mais s'il en restait une affichée d'un outil précédent, il
      // faut la refermer, sinon elle reste collée à l'écran (bug signalé le
      // 14/09/2026).
      etat.outilOuvert = null;
      etat.itemFocus = { outilId: el.dataset.focusOutil, composantId: null };
      marquerDocumentVuSiClient(d, el.dataset.focusOutil, null);
      rendreNegociation();
    });
  });
  document.querySelectorAll('[data-focus-composant]').forEach(el => {
    el.addEventListener('click', () => {
      const [outilId, composantId] = el.dataset.focusComposant.split('::');
      etat.itemFocus = { outilId, composantId };
      marquerDocumentVuSiClient(d, outilId, composantId);
      rendreNegociation();
    });
  });
  document.querySelectorAll('[data-focus-fichier]').forEach(el => {
    el.addEventListener('click', () => {
      const fichierId = el.dataset.focusFichier;
      etat.itemFocus = { outilId: 'echange', composantId: fichierId };
      marquerFichierLuSiNouveau(d, fichierId);
      rendreNegociation();
    });
  });

  document.querySelectorAll('[data-ajouter-outil]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ negociationId: etat.negociationId, action: 'ajouter_lien_client', libelle: btn.dataset.ajouterOutil, url: btn.dataset.ajouterOutilUrl }) });
      await chargerNegociation();
    });
  });

  // Même bouton que l'envoi, mais une fois vert (envoyé) : cliquer dessus
  // annule -- retour du 14/09/2026, pour reprendre un fichier envoyé par
  // erreur ou incohérent avant que le client ne le voie. Scopé à la zone des
  // outils (rebâtie à chaque sondage, donc jamais de doublon d'écouteur) --
  // le bouton équivalent du Grand Aperçu est câblé à part dans
  // rafraichirGrandApercu, qui, elle, ne redémonte pas à chaque sondage.
  document.querySelectorAll('#stage-outils-zone [data-retirer-lien]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ negociationId: etat.negociationId, action: 'retirer_lien_client', libelle: btn.dataset.lienLibelle }) });
      await chargerNegociation();
    });
  });

  document.querySelectorAll('[data-ajouter-composant]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ negociationId: etat.negociationId, action: 'ajouter_lien_client', libelle: btn.dataset.composantLibelle, url: btn.dataset.composantUrl }) });
      await chargerNegociation();
    });
  });

  const btnToutEnvoyer = document.getElementById('btn-tout-envoyer');
  if (btnToutEnvoyer) btnToutEnvoyer.addEventListener('click', async () => {
    const outil = (d.tousLesOutils || []).find(o => o.id === etat.outilOuvert);
    const composants = COMPOSANTS[etat.outilOuvert] || [];
    const dejaAjoute = (libelle) => (d.liensClient || []).some(l => l.libelle === libelle);
    for (const c of composants) {
      const libelleComplet = outil.libelle + ' — ' + c.libelle;
      if (dejaAjoute(libelleComplet)) continue;
      await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ negociationId: etat.negociationId, action: 'ajouter_lien_client', libelle: libelleComplet, url: c.url || outil.url }) });
    }
    await chargerNegociation();
  });

  // "+ Ajouter un fichier" de la bande -- label natif (voir rendreBandeEchange),
  // seul le dépôt reste à câbler ici.
  const inputFichierBande = document.getElementById('input-fichier-partage-bande');
  if (inputFichierBande) inputFichierBande.addEventListener('change', async () => {
    const fichier = inputFichierBande.files && inputFichierBande.files[0];
    inputFichierBande.value = '';
    if (!fichier) return;
    const depot = await televerserFichierPartage(fichier);
    if (!depot) return;
    await chargerNegociation();
  });
}

demarrer();
</script>
</body>
</html>
