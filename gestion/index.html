          <button class="-annuler" id="btn-annuler-ajout-vente">Annuler</button>
          <button id="btn-confirmer-ajout-vente" style="background:linear-gradient(135deg,#3f96ea,#1c6fd9);border:none;color:#fff;font-weight:800;font-size:12.5px;padding:9px 16px;border-radius:999px;cursor:pointer;font-family:var(--font-body)">Créer la proposition</button>
        </div>
      </div>
    </div>`;
  const majPrixSuggere = () => {
    const p = s.produits.find(x => x.id === document.getElementById('vt-produit').value);
    document.getElementById('vt-prix').value = p && p.prixVente ? fmtN(p.prixVente) : '';
  };
  majPrixSuggere();
  document.getElementById('vt-produit').addEventListener('change', majPrixSuggere);
  document.getElementById('modal-fond-vente').addEventListener('click', (e) => { if (e.target.id === 'modal-fond-vente') fermerModalVente(); });
  document.getElementById('btn-annuler-ajout-vente').addEventListener('click', fermerModalVente);
  document.getElementById('btn-confirmer-ajout-vente').addEventListener('click', () => {
    const nom = document.getElementById('vt-client').value.trim();
    const produitId = document.getElementById('vt-produit').value;
    const prixConvenu = parseN(document.getElementById('vt-prix').value);
    if (!nom) { alert('Nom du client requis.'); return; }

    let client = s.clients.find(c => c.nom.toLowerCase() === nom.toLowerCase());
    if (!client) {
      client = { id: s.nextClientLocalId++, nom, code: genererCodeUnique('CL', tousLesCodesClient()) };
      s.clients.push(client);
    }

    s.ventes.push({
      id: s.nextVenteId++, clientId: client.id, produitId, prixConvenu, statut: 'proposition',
      tvaActive: false, tvaTaux: 18,
      versements: [], nextVersementId: 1, echeances: [], nextEcheanceId: 1,
      coutsImprevus: [], nextCoutImprevuId: 1, factures: [],
    });
    fermerModalVente();
    rendreComptabilite();
  });
}
function fermerModalVente() {
  document.getElementById('modal-zone').innerHTML = '';
}

// Aperçu à tout moment, sans conséquence (retour du 16/09/2026 : "on doit
// pouvoir faire l'aperçu des documents à tout moment") -- aucun numéro
// n'est attribué ni enregistré tant que l'utilisateur ne valide pas
// explicitement. Un document déjà enregistré se rouvre via ouvrirVueFacture,
// jamais réédité.
function apercuFacture(venteId, type, versementId) {
  const facture = { id: null, code: null, type, date: new Date().toISOString().slice(0, 10), versementId: versementId || null };
  rendreVueFacture(venteId, facture, { estApercu: true });
}
function ouvrirVueFacture(venteId, factureId) {
  const vente = etatCompta.ventes.find(v => String(v.id) === venteId);
  const facture = vente && vente.factures.find(f => String(f.id) === factureId);
  if (!facture) return;
  rendreVueFacture(venteId, facture, { estApercu: false });
}

function rendreVueFacture(venteId, facture, opts) {
  const vente = etatCompta.ventes.find(v => String(v.id) === venteId);
  if (!vente) return;
  const reouvrir = () => rendreVueFacture(venteId, facture, opts);
  // L'aperçu autorise déjà l'impression (retour du 16/09/2026 : "à tout
  // moment... pour autre chose, peu importe") -- seul l'envoi par email
  // reste réservé à un document validé, avec un vrai numéro à communiquer.
  const boutonsDroite = opts.estApercu
    ? `<button id="btn-imprimer-facture" style="border:1.5px solid #1c6fd9;background:none;color:#1c6fd9;font-weight:800;font-size:12.5px;padding:7px 16px;border-radius:999px;cursor:pointer;font-family:var(--font-body)">Imprimer / Exporter en PDF</button>
       <button id="btn-valider-facture" style="background:linear-gradient(135deg,#22c55e,#15803d);border:none;color:#fff;font-weight:800;font-size:12.5px;padding:8px 16px;border-radius:999px;cursor:pointer;font-family:var(--font-body)">✓ Valider et enregistrer</button>`
    : `<button id="btn-envoyer-facture" style="border:1.5px solid #1c6fd9;background:none;color:#1c6fd9;font-weight:800;font-size:12.5px;padding:7px 16px;border-radius:999px;cursor:pointer;font-family:var(--font-body)">Envoyer par email</button>
       <button id="btn-imprimer-facture" style="background:linear-gradient(135deg,#3f96ea,#1c6fd9);border:none;color:#fff;font-weight:800;font-size:12.5px;padding:8px 16px;border-radius:999px;cursor:pointer;font-family:var(--font-body)">Imprimer / Exporter en PDF</button>`;

  document.getElementById('modal-zone').innerHTML = `
    <div class="cc-facture-overlay" id="facture-overlay">
      <div class="cc-facture-page">
        <div class="cc-no-print" style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button id="btn-infos-entreprise" class="cc-lien-facture">Informations légales</button>
            <label class="cc-lien-facture" style="cursor:pointer">Importer signature<input type="file" accept="image/*" id="input-signature" style="display:none"></label>
            <label class="cc-lien-facture" style="cursor:pointer">Importer cachet<input type="file" accept="image/*" id="input-cachet" style="display:none"></label>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button id="btn-fermer-facture" style="border:1px solid #c3d6ee;background:none;color:#475467;border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font-body)">Fermer</button>
            ${boutonsDroite}
          </div>
        </div>
        ${opts.estApercu ? '<div class="cc-apercu-bandeau cc-no-print">APERÇU -- pas encore enregistré, aucun numéro attribué</div>' : ''}
        ${htmlFacture(vente, facture)}
      </div>
    </div>`;
  document.getElementById('btn-fermer-facture').addEventListener('click', fermerVueFacture);
  document.getElementById('btn-infos-entreprise').addEventListener('click', () => rendreModalInfosEntreprise(reouvrir));
  document.getElementById('input-signature').addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    const lecteur = new FileReader();
    lecteur.onload = () => { try { localStorage.setItem(CLE_SIGNATURE, lecteur.result); } catch {} reouvrir(); };
    lecteur.readAsDataURL(file);
  });
  document.getElementById('input-cachet').addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    const lecteur = new FileReader();
    lecteur.onload = () => { try { localStorage.setItem(CLE_CACHET, lecteur.result); } catch {} reouvrir(); };
    lecteur.readAsDataURL(file);
  });

  document.getElementById('btn-imprimer-facture').addEventListener('click', () => window.print());

  if (opts.estApercu) {
    document.getElementById('btn-valider-facture').addEventListener('click', () => {
      const code = genererCodeUnique('FA', tousLesCodesFacture());
      const factureFinale = { ...facture, id: code, code };
      vente.factures.push(factureFinale);
      rafraichirClients();
      rendreVueFacture(venteId, factureFinale, { estApercu: false });
    });
    return;
  }

  document.getElementById('btn-envoyer-facture').addEventListener('click', () => {
    // Un navigateur ne peut jamais joindre un fichier à un e-mail par
    // programmation (limitation de sécurité universelle) -- le mail s'ouvre
    // prêt à l'emploi, le PDF exporté juste au-dessus reste à joindre à la main.
    const libelle = LIBELLE_TYPE_FACTURE[facture.type];
    const nomEntreprise = chargerInfosEntreprise().nom || 'EVOTEX 1.0';
    const sujet = encodeURIComponent(`${libelle} N° ${facture.code} -- ${nomEntreprise}`);
    const corps = encodeURIComponent(`Bonjour,\n\nVeuillez trouver votre ${libelle.toLowerCase()} N° ${facture.code} en pièce jointe.\n\n(Exportez d'abord ce document en PDF avec le bouton "Imprimer / Exporter en PDF", puis joignez-le ici manuellement -- un navigateur ne peut pas joindre un fichier automatiquement.)\n\nCordialement,\n${nomEntreprise}`);
    window.location.href = `mailto:?subject=${sujet}&body=${corps}`;
  });
}
function fermerVueFacture() {
  document.getElementById('modal-zone').innerHTML = '';
}

// Pro Forma / Facture portent sur le prix convenu entier ; Acompte / Reçu
// portent sur UN versement précis déjà enregistré -- jamais un montant
// inventé (retour du 16/09/2026).
function htmlFacture(vente, facture) {
  const produit = etatCompta.produits.find(p => p.id === vente.produitId);
  const client = etatCompta.clients.find(c => c.id === vente.clientId);
  const dateStr = new Date(facture.date + 'T00:00:00').toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });

  let baseHT, libelleLigne;
  if (facture.type === 'acompte' || facture.type === 'recu') {
    const versement = vente.versements.find(x => String(x.id) === String(facture.versementId));
    baseHT = parseN(versement ? versement.montant : 0);
    libelleLigne = (facture.type === 'acompte' ? 'Acompte sur ' : 'Paiement reçu pour ') + (produit ? produit.nom : '') + (versement && versement.motif ? ' -- ' + versement.motif : '');
  } else {
    baseHT = parseN(vente.prixConvenu);
    libelleLigne = produit ? produit.nom : '';
  }
  const tva = tvaCalc(vente, baseHT);
  const clientLigne = `${escapeHtml(client ? client.nom : '')} <span class="cc-client-badge">${client ? client.code : ''}</span>`;
  const codeAffiche = facture.code || 'APERÇU';

  if (facture.type === 'recu') {
    return `${htmlEnteteEntreprise('REÇU', codeAffiche, dateStr)}
      <div class="cc-facture-bloc"><div class="cc-kpi-label">Reçu de</div><div style="font-weight:800;font-size:15px">${clientLigne}</div></div>
      <p style="font-size:14px;line-height:1.7;margin:24px 0">La somme de <b>${fmtN(baseHT)} F</b>${vente.tvaActive ? ` (TVA ${vente.tvaTaux}% incluse, total ${fmtN(tva.total)} F)` : ''} au titre de : ${escapeHtml(libelleLigne)}.</p>
      <div class="g-hint">Reçu généré automatiquement -- ne constitue pas une facture.</div>
      ${htmlPiedFacture(vente, facture, client, tva, dateStr)}`;
  }

  const TITRES = { proforma: 'FACTURE PRO FORMA', facture: 'FACTURE', acompte: "FACTURE D'ACOMPTE" };
  return `${htmlEnteteEntreprise(TITRES[facture.type], codeAffiche, dateStr)}
    <div class="cc-facture-bloc"><div class="cc-kpi-label">Client</div><div style="font-weight:800;font-size:15px">${clientLigne}</div></div>
    <table class="cc-facture-table">

  if (infos.nif) lignes.push('NIF : ' + escapeHtml(infos.nif));

// QR généré localement (aucun appel réseau, aucune donnée client envoyée à
// un tiers) -- retour du 16/09/2026 : "ça fait plus professionnel".
function svgQRCode(texte, taille) {
  if (typeof QRCode === 'undefined') return '';
  try {
    const conteneur = document.createElement('div');
    // typeNumber assez grand pour ne jamais déborder sur un texte de
    // référence court -- une erreur ici ne doit jamais casser tout le
    // document, juste priver ce document de QR (retour du 16/09/2026).
    new QRCode(conteneur, { text: texte, width: taille, height: taille, correctLevel: QRCode.CorrectLevel.M, typeNumber: 10 });
    const img = conteneur.querySelector('img');
    const canvas = conteneur.querySelector('canvas');
    const src = (img && img.src) || (canvas && canvas.toDataURL());
    return src ? `<img src="${src}" width="${taille}" height="${taille}" alt="QR code du document">` : '';
  } catch {
    return '';
  }
}

function htmlPiedFacture(vente, facture, client, tva, dateStr) {
  // Pas de QR tant que le document n'est qu'un aperçu -- rien à référencer
  // avant l'attribution d'un vrai numéro (retour du 16/09/2026).
  const texteQR = facture.code ? `${facture.code} -- ${LIBELLE_TYPE_FACTURE[facture.type]} -- ${fmtN(tva.total)} F TTC -- ${client ? client.code : ''} -- ${dateStr}` : null;
  const signature = chargerImage(CLE_SIGNATURE);
  const cachet = chargerImage(CLE_CACHET);
  return `<div class="cc-facture-pied">
    <div class="cc-facture-qr">${texteQR ? svgQRCode(texteQR, 84) + '<div class="g-hint" style="margin-top:4px">Référence du document</div>' : ''}</div>
    <div class="cc-facture-signature">
      <div class="cc-facture-signature-case">
        <div class="g-hint">Signature</div>
        ${signature ? `<img src="${signature}" alt="Signature">` : '<div class="cc-facture-signature-vide"></div>'}
      </div>
      <div class="cc-facture-signature-case">
        <div class="g-hint">Cachet</div>
        ${cachet ? `<img src="${cachet}" alt="Cachet">` : '<div class="cc-facture-signature-vide"></div>'}
      </div>
    </div>
  </div>`;
}

function attacherEvenementsCompta() {
  const corps = document.getElementById('cc-stage');

  const btnToggle = document.getElementById('cc-toggle-details');
  if (btnToggle) btnToggle.addEventListener('click', () => { etatCompta.showDetails = !etatCompta.showDetails; rafraichirCompta(); });

  corps.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => { etatCompta.costTab = btn.dataset.tab; rafraichirCompta(); }));
  corps.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', () => { etatCompta.mode = btn.dataset.mode; rafraichirCompta(); }));

  // Gestionnaires génériques -- partagés entre le Calculateur et les
  // listes de tout autre pilier (ex. les mouvements de La Caisse), d'où le
  // passage par rafraichirPilier() qui redirige vers le bon rendu.
  const CHAMPS_TEXTE = new Set(['label', 'justification', 'type', 'motif', 'categorie', 'produitId', 'nom', 'poste', 'titre', 'date']);
  corps.querySelectorAll('[data-champ]').forEach(input => {
    const evenement = input.tagName === 'SELECT' ? 'change' : 'input';
    input.addEventListener(evenement, () => {
      const champ = input.dataset.champ;
      const brut = CHAMPS_TEXTE.has(champ) ? input.value : parseN(input.value);
      if (input.dataset.liste) {
        const liste = etatCompta[input.dataset.liste];
        const item = liste.find(x => String(x.id) === input.dataset.id);
        if (item) item[champ] = brut;
      } else {
        etatCompta[champ] = brut;
      }
      rafraichirPilier();
    });
  });
  corps.querySelectorAll('[data-champ-bool]').forEach(input => {
    input.addEventListener('change', () => { etatCompta[input.dataset.champBool] = input.checked; rafraichirPilier(); });
  });

  corps.querySelectorAll('[data-ajouter]').forEach(btn => btn.addEventListener('click', () => {
    const liste = btn.dataset.ajouter;
    etatCompta[liste].push({ id: etatCompta.nextId++, label: 'Nouvelle charge', amount: 0 });
    rafraichirPilier();
  }));
  corps.querySelectorAll('[data-ajouter-module]').forEach(btn => btn.addEventListener('click', () => {
    const liste = btn.dataset.ajouterModule;
    etatCompta[liste].push({ id: etatCompta.nextModId++, label: 'Module complémentaire', amount: 0 });
    rafraichirPilier();
  }));
  corps.querySelectorAll('[data-ajouter-commission]').forEach(btn => btn.addEventListener('click', () => {
    const cfg = champsMode(btn.dataset.ajouterCommission);
    etatCompta[cfg.commissions].push({ id: etatCompta[cfg.nextId]++, label: 'Nouvelle commission', justification: '', type: 'pct', value: 0 });
    rafraichirPilier();
  }));
  corps.querySelectorAll('[data-ajouter-charge-fixe]').forEach(btn => btn.addEventListener('click', () => {
    const liste = btn.dataset.ajouterChargeFixe;
    etatCompta[liste].push({ id: etatCompta.nextChargeFixeId++, motif: 'Nouvelle charge fixe', montant: 0, categorie: 'autre' });
    rafraichirPilier();
  }));
  corps.querySelectorAll('[data-ajouter-depense-jour]').forEach(btn => btn.addEventListener('click', () => {
    const liste = btn.dataset.ajouterDepenseJour;
    etatCompta[liste].push({ id: etatCompta.nextDepenseJourId++, motif: 'Nouvelle dépense', montant: 0, date: new Date().toISOString().slice(0, 10) });
    rafraichirPilier();
  }));
  corps.querySelectorAll('[data-depense-onglet]').forEach(btn => btn.addEventListener('click', () => {
    etatCompta.depenseOnglet = btn.dataset.depenseOnglet;
    rafraichirPilier();
  }));
  corps.querySelectorAll('[data-ajouter-employe]').forEach(btn => btn.addEventListener('click', () => {
    rendreModalAjoutEmploye();
  }));
  corps.querySelectorAll('[data-liste-retirer]').forEach(btn => btn.addEventListener('click', () => {
    const liste = btn.dataset.listeRetirer;
    etatCompta[liste] = etatCompta[liste].filter(x => String(x.id) !== btn.dataset.id);
    rafraichirPilier();
  }));
}

// ---- Ticket / chrono ----
function formatDuree(ms) {
  if (ms <= 0) return '0min';
  const totalMin = Math.floor(ms / 60000);
  const j = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  if (j > 0) return j + 'j ' + h + 'h';
  if (h > 0) return h + 'h ' + m + 'min';
  return m + 'min';
}
// Variantes abrégées du badge ticket (point 1, retour de l'utilisateur du
// 14/09/2026) -- pour tenir sur la même ligne que les pastilles de membres
// à toutes les tailles. "-11h43" (tablette), "-11h" (mobile étroit) ; voir
// .g-ticket-texte-large/tablette/mobile (CSS) pour le choix d'affichage.
function formatDureeCourt(ms) {
  if (ms <= 0) return '0min';
  const totalMin = Math.floor(ms / 60000);
  const j = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  if (j > 0) return j + 'j' + (h > 0 ? h + 'h' : '');
  if (h > 0) return h + 'h' + String(m).padStart(2, '0');
  return m + 'min';
}
function formatDureeUltraCourt(ms) {
  if (ms <= 0) return '0min';
  const totalMin = Math.floor(ms / 60000);
  const j = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  if (j > 0) return j + 'j';
  if (h > 0) return h + 'h';
  return m + 'min';
}

function actualiserChrono() {
  const elLarge = document.getElementById('chrono-texte-large');
  if (!elLarge || !etat.detail || !etat.detail.negociation) return;
  const elTablette = document.getElementById('chrono-texte-tablette');
  const elMobile = document.getElementById('chrono-texte-mobile');
  const nego = etat.detail.negociation;
  if (!nego.ticket_expire_le) return;
  const reste = new Date(nego.ticket_expire_le).getTime() - Date.now();
  if (reste > 0) {
    elLarge.textContent = formatDuree(reste) + ' restant';
    elTablette.textContent = formatDureeCourt(reste);
    elMobile.textContent = formatDureeUltraCourt(reste);
    return;
  }
  if (nego.etape < 6) {
    elLarge.textContent = 'Expiré depuis ' + formatDuree(-reste);
    elTablette.textContent = '-' + formatDureeCourt(-reste);
    elMobile.textContent = '-' + formatDureeUltraCourt(-reste);
  }
}

  const nego = d.negociation;

function chatDernierVu() {

}
function marquerChatVu() {
  localStorage.setItem(cleChatVu(etat.negociationId), Date.now().toString());

function nbMessagesClientNonLus(d) {
  const vu = chatDernierVu();
  return (d.messagesClient || []).filter(m => String(m.auteur_id) !== String(etat.moi.id) && new Date(m.cree_le).getTime() > vu).length;

function jouerSonNotification() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!window.__evxAudioCtx) window.__evxAudioCtx = new Ctx();
    const ctx = window.__evxAudioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const sonner = (freq, debut, duree) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const t = ctx.currentTime + debut;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duree);
      osc.start(t);
      osc.stop(t + duree + 0.02);
    };
    sonner(880, 0, 0.14);
    sonner(1320, 0.14, 0.18);
  } catch { /* audio non disponible -- silencieux, jamais bloquant */ }
}
document.addEventListener('click', () => {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (Ctx && !window.__evxAudioCtx) window.__evxAudioCtx = new Ctx();
}, { once: true });

async function sondageMessagesClient() {

// ---- Salle de Négociation ----
function rendreNegociation() {
  const d = etat.detail;
  // Préserve les brouillons en cours de saisie et la position de défilement
  // du tchat à travers un re-rendu déclenché par le sondage silencieux des
  // nouveaux messages (retour du 14/09/2026 -- ne jamais effacer ce que la
  // personne est en train d'écrire).
  const brouillonNotes = document.getElementById('mes-notes')?.value;
  const brouillonChat = document.getElementById('chat-colonne-texte')?.value;
  const chatListeAvant = document.getElementById('chat-colonne-liste');
  const chatEnBas = chatListeAvant ? (chatListeAvant.scrollTop + chatListeAvant.clientHeight >= chatListeAvant.scrollHeight - 12) : true;

  // Retour du 16/09/2026 : "je vois exactement comme il voit... s'il
  // apparaît dans plusieurs négociations, je verrai comme il voit son
  // équipe" -- en mode "voir comme", ce sélecteur liste les négociations de
  // LA PERSONNE visée (etat.voirCommeAppartenances, posé par le mur de
  // rôle), jamais celles de la Direction elle-même.
  const internes = (d.voirComme ? (etat.voirCommeAppartenances || []) : etat.appartenances).filter(a => a.role !== 'client');
  const estDirectionReelle = d.monRoleReel === 'direction';
  const verrouille = !!d.verrouille;
  const peutFaireEvoluer = (d.monRoleReel === 'direction' || d.monRoleReel === 'negociateur') && !d.voirComme && !(verrouille && d.monRoleReel !== 'direction');
  // Le client n'a pas d.etapes (l'API ne lui envoie jamais conseil/recommandes,
  // consignes internes) -- on reconstitue les 6 points à partir de
  // d.etapesClient : numéros toujours là, intitulés vides tant que non
  // révélés (retour du 16/09/2026 -- même frise partagée pour tout le monde).
  const etapes = d.role === 'client'
    ? Array.from({ length: 6 }, (_, i) => ({ n: i + 1, label: d.etapesClient?.find(e => e.n === i + 1)?.label || '' }))
    : (d.etapes || []);
  const etapeActuelle = etapes.find(e => e.n === d.negociation.etape) || etapes[0];
  const membresActifs = (d.membres || []).filter(m => m.actif);
  // Retour du 16/09/2026 : "le commercial ou moi pouvons afficher... au
  // moment voulu, nous activerons... il sera surpris de voir qu'il était
  // soumis à un test" -- le client voit toujours les 6 points, jamais ce
  // qu'ils signifient, tant que ce bouton n'a pas été activé. Direction et
  // Négociateur seulement, jamais en mode "voir comme". Calculé ici (plutôt
  // qu'au moment de construire la frise, comme avant) : l'œil rejoint
  // désormais la rangée équipe/ticket (voir plus bas, point du 14/09/2026 :
  // en-tête négociateur/Direction trop haute sur mobile).
  const peutBasculerLibelles = (d.monRoleReel === 'direction' || d.monRoleReel === 'negociateur') && !d.voirComme;
  const libellesVisibles = !!d.negociation.etape_libelles_visibles_client;

  // ---- Hero : identité + étapes + équipe + ticket + icônes de panneaux ----
  let hero = '<div class="g-hero-top"><div>';
  if (internes.length > 1) {
    hero += '<div class="g-select-nego"><select id="select-nego">' +
      internes.map(a => `<option value="${a.negociation_id}" ${a.negociation_id === etat.negociationId ? 'selected' : ''}>${escapeHtml(a.nom)}</option>`).join('') +
      '</select></div>';
  }
  // Ampoule "Conseil" collée au nom -- retour de l'utilisateur du 14/09/2026 :
  // déplacée depuis le cluster d'icônes à droite pour lui libérer de la
  // place ; même bouton/popover qu'avant (#btn-conseil, rendreConseilPanel),
  // juste réduit et mis en ligne (.g-icone-bouton.-mini / .g-icone-wrap
  // .-inline-titre).
  const conseilHtml = (d.role !== 'client' && etapeActuelle?.conseil)
    ? `<span class="g-icone-wrap -inline-titre"><button class="g-icone-bouton -mini ${etat.panelActif === 'conseil' ? '-actif' : ''}" id="btn-conseil" title="Conseil pour cette étape">💡</button>${etat.panelActif === 'conseil' ? rendreConseilPanel(etapeActuelle) : ''}</span>`
    : '';
  // Badge ticket côté client -- retour de l'utilisateur du 14/09/2026 (point
  // 1 du bandeau client) : sur la MÊME ligne que le titre, jamais sur sa
  // propre ligne. .g-nego-nom-texte porte l'ellipse (jamais de wrap, voir
  // CSS) pendant que ce badge, comme l'ampoule, reste toujours pleinement
  // visible (flex-shrink:0 hérité de .g-ticket-wrap).
  const ticketInlineHtml = d.role === 'client' ? rendreTicketPill(d, '-inline-titre') : '';
  // Bascule "voir comme" -- retour de l'utilisateur du 14/09/2026 : côté
  // client, ce bouton (déjà compact depuis le tour précédent) gagnait quand
  // même sa propre ligne en prévisualisation. Rejoint ici la ligne du badge
  // ticket, juste derrière lui -- réduit (-mini, comme l'ampoule) et coloré
  // pour rester bien visible sur le fond bleu nuit (-bascule-vue, voir CSS).
  const revenirVueInlineHtml = (d.role === 'client' && d.voirComme)
    ? `<button class="g-icone-bouton -mini -bascule-vue" id="btn-revenir-ma-vue" title="Revenir à ma vue">${iconeBasculerVue()}</button>`
    : '';
  hero += '<div class="g-nego-nom">' + (estDirectionReelle && !d.voirComme ? htmlBoutonRetour() : '') +
    '<span class="g-nego-nom-texte">' + escapeHtml(d.negociation.nom) + '</span>' + conseilHtml + ticketInlineHtml + revenirVueInlineHtml + '</div>' +
    `<div class="g-nego-sous">Salle de négociation${etapeActuelle?.label ? ' · ' + escapeHtml(etapeActuelle.label) : ''}</div>`;
  hero += '</div>';

  hero += '<div class="g-hero-droite">';
  // Le client ne voit JAMAIS l'équipe (retour du 14/09/2026, jamais changé) --
  // mais voit désormais le ticket, comme tout le monde (retour du
  // 16/09/2026 : "sur l'entête il pourra avoir... le temps consacré").
  if (d.role !== 'client') {
    // Retour du 16/09/2026 : "il faut écrire le titre de l'équipe dans
    // laquelle ils font partie... on sache dans quelle négociation nous
    // sommes, quel client sommes-nous en train de négocier" -- petit
    // rappel juste devant la plaque d'équipe, sans dupliquer le style du
    // titre principal à gauche.
    hero += `<span class="g-equipe-nego-nom" title="${escapeHtml(d.negociation.nom)}">Équipe -- ${escapeHtml(d.negociation.nom)}</span>`;
    // Indicateur d'étape compact (précédent/point actuel/suivant) -- retour
    // de l'utilisateur du 14/09/2026 : sur mobile, l'en-tête Négociateur/
    // Direction restait trop haute à cause de la frise des 6 étapes, qui
    // gardait toute sa propre ligne même défilante. Repris directement de
    // la piste proposée : "juste le point de l'étape actuelle + petites
    // flèches... plutôt que les 6 cercles en scroll horizontal", rejoint la
    // rangée équipe/ticket. La frise complète (.g-etapes-ligne.-equipe) reste
    // intacte sur bureau -- seule sa VISIBILITÉ change en mobile (CSS),
    // jamais son contenu ; [data-etape] est déjà câblé pour toute la page
    // (voir attacherEvenementsNegociation), donc ces boutons agissent
    // exactement comme un cercle de la frise complète, rien de nouveau à
    // brancher. Le titre de la négociation, lui, ne bouge pas (.g-nego-nom,
    // toujours sur sa propre ligne juste au-dessus).
    const etapeCompacteHtml = `<div class="g-etape-compacte">
      <button class="g-etape-nav" ${(!peutFaireEvoluer || (etapeActuelle?.n || 1) <= 1) ? 'disabled' : `data-etape="${(etapeActuelle.n) - 1}"`} title="Étape précédente">‹</button>
      <span class="g-etape-rond -actuelle" title="${escapeHtml(etapeActuelle?.label || '')}">${etapeActuelle?.n || 1}</span>
      <button class="g-etape-nav" ${(!peutFaireEvoluer || (etapeActuelle?.n || 1) >= etapes.length) ? 'disabled' : `data-etape="${(etapeActuelle.n) + 1}"`} title="Étape suivante">›</button>
    </div>`;
    // Œil du client -- déplacé ici depuis la ligne de la frise (même retour
    // du 14/09/2026) : n'a plus de raison de garder sa propre ligne côté
    // Négociateur/Direction une fois la frise complète masquée en mobile.
    const oeilClientHtml = peutBasculerLibelles
      ? `<button class="g-btn-oeil-client ${libellesVisibles ? '-actif' : ''}" id="btn-ouvrir-oeil-client" title="${libellesVisibles ? 'Le client voit les intitulés des étapes' : 'Le client ne voit que les numéros -- intitulés cachés'}">👁 Client</button>`
      : '';
    // Plaque d'équipe + badge ticket + étape compacte + œil, regroupés,
    // toujours sur une seule ligne (retour de l'utilisateur du 14/09/2026,
    // point 1 du tour précédent : "juste derrière elles... tiennent sur UNE
    // seule ligne à toutes les tailles" -- même principe étendu ici).
    hero += '<div class="g-hero-ligne-equipe"><div class="g-equipe-plaque">' + membresActifs.map(m => {
      const enLigne = estEnLigne(m.dernier_vu);
      const avatar = m.photo_url ? `<img src="${escapeHtml(m.photo_url)}" alt="">` : `<div class="g-membre-avatar">${escapeHtml(initiales(m.nom))}</div>`;
      // Présence de Direction jamais affichée, à personne (retour du 14/09/2026).
      const montrerPresence = m.role !== 'direction';
      return `<div style="position:relative">
        <button class="g-membre-pastille" data-membre-menu="${m.utilisateur_id}" title="${escapeHtml(m.nom)} — ${escapeHtml(libelleRole(m.role, m.titre_autre))}">${avatar}${montrerPresence ? `<span class="g-presence-dot ${enLigne ? '-en-ligne' : ''}"></span>` : ''}</button>
        ${String(etat.menuMembreOuvert) === String(m.utilisateur_id) ? rendreMenuMembre(m, estDirectionReelle && !d.voirComme) : ''}
      </div>`;
    }).join('') +
      (estDirectionReelle && !d.voirComme ? '<button class="g-btn-ajouter-membre" id="btn-ouvrir-ajout-membre" title="Ajouter un membre">+</button>' : '') +
      '</div>' + rendreTicketPill(d) + etapeCompacteHtml + oeilClientHtml + '</div>';

    // Tchat / Notes / Échanges internes vivent dans la colonne latérale
    // (onglets) -- jamais de bouton dans l'en-tête pour y accéder : la barre
    // fixe des 3 icônes en pied de page (voir .g-colonne-laterale) suffit et
    // reste identique en bureau comme en mobile (retour de l'utilisateur du
    // 14/09/2026, tranché après un essai d'icône dans l'en-tête : "supprimer
    // la version message qui se trouve à l'entête, c'est plus utile [en
    // pied de page]"). L'en-tête garde toujours la même forme.

    // Petit bouton "Vue Client" -- retour du 16/09/2026 : "côté négociateur...
    // il voit l'écran du client en live quand il clique... petit bouton
    // presque invisible... instantané". Réutilise "voir comme" (déjà réel),
    // mais élargi côté serveur au Négociateur pour SON PROPRE client
    // uniquement (jamais un autre négociateur, jamais une autre négociation).
    const clientMembre = membresActifs.find(m => m.role === 'client');
    if (d.monRoleReel === 'negociateur' && !d.voirComme && clientMembre) {
      hero += `<button class="g-btn-mini-vue" id="btn-vue-client" data-voircomme="${clientMembre.utilisateur_id}" title="Voir en direct l'écran du client">Vue Client</button>`;
    }
  }
  // Bascule "voir comme" -- retour de l'utilisateur du 14/09/2026 (point 6) :
  // icône compacte (façon bascule caméra) plutôt qu'un bouton texte, pour ne
  // pas ajouter de ligne. Réservé structurellement à qui prévisualise
  // (Direction/Négociateur, d.voirComme) -- jamais posé pour un vrai client,
  // dont d.voirComme est toujours faux. Côté client, ce même bouton est déjà
  // posé plus haut, dans le titre (revenirVueInlineHtml) -- jamais les deux
  // à la fois (même id).
  if (d.voirComme && d.role !== 'client') {
    hero += `<button class="g-icone-bouton -bascule-vue" id="btn-revenir-ma-vue" title="Revenir à ma vue">${iconeBasculerVue()}</button>`;
  }
  // "Déconnexion" reste dans l'en-tête pour un vrai client (jamais un "voir
  // comme") -- l'accès au tchat, lui, vit uniquement dans la barre fixe en
  // pied de page (.g-colonne-laterale), jamais ici (retour du 14/09/2026).
  if (d.role === 'client' && !d.voirComme) {
    hero += `<button class="g-btn-mini-vue" id="btn-deconnexion-client" title="Déconnexion">Déconnexion</button>`;
  }
  hero += '</div>'; // .g-hero-droite
  hero += '</div>'; // .g-hero-top

  // Frise d'étapes défilante -- reste la SEULE représentation sur bureau, et
  // côté client aussi bien mobile que bureau (rien ne change pour lui, voir
  // retour du 14/09/2026 : "le problème ne se pose plus côté client").
  // Côté Négociateur/Direction, ce bloc entier est masqué en mobile (CSS,
  // classe -equipe) au profit de l'indicateur compact posé plus haut, dans
  // la rangée équipe/ticket -- jamais son contenu qui change, seulement sa
  // visibilité. L'œil du client, lui, a rejoint cette même rangée équipe
  // (voir plus haut) : plus ici, pour ne plus dépendre de cette frise.
  hero += '<div class="g-etapes-ligne' + (d.role !== 'client' ? ' -equipe' : '') + '"><div class="g-etapes">' + etapes.map((e, i) => {
    const faite = e.n < (etapeActuelle?.n || 1);
    const actuelle = e.n === (etapeActuelle?.n || 1);
    return (i > 0 ? `<div class="g-etape-lien ${faite || actuelle ? '-faite' : ''}"></div>` : '') +
      `<div class="g-etape"><button class="g-etape-bouton ${faite ? '-faite' : ''} ${actuelle ? '-actuelle' : ''}" ${peutFaireEvoluer ? `data-etape="${e.n}"` : 'disabled'}>
        <span class="g-etape-rond">${e.n}</span><span class="g-etape-label">${escapeHtml(e.label)}</span>
      </button></div>`;
  }).join('') + '</div></div>';

  // Plus de bandeau "Vous visualisez comme..." (retour du 16/09/2026 :
  // "je n'ai pas besoin qu'on le dise pour que je sache" -- le mur de
  // bascule de rôle, dans la barre latérale, montre déjà quel rôle est
  // actif). Le retour au Tableau de Bord reste disponible dans tous les cas.
  document.getElementById('hero').innerHTML = `<div class="g-hero">${hero}</div>`;
  attacherBoutonRetour();

  document.getElementById('verrou-bandeau').innerHTML = (verrouille && d.role !== 'client')
    ? `<div class="g-verrou-bandeau">🔒 Ticket expiré — la négociation est verrouillée pour l'équipe (étapes et tchat client bloqués) jusqu'à réactivation par la Direction.</div>`
    : '';

  // ---- Scène centrale -- retour du 16/09/2026, tranché : "l'espace de
  // travail partagé, identique à celui du négociateur" -- le client voit
  // désormais EXACTEMENT cette même bande d'outils + grand aperçu, jamais
  // un écran différent inventé à part. "Envoyer au client" reste
  // naturellement invisible pour lui (peutEnvoyer dépend d'estDirectionReelle,
  // toujours faux pour un client réel) -- rien à cacher en plus ici.
  // #stage-grand doit être un vrai nœud DOM stable, jamais recréé par un
  // sondage silencieux -- le vrai outil (retour du 16/09/2026) y tourne
  // maintenant dans une vraie iframe, qui rechargerait sinon toutes les 12s.
  // On ne pose donc le squelette qu'une fois (absent = premier rendu ou
  // changement de panneau) ; ensuite seule la bande d'outils est reconstruite
  // ici, #stage-grand restant intact et géré à part par rafraichirGrandApercu.
  if (!document.getElementById('stage-grand')) {
    document.getElementById('corps').innerHTML = '<div id="stage-outils-zone"></div><div class="g-stage-grand" id="stage-grand"></div>';
  }
  document.getElementById('stage-outils-zone').innerHTML = rendreStageOutils(d, etapeActuelle, estDirectionReelle);
  rafraichirGrandApercu(d, estDirectionReelle);

  // Ne JAMAIS reconstruire la fiche si elle est déjà à l'écran -- sinon le
  // sondage silencieux (toutes les 12s) efface ce que la Direction est en
  // train de taper (retour du 16/09/2026 : "à chaque fois que j'écris, ça
  // se renouvelle... on dirait qu'il n'y a pas de possibilité d'ajouter").
  if (etat.modalAjoutOuvert) {
    if (!document.getElementById('modal-fond')) rendreModalAjoutMembre(d);
  } else if (etat.modalInvitationMembreId) {
    if (!document.getElementById('modal-fond-invitation')) rendreModalInvitation(etat.modalInvitationMembreId);
  } else if (etat.modalOeilClientOuvert) {
    if (!document.getElementById('modal-fond-oeil-client')) rendreModalOeilClient(d);
  } else {
    document.getElementById('modal-zone').innerHTML = '';
  }

  rendreColonneLaterale(d);
  attacherEvenementsNegociation(d);

  const notesEl = document.getElementById('mes-notes');
  if (notesEl && brouillonNotes !== undefined) notesEl.value = brouillonNotes;
  const chatEl = document.getElementById('chat-colonne-texte');
  if (chatEl && brouillonChat !== undefined) chatEl.value = brouillonChat;
  const chatListeApres = document.getElementById('chat-colonne-liste');
  if (chatListeApres && chatEnBas) chatListeApres.scrollTop = chatListeApres.scrollHeight;
}

function iconeDossier(aDesFichiers) {
  // Vraie icône (Microsoft Fluent Emoji, licence libre, usage commercial
  // autorisé) -- plus un dessin maison (retour du 14/09/2026 : "c'est cette
  // image même qui est la miniature"). Fermé = vide, ouvert = contient des
  // fichiers -- choisi par l'utilisateur le 14/09/2026 parmi deux options.
  const src = aDesFichiers ? '/assets/img/dossier-ouvert.png' : '/assets/img/dossier-ferme.png';
  return `<img src="${src}" alt="" width="84" height="84">`;
}
function iconeFichier(typeMime) {
  const image = (typeMime || '').startsWith('image/');
  return `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v4h4"/>
    ${image ? '<circle cx="10.5" cy="12.5" r="1.4"/><path d="M8 17l2.7-3 2 2.2L15.5 13 17 17H8Z"/>' : ''}
  </svg>`;
}
function tailleLisible(octets) {
  if (octets < 1024) return octets + ' o';
  if (octets < 1024 * 1024) return Math.round(octets / 1024) + ' Ko';
  return (octets / (1024 * 1024)).toFixed(1) + ' Mo';
}

// Documents et images seulement dans le dossier d'échange -- jamais de
// vidéo (retour du 14/09/2026). Reflète EXTENSIONS_FICHIER_PARTAGE_AUTORISEES
// côté serveur (api/gestion/negociation.js) -- ici juste pour guider le
// sélecteur de fichiers et donner un message clair avant l'envoi.
const EXTENSIONS_FICHIER_PARTAGE_AUTORISEES = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'csv', 'jpg', 'jpeg', 'png', 'gif', 'webp'];
const ACCEPT_FICHIER_PARTAGE = EXTENSIONS_FICHIER_PARTAGE_AUTORISEES.map(e => '.' + e).join(',');

// Dépôt d'un fichier dans le dossier d'échange -- factorisé, réutilisé par
// la bande (en-tête), le Grand Aperçu ET les pièces jointes du tchat (retour
// du 14/09/2026 : "le chat aussi doit pouvoir servir à ajouter des
// fichiers"), qui déposent tous au même endroit plutôt que dupliquer le
// stockage. Retourne { id, nom } si déposé, sinon null (message déjà affiché).
async function televerserFichierPartage(fichier) {
  const extension = (fichier.name.split('.').pop() || '').toLowerCase();
  if (!EXTENSIONS_FICHIER_PARTAGE_AUTORISEES.includes(extension)) {
    alert('Type de fichier non autorisé -- documents et images seulement (PDF, Word, Excel, PowerPoint, TXT, CSV, JPG, PNG, GIF, WEBP), pas de vidéo.');
    return null;
  }
  if (fichier.size > 4 * 1024 * 1024) { alert('Fichier trop volumineux (4 Mo maximum).'); return null; }
  const contenuBase64 = await new Promise((resolve, reject) => {
    const lecteur = new FileReader();
    lecteur.onload = () => resolve(lecteur.result.split(',')[1] || '');
    lecteur.onerror = reject;
    lecteur.readAsDataURL(fichier);
  });
  const rep = await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ negociationId: etat.negociationId, action: 'deposer_fichier_partage',
      nomFichier: fichier.name, typeMime: fichier.type || 'application/octet-stream', contenuBase64 }) });
  if (!rep.ok) { alert(rep.erreur || 'Échec du dépôt.'); return null; }
  return { id: rep.id, nom: fichier.name };
}

// Écrit, en toutes lettres, le total de documents et ceux non lus --
// consigne du 14/09/2026 : "je veux aussi que ce soit écrit", pas juste un
// point de couleur. Placé avant le bouton de repli des outils ET à côté de
// "+ Ajouter un fichier".
function texteCompteurDossier(dp) {
  if (!dp || !dp.total) return '';
  const nonLus = dp.nouveaux > 0 ? ` <span style="color:#dc2626;font-weight:800">· ${dp.nouveaux} non lu${dp.nouveaux > 1 ? 's' : ''}</span>` : '';
  return `<span class="g-echange-compteur">${dp.total} document${dp.total > 1 ? 's' : ''}${nonLus}</span>`;
}

function formaterDuree(secondes) {
  const s = Math.max(0, Math.round(secondes || 0));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// Couleur du nom, par personne -- "il peut y avoir plusieurs personnes qui
// parlent" (retour du 14/09/2026) : la couleur de bulle reste binaire
// (moi/les autres), mais le NOM se distingue en plus par une couleur fixe
// par auteur -- comme WhatsApp en groupe -- pour ne jamais confondre un
// deuxième et un troisième intervenant qui partagent la même bulle blanche.
const PALETTE_NOMS_TCHAT = ['#0f766e', '#7c3aed', '#b45309', '#be185d', '#15803d', '#0369a1'];
function couleurNomAuteur(id) {
  let h = 0;
  const s = String(id);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PALETTE_NOMS_TCHAT[h % PALETTE_NOMS_TCHAT.length];
}

// "La date, régroupons-la... l'heure à la fin du message" (retour du
// 14/09/2026, comme WhatsApp) -- un séparateur centré par jour plutôt
// qu'une date répétée sur chaque message.
function libelleDateSeparateur(dateStr) {
  const d = new Date(dateStr);
  const auj = new Date();
  const debutAuj = new Date(auj.getFullYear(), auj.getMonth(), auj.getDate());
  const debutD = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffJours = Math.round((debutAuj - debutD) / 86400000);
  if (diffJours === 0) return "Aujourd'hui";
  if (diffJours === 1) return 'Hier';
  if (diffJours > 1 && diffJours < 7) return d.toLocaleDateString('fr-FR', { weekday: 'long' });
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: d.getFullYear() !== auj.getFullYear() ? 'numeric' : undefined });
}

// Fil de messages complet -- bulles + séparateurs de jour, partagé par le
// tchat client et les Échanges internes. resoudreNom(m) rend le nom à
// afficher (anonymisation "EVOTEX" côté client -- voir appelant).
function rendreFilMessages(messages, d, canal, resoudreNom) {
  // Retour du 14/09/2026 : côté équipe, la couleur suit le RÔLE de l'auteur
  // -- Support toujours dans sa couleur propre (.-fonce), peu importe qui
  // regarde. Côté client (dans SON tchat), on garde le simple moi/EVOTEX
  // d'origine -- règle plus ancienne du 16/09/2026, jamais de fuite sur
  // QUI précisément, côté équipe, lui répond.
  const parRole = d.role !== 'client';
  let dernierJour = null;
  let html = '';
  for (const m of messages) {
    const dateMsg = new Date(m.cree_le);
    const jour = dateMsg.toDateString();
    if (jour !== dernierJour) {
      html += `<div class="g-date-separateur"><span>${libelleDateSeparateur(m.cree_le)}</span></div>`;
      dernierJour = jour;
    }
    const estMoi = String(m.auteur_id) === String(etat.moi.id);
    const estFonce = parRole ? (d.directionId != null && String(m.auteur_id) === String(d.directionId)) : estMoi;
    const nom = resoudreNom(m) || 'Vous';
    const heure = dateMsg.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const styleNom = (parRole && !estFonce) ? ` style="color:${couleurNomAuteur(m.auteur_id)}"` : '';
    html += `<div class="g-msg ${estMoi ? '-moi' : ''} ${estFonce ? '-fonce' : ''}">
      <div class="meta"${styleNom}>${escapeHtml(nom)}</div>
      <div>${rendreContenuMessage(m, d, canal)}</div>
      <div class="g-msg-heure">${heure}</div>
    </div>`;
  }
  return html;
}

// Contenu d'une bulle de tchat -- texte normal, message vocal (lecteur audio
// + éventuel bouton télécharger réservé à Support), ou "Message supprimé"
// si supprime_le est posé côté serveur (le vrai contenu n'est alors JAMAIS
// renvoyé par l'API, même pas à Support -- illusion de suppression, retour
// du 14/09/2026 : "quelqu'un veut supprimer... on peut lui donner cette
// illusion... nous avons la possibilité de le retrouver plus loin, par
// besoin" -- via la Boîte noire, pas ici). Chacun ne supprime que son propre
// message.
function rendreContenuMessage(m, d, canal) {
  if (m.supprime) return '<em class="g-msg-supprime">Message supprimé</em>';
  const estMoi = String(m.auteur_id) === String(etat.moi?.id);
  // Support supprime aussi en modérateur, même un message qui n'est pas le
  // sien -- "un message mal placé qui met tout le monde mal à l'aise"
  // (retour du 14/09/2026). Le serveur impose la même règle, ceci n'est que
  // l'affichage du bouton.
  const estModerateur = d.monRoleReel === 'direction' && !d.voirComme;
  const btnSupprimer = (estMoi || estModerateur)
    ? `<button class="g-msg-supprimer" data-supprimer-message="${m.id}" data-canal="${canal}" title="${estMoi ? 'Supprimer' : 'Supprimer (modération)'}">🗑</button>`
    : '';
  if (m.est_vocal) {
    // Lecteur vocal maison (bouton rond + barre de progression), pas le
    // <audio controls> natif -- retour du 14/09/2026 : "professionnelle et
    // moderne". Écoute ouverte à tous les membres autorisés de ce tchat ;
    // le téléchargement réel (⇩, disposition "attachment") reste réservé à
    // Support -- retour du 14/09/2026 : "je dois être la seule personne à
    // pouvoir le faire". src posé au premier clic seulement (preload none,
    // voir initialiserLecteursVocaux) -- pas de requête pour des messages
    // jamais écoutés dans un long historique.
    const peutTelecharger = d.monRoleReel === 'direction' && !d.voirComme;
    const dureeInitiale = m.audio_duree_secondes ? formaterDuree(m.audio_duree_secondes) : '0:00';
    return `<div class="g-lecteur-vocal" data-src="/api/gestion/message-audio?id=${m.id}&canal=${canal}">
      <button type="button" class="g-lecteur-play" title="Écouter">${iconePlay()}</button>
      <div class="g-lecteur-corps">
        <div class="g-lecteur-barre"><div class="g-lecteur-progression"></div></div>
        <span class="g-lecteur-duree">${dureeInitiale}</span>
      </div>
      <audio preload="none" hidden></audio>
      ${peutTelecharger ? `<a class="g-btn-symbolique" href="/api/gestion/message-audio?id=${m.id}&canal=${canal}&telecharger=1" title="Télécharger">⇩</a>` : ''}
      ${btnSupprimer}
    </div>`;
  }
  return `${escapeHtml(m.texte)}${btnSupprimer}`;
}

// Câble chaque lecteur vocal maison (voir rendreContenuMessage) -- un seul
// à la fois (les autres se coupent au clic), src posée au premier clic
// (preload none), barre de progression et durée réelle une fois les
// métadonnées chargées.
function initialiserLecteursVocaux(racine) {
  racine.querySelectorAll('.g-lecteur-vocal').forEach(zone => {
    const audio = zone.querySelector('audio');
    const btn = zone.querySelector('.g-lecteur-play');
    const barre = zone.querySelector('.g-lecteur-progression');
    const dureeEl = zone.querySelector('.g-lecteur-duree');
    if (!audio || !btn || audio.dataset.cable) return;
    audio.dataset.cable = '1';
    btn.addEventListener('click', () => {
      document.querySelectorAll('.g-lecteur-vocal audio').forEach(a => { if (a !== audio && !a.paused) a.pause(); });
      if (!audio.src) audio.src = zone.dataset.src;
      if (audio.paused) audio.play(); else audio.pause();
    });
    audio.addEventListener('play', () => { btn.innerHTML = iconePause(); zone.classList.add('-enlecture'); });
    audio.addEventListener('pause', () => { btn.innerHTML = iconePlay(); zone.classList.remove('-enlecture'); });
    audio.addEventListener('ended', () => { btn.innerHTML = iconePlay(); zone.classList.remove('-enlecture'); if (barre) barre.style.width = '0%'; });
    audio.addEventListener('timeupdate', () => {
      if (barre && audio.duration) barre.style.width = (audio.currentTime / audio.duration * 100) + '%';
      if (dureeEl && audio.duration) dureeEl.textContent = formaterDuree(Math.max(0, audio.duration - audio.currentTime));
    });
    audio.addEventListener('loadedmetadata', () => { if (dureeEl && isFinite(audio.duration)) dureeEl.textContent = formaterDuree(audio.duration); });
  });
}

// Enregistrement d'un vocal -- un seul à la fois, toutes colonnes confondues.
// L'état vit hors du DOM (le panneau latéral peut être redémonté en plein
// enregistrement par le sondage silencieux des 12s) ; le bouton est
// retrouvé par son id à chaque tic de la minuterie plutôt que gardé en
// référence directe, pour survivre à ce redémontage.
//
// Retour du 14/09/2026 : "une animation lorsqu'on parle, [pour être] sûr
// que le micro est en plein enregistrement" -- un AnalyserNode lit le
// niveau réel du micro (pas une animation jouée au hasard) et pilote
// l'intensité de l'anneau pulsé ; le silence prolongé (3,5s sans niveau
// perceptible) arrête et envoie automatiquement, comme une note vocale de
// messagerie classique -- pas besoin de rester appuyé.
const SILENCE_LIMITE_MS = 3500;
let enregistrementVocal = null;
async function basculerEnregistrementVocal(canal) {
  const boutonId = canal === 'client' ? 'btn-vocal-chat' : 'btn-vocal-interne';
  const zoneId = 'zone-enreg-' + canal;
  if (enregistrementVocal) {
    if (enregistrementVocal.canal === canal) enregistrementVocal.recorder.stop();
    return;
  }
  let flux;
  try {
    // Réduction d'écho/bruit + gain automatique -- retour du 14/09/2026 :
    // "l'audio [soit] d'une clarté exceptionnelle et que le volume soit à
    // la hauteur". autoGainControl relève une voix trop faible plutôt que
    // de l'enregistrer telle quelle.
    flux = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch {
    alert('Micro inaccessible -- vérifiez les autorisations du navigateur.');
    return;
  }
  const ContexteAudio = window.AudioContext || window.webkitAudioContext;
  const contexteAudio = ContexteAudio ? new ContexteAudio() : null;
  let analyseur = null, donneesNiveau = null;
  if (contexteAudio) {
    analyseur = contexteAudio.createAnalyser();
    analyseur.fftSize = 256;
    contexteAudio.createMediaStreamSource(flux).connect(analyseur);
    donneesNiveau = new Uint8Array(analyseur.frequencyBinCount);
  }
  const recorder = new MediaRecorder(flux, { audioBitsPerSecond: 64000 });
  const chunks = [];
  const debut = Date.now();
  let dernierSon = debut;
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    if (contexteAudio) contexteAudio.close();
    flux.getTracks().forEach(t => t.stop());
    clearInterval(enregistrementVocal.minuterieId);
    enregistrementVocal = null;
    const zone = document.getElementById(zoneId);
    if (zone) { zone.hidden = true; zone.style.removeProperty('--niveau-vocal'); }
    const btn = document.getElementById(boutonId);
    if (btn) {
      // Confirmation visuelle nette de fin d'enregistrement (retour du
      // 14/09/2026) -- un coché vert bref, avant de revenir au micro.
      btn.classList.remove('-enregistrement');
      btn.style.removeProperty('--niveau-vocal');
      btn.classList.add('-envoye');
      btn.innerHTML = iconeCoche();
      setTimeout(() => {
        const btnActuel = document.getElementById(boutonId);
        if (btnActuel && btnActuel.classList.contains('-envoye')) { btnActuel.classList.remove('-envoye'); btnActuel.innerHTML = iconeMicro(); }
      }, 1100);
    }
    const dureeSecondes = Math.round((Date.now() - debut) / 1000);
    if (dureeSecondes < 1 || !chunks.length) return;
    const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
    const contenuBase64 = await new Promise((resolve, reject) => {
      const lecteur = new FileReader();
      lecteur.onload = () => resolve(lecteur.result.split(',')[1] || '');
      lecteur.onerror = reject;
      lecteur.readAsDataURL(blob);
    });
    const action = canal === 'client' ? 'poster_message_client_vocal' : 'poster_message_vocal';
    const rep = await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: etat.negociationId, action, audioBase64: contenuBase64, typeMime: blob.type, dureeSecondes }) });
    if (!rep.ok) alert(rep.erreur || "Échec de l'envoi du vocal.");
    await chargerNegociation();
  };
  enregistrementVocal = { recorder, canal, minuterieId: null };
  recorder.start();
  const zoneDebut = document.getElementById(zoneId);
  if (zoneDebut) zoneDebut.hidden = false;
  enregistrementVocal.minuterieId = setInterval(() => {
    if (Date.now() - debut > 10 * 60 * 1000) { recorder.stop(); return; }
    let niveau = 0;
    if (analyseur) {
      analyseur.getByteFrequencyData(donneesNiveau);
      niveau = donneesNiveau.reduce((a, b) => a + b, 0) / donneesNiveau.length;
      if (niveau > 6) dernierSon = Date.now();
      else if (Date.now() - dernierSon > SILENCE_LIMITE_MS) { recorder.stop(); return; }
    }
    const intensite = Math.min(1, niveau / 50).toFixed(2);
    const btn = document.getElementById(boutonId);
    if (btn) {
      btn.classList.add('-enregistrement');
      btn.style.setProperty('--niveau-vocal', intensite);
      btn.innerHTML = `<span class="g-vocal-duree-enreg">${formaterDuree((Date.now() - debut) / 1000)}</span>`;
    }
    // La bande sonore vit DANS la case de saisie, pas sur le bouton (retour
    // du 14/09/2026 : "pas le micro, mais LA BULLE... qu'il y ait un
    // mouvement... pendant tout le temps où on s'exprime") -- retrouvée par
    // id à chaque tic, comme le bouton, pour survivre à un redémontage.
    const zone = document.getElementById(zoneId);
    if (zone) {
      zone.hidden = false;
      zone.style.setProperty('--niveau-vocal', intensite);
      const minuteur = zone.querySelector('.g-vocal-minuteur');
      if (minuteur) minuteur.textContent = formaterDuree((Date.now() - debut) / 1000);
    }
  }, 150);
}

    <div class="mock-check-row"><span class="mock-check"></span><span class="mock-trait"></span></div>
    <div class="mock-check-row"><span class="mock-check"></span><span class="mock-trait -courte"></span></div></div>`;

  if (id === 'licences') return `<div class="g-vignette-mock g-mock-licences"><img src="/assets/img/licence-vue-ensemble.png" alt=""></div>`;
