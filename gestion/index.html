// Menu mobile plein écran (< 768px) -- ouvert/fermé uniquement par classe
// CSS sur #sidebar, jamais par un état persisté (toujours fermé à l'arrivée
// sur la page, comme un menu de téléphone).
//
// Le déclencheur doit vivre DANS le bandeau .g-hero, au même niveau que le
// titre (retour explicite de l'utilisateur du 14/09/2026) -- mais #hero est
// entièrement réécrit (innerHTML) par chaque fonction rendreXxx(), ce qui
// détruirait un bouton statique inséré une seule fois. Réinjecté à la place
// à chaque re-rendu via MutationObserver (fonctionne à l'identique sur tous
// les panneaux, sans toucher chaque fonction rendreXxx()) ; le clic est
// délégué sur document plutôt que rattaché au bouton (qui change d'instance
// DOM à chaque re-rendu).
function injecterHamburger() {
  const conteneur = document.querySelector('#hero .g-hero');
  if (!conteneur || conteneur.querySelector('#btn-hamburger')) return;
  // Client seul -- rien à ouvrir (même règle que la sidebar elle-même, voir
  // rendreSidebar() : sidebar.classList.toggle('-masquee', clientSeul)).
  const sidebar = document.getElementById('sidebar');
  if (sidebar && sidebar.classList.contains('-masquee')) return;
  conteneur.insertAdjacentHTML('afterbegin', '<button type="button" class="g-btn-hamburger" id="btn-hamburger" aria-label="Ouvrir le menu">☰</button>');
}
new MutationObserver(injecterHamburger).observe(document.getElementById('hero'), { childList: true });

function fermerMenuMobile() {
  document.getElementById('sidebar').classList.remove('-ouverte-mobile');
  const btn = document.getElementById('btn-hamburger');
  if (!btn) return;
  btn.textContent = '☰';
  btn.setAttribute('aria-label', 'Ouvrir le menu');
}
function ouvrirMenuMobile() {
  document.getElementById('sidebar').classList.add('-ouverte-mobile');
  const btn = document.getElementById('btn-hamburger');
  if (!btn) return;
  btn.textContent = '✕';
  btn.setAttribute('aria-label', 'Fermer le menu');
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('#btn-hamburger')) return;
  document.getElementById('sidebar').classList.contains('-ouverte-mobile') ? fermerMenuMobile() : ouvrirMenuMobile();
});

const etat = { moi: null, appartenances: [], negociationId: null, detail: null, voirCommeId: null, voirCommeAppartenances: null, panneau: 'negociation',
  sidebarRepliee: localStorage.getItem(CLE_SIDEBAR) === '1',
  panelActif: null,          // 'ticket' | 'conseil' | null -- petits popovers ancrés dans l'en-tête
  colonneRepliee: localStorage.getItem(CLE_COLONNE_REPLIEE) !== '0',   // repliée par défaut -- priorité à la scène
  colonneOnglet: localStorage.getItem(CLE_COLONNE_ONGLET) || 'chat',  // onglet actif : chat | notes | notif
  menuMembreOuvert: null,
  modalAjoutOuvert: false,
  modalInvitationMembreId: null,
  modalOeilClientOuvert: false,   // remplace l'ancienne case à cocher (point 4, retour du 14/09/2026)
  outilOuvert: null,         // id de l'outil dont la bande de composants est ouverte
  outilsReplies: localStorage.getItem(CLE_OUTILS_REPLIES) === '1',   // repli de "Outils de négociation" pour gagner de la place -- retour du 14/09/2026
  itemFocus: null,           // { outilId, composantId } affiché en grand dans la scène
  panneauPrecedent: null, panneauActuelAffiche: undefined };  // pour le bouton "‹ Retour" générique

async function api(url, options) {
  try {
    const r = await fetch(url, options);
    return await r.json();
  } catch {
    return { ok: false, erreur: "Erreur réseau." };
  }
}

async function demarrer() {
  const moi = await api('/api/gestion/me');
  if (!moi.ok) { location.href = '/gestion/login'; return; }
  etat.moi = moi.utilisateur;
  etat.appartenances = moi.appartenances;

  const internes = moi.appartenances.filter(a => a.role !== 'client');
  if (internes.length === 0) {
    // Rôle uniquement client -- reste DANS la même application, avec ses
    // propres restrictions, jamais une page à part (retour du 16/09/2026,
    // tranché : "créez la page du client comme toutes les autres... le
    // tout dans la même application").
    const mienne = moi.appartenances.find(a => a.role === 'client');
    if (!mienne) { location.href = '/gestion/login'; return; }
    etat.negociationId = mienne.negociation_id;
    etat.panneau = 'negociation';
  } else {
    // Arrivée via un Lien d'accès (/api/gestion/rejoindre) -- atterrit
    // directement sur SA négociation plutôt que la première de la liste ou
    // le Tableau de Bord (retour du 16/09/2026). Ignoré si l'id ne
    // correspond à aucune appartenance réelle (lien trafiqué) -- retombe
    // sur le choix par défaut.
    const negociationIdLien = Number(new URLSearchParams(location.search).get('negociationId'));
    const viaLien = negociationIdLien && internes.some(a => a.negociation_id === negociationIdLien);
    etat.negociationId = viaLien ? negociationIdLien : internes[0].negociation_id;
    if (viaLien) {
      etat.panneau = 'negociation';
      history.replaceState(null, '', '/gestion/');
    } else if (estDirection()) {
      // Le Tableau de Bord est l'écran par défaut de la Direction -- la
      // Négociation n'est qu'un outil parmi d'autres pour elle, contrairement
      // aux négociateurs qui n'ont que cet écran (retour du 16/09/2026).
      etat.panneau = 'tableau-de-bord';
    } else {
      // Page d'atterrissage des négociateurs (retour du 16/09/2026 : "le
      // négociateur ne prend que deux pages, celle-là [l'Espace Commercial]
      // ... c'est cette page qui leur permettra de bien comprendre le projet").
      etat.panneau = 'hub';
    }
  }
  await chargerNegociation();
  if (estDirection()) { await rafraichirMurRoles(); setInterval(rafraichirMurRoles, 45000); }

  setInterval(() => { api('/api/gestion/ping', { method: 'POST' }); }, 45000);
  setInterval(actualiserChrono, 1000);
  setInterval(sondageMessagesClient, 12000);
  if (estDirection()) setInterval(verifierSurveillanceTickets, 60000);
}

async function chargerNegociation() {
  const params = new URLSearchParams({ id: etat.negociationId });
  if (etat.voirCommeId) params.set('voirComme', etat.voirCommeId);
  const detail = await api('/api/gestion/negociation?' + params.toString());
  if (!detail.ok) {
    document.getElementById('hero').innerHTML = '';
    document.getElementById('corps').innerHTML = '<div class="g-erreur">' + escapeHtml(detail.erreur || 'Erreur.') + '</div>';
    return;
  }
  etat.detail = detail;
  rendreSidebar();
  rendrePanneau();
}

function estDirection() {
  return etat.appartenances.some(a => a.role === 'direction');
}

// Un client n'a qu'un seul rôle possible, jamais mélangé avec un rôle
// interne -- retour du 16/09/2026 : "il n'a que son espace pour le moment".
function estClient() {
  return etat.appartenances.length > 0 && etat.appartenances.every(a => a.role === 'client');
}

// Retour du 16/09/2026 : "sa place est une petite flèche à l'intérieur,
// comme d'habitude, pour retourner d'où on vient" -- plus un bloc à part
// au-dessus du titre ("Tableau de Bord" figé), mais une flèche inline,
// DEVANT le titre, qui ramène au panneau réellement affiché juste avant
// (etat.panneauPrecedent, tenu à jour dans rendrePanneau). Besoin du
// Tableau de Bord précisément ? Il reste à un clic dans le menu latéral.
function htmlBoutonRetour() {
  return estDirection() ? `<button class="evx-retour" id="btn-retour-panneau" title="Retour" style="color:inherit;font-size:15px;font-weight:900;margin-right:9px;vertical-align:middle">‹</button>` : '';
}
function attacherBoutonRetour() {
  const btn = document.getElementById('btn-retour-panneau');
  if (btn) btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    etat.panneau = etat.panneauPrecedent || 'tableau-de-bord';
    await rendrePanneau();
    rendreSidebar();
  });
}

// Mur de bascule de rôle -- retour du 16/09/2026 : "exactement identique à
// celui de Batexci... changer de rôle au clic pour voir... dès qu'un rôle
// est connecté, on peut mettre du vert autour de lui". Réservé à la
// Direction seule, en permanence dans la barre latérale (jamais caché dans
// un sous-menu) -- sert à DEUX choses seulement, jamais plus : (1) basculer
// instantanément sa propre vue vers celle d'une vraie personne, sans changer
// de compte ni recharger la page (réutilise "voir comme", déjà réel, déjà
// branché) ; (2) signaler en direct qui est connecté. "Toutes les personnes
// qui sont sur l'application... je me connecte en tant que qui je veux" --
// pas seulement l'équipe de la négociation ouverte : tout le monde, toutes
// négociations confondues (etat.tableauBordEquipes, tenu à jour par
// rafraichirMurRoles). Contrairement à Batexci ("jamais de nom propre"),
// ici ce sont les VRAIS noms qui s'affichent, rôle en dessous en petit.
function rendreMurRoles() {
  if (!estDirection()) return '';
  const equipes = etat.tableauBordEquipes || [];
  const membres = equipes.flatMap(e => (e.membres || [])
    .filter(m => m.actif && m.role !== 'direction')
    .map(m => ({ ...m, negociationId: e.id })));
  const pill = (negId, id, nom, role, enLigne, actif) => `<button class="g-role-pill ${actif ? '-actif' : ''} ${enLigne ? '-en-ligne' : ''}" data-basculer-role="${id === null ? '' : id}" data-basculer-negociation="${negId || ''}">
    <span class="g-role-pill-nom">${escapeHtml(nom)}</span>${role ? `<span class="g-role-pill-role">${escapeHtml(role)}</span>` : ''}
  </button>`;
  return `<div class="g-role-mur">
    <div class="g-role-mur-liste">
      ${pill(null, null, 'Support (moi)', '', false, !etat.voirCommeId)}
      ${membres.map(m => pill(m.negociationId, m.utilisateur_id, m.nom, libelleRole(m.role, m.titre_autre), estEnLigne(m.dernier_vu), String(etat.voirCommeId) === String(m.utilisateur_id) && String(etat.negociationId) === String(m.negociationId))).join('')}
    </div>
  </div>`;
}

// Tient etat.tableauBordEquipes à jour même hors du Tableau de Bord --
// nécessaire pour que le mur de rôle liste tout le monde et sache qui est en
// ligne, quel que soit l'écran affiché. Ne touche jamais #corps (uniquement
// la barre latérale) : appeler rendreTableauBord()/rechargerTableauBord()
// ici écraserait l'écran réellement affiché.
async function rafraichirMurRoles() {
  if (!estDirection()) return;
  const rep = await api('/api/gestion/tableau-bord');
  if (rep.ok) { etat.tableauBordEquipes = rep.equipes; rendreSidebar(); }
}

function rendreSidebar() {
  // Retour du 16/09/2026 : "je vois exactement comme il voit" -- en mode
  // "voir comme", les boutons réservés à la Direction (Tableau de Bord, RH,
  // Boîte noire, Comptabilité, Conventions) n'ont RIEN à faire là : la
  // personne visée ne les a jamais eus. Le mur de rôle lui-même reste
  // visible (rendreMurRoles vérifie estDirection() directement, sans
  // dépendre de cette variable locale) pour pouvoir revenir à "Direction (moi)".
  const estDir = estDirection() && !etat.voirCommeId;
  const item = (id, label, opts = {}) => `
    <button class="g-nav-item ${etat.panneau === id ? '-actif' : ''} ${opts.bientot ? '-bientot' : ''}" ${opts.bientot ? '' : `data-panneau="${id}"`} title="${escapeHtml(label)}">
      <span class="g-nav-icone">${iconeMenu(id)}</span><span class="g-nav-label">${escapeHtml(label)}</span>${opts.bientot ? '<span class="g-nav-tag">Bientôt</span>' : ''}
    </button>`;

  // "Vue Client" (Direction/négociateur) : la personne visée est un client,
  // donc le menu doit être IDENTIQUE au sien -- "je vois exactement comme il
  // voit" -- pas seulement les boutons réservés à la Direction (estDir
  // ci-dessus), mais aussi Espace Commercial/Négociation/le mur de rôle,
  // qu'un client ne voit jamais.
  const clientSeul = estClient() || (!!etat.voirCommeId && etat.detail?.role === 'client');
  let html = `<div class="g-sidebar-top"><div class="g-sidebar-titre">${clientSeul ? 'MON ESPACE' : 'ESPACE DE TRAVAIL'}</div><button class="g-toggle-sidebar" id="btn-toggle-sidebar">${etat.sidebarRepliee ? '»' : '«'}</button></div>`;
  if (clientSeul) {
    // Retour du 16/09/2026, tranché : le client vit dans la même
    // application que tout le monde, mais "il n'a que son espace pour le
    // moment, il n'a pas les outils" -- un seul écran, jamais l'Espace
    // Commercial ni quoi que ce soit d'interne.
    html += item('negociation', 'Suivi du projet');
  } else {
    html += rendreMurRoles();
    if (estDir) html += item('tableau-de-bord', 'Tableau de Bord');
    // Retour du 16/09/2026 : "le négociateur ne prend que deux pages" --
    // cette salle (le vrai hub public evotex-commercial/index.html, intégré
    // en dur, jamais une iframe) et la Salle de Négociation elle-même.
    html += item('hub', 'Espace Commercial');
    html += item('negociation', 'Négociation');
    if (estDir) {
      html += item('rh', 'RH & Personnel');
      html += item('boite-noire', 'Boîte noire');
      html += item('calculateur', 'Comptabilité');
      html += item('conventions', 'Documents');
    }
  }
  html += `<div class="g-sidebar-bas"><div class="g-sidebar-user">${escapeHtml(etat.moi.nom)}</div><button id="btn-deconnexion" title="Déconnexion"><span class="g-nav-icone">${iconeDeconnexion()}</span><span class="g-btn-label">Déconnexion</span></button></div>`;

  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = html;
  sidebar.classList.toggle('-repliee', etat.sidebarRepliee);
  // Le client n'agit pas vraiment à travers ce panneau (un seul écran, déjà
  // celui par défaut) -- retiré pour lui donner plus d'espace réel, surtout
  // utile sur mobile (retour du 14/09/2026). "Déconnexion" le rejoint alors
  // dans l'en-tête de la salle de négociation (rendreNegociation).
  sidebar.classList.toggle('-masquee', clientSeul);

  document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
    etat.sidebarRepliee = !etat.sidebarRepliee;
    localStorage.setItem(CLE_SIDEBAR, etat.sidebarRepliee ? '1' : '0');
    sidebar.classList.toggle('-repliee', etat.sidebarRepliee);
  });
  document.querySelectorAll('[data-basculer-role]').forEach(btn => {
    btn.addEventListener('click', async () => {
      fermerMenuMobile();
      const id = btn.dataset.basculerRole || null;
      etat.voirCommeId = id;
      if (id) {
        // Retour du 16/09/2026 : "je vois exactement comme il voit... s'il
        // apparaît dans plusieurs négociations" -- ses VRAIES négociations
        // (etat.tableauBordEquipes, déjà là pour le mur), pas celles de la
        // Direction. La négociation d'où on clique devient l'écran de départ.
        const equipes = etat.tableauBordEquipes || [];
        etat.voirCommeAppartenances = equipes
          .map(e => ({ negociation_id: e.id, nom: e.nom, membre: (e.membres || []).find(m => String(m.utilisateur_id) === String(id) && m.actif) }))
          .filter(x => x.membre)
          .map(x => ({ negociation_id: x.negociation_id, nom: x.nom, role: x.membre.role }));
        etat.negociationId = Number(btn.dataset.basculerNegociation) || etat.negociationId;
      } else {
        etat.voirCommeAppartenances = null;
      }
      etat.panneau = 'negociation';
      await chargerNegociation();
    });
  });
  document.querySelectorAll('[data-panneau]').forEach(btn => {
    btn.addEventListener('click', async () => { fermerMenuMobile(); etat.panneau = btn.dataset.panneau; await rendrePanneau(); rendreSidebar(); });
  });
  document.getElementById('btn-deconnexion').addEventListener('click', async () => {
    await api('/api/gestion/logout', { method: 'POST' });
    location.href = '/gestion/login';
  });
}

async function rendrePanneau() {
  // Retour du 16/09/2026 : "le bouton retour te ramène d'où tu viens, très
  // simplement" -- pas un lien figé vers le Tableau de Bord, mais un simple
  // pointeur vers le panneau réellement affiché juste avant celui-ci. Suivi
  // ici, au même endroit pour toutes les façons d'arriver sur un panneau
  // (menu latéral, mur de rôle, RH, "Gérer les membres"...), plutôt que dans
  // chaque site d'appel séparément.
  if (etat.panneau !== etat.panneauActuelAffiche) etat.panneauPrecedent = etat.panneauActuelAffiche;
  etat.panneauActuelAffiche = etat.panneau;
  // Réinitialisé avant chaque panneau -- seul le Tableau de Bord le remet en
  // plein cadre (retour du 16/09/2026 : jamais une carte posée sur la page).
  document.getElementById('corps').className = 'g-scene';
  if (etat.panneau === 'tableau-de-bord') { await rendreTableauBord(); return; }
  if (etat.panneau === 'hub') { rendreHub(); return; }
  if (etat.panneau === 'rh') { await rendreRH(); return; }
  if (etat.panneau === 'boite-noire') { await rendreBoiteNoire(); return; }
  if (etat.panneau === 'calculateur') { rendreComptabilite(); return; }
  if (etat.panneau === 'conventions') { rendreConventions(); return; }
  // etat.detail peut devenir nul si la négociation active vient d'être
  // supprimée depuis le Tableau de Bord (retour du 16/09/2026) -- dans ce
  // cas précis seulement, on recharge au lieu de planter sur un détail absent.
  if (!etat.detail) { if (etat.negociationId) await chargerNegociation(); return; }
  rendreNegociation();
}

// ---- Conventions & Modèles -- registre statique des documents réels
// (mêmes gardes-fous d'accès que le reste de l'Espace de Travail : jamais
// exposé hors de cet espace protégé). Un nouveau document = une ligne ici.
const CONVENTIONS = [
  { titre: "Convention de Négociation Commerciale & d'Apport d'Affaires — E223",
    sous: "Modibo Traoré (apporteur d'affaires) & Jean Bosco Dakouo (négociateur) — Projet EVOTEX V1 chez BATEX-CI",
    url: "/gestion/conventions/convention-apporteur-affaires.html" },
];

// ---- Espace Commercial -- le vrai hub public (evotex-commercial/index.html
// et ses 4 outils) monté ici EN DIRECT, avec son vrai code (hub.js,
// presentation.js, socle-lancement.js, besoins.js, licences.js, chargés en
// tête de page dans window.Views) -- jamais une iframe, jamais une copie
// (retour du 16/09/2026 : "elle n'a sa place nulle part ailleurs que dans le
// projet... redévelopper les codes pour que la page de négociation les
// puisse directement dans la page"). Page d'atterrissage des négociateurs
// ("le négociateur ne prend que deux pages") ; reste par ailleurs public à
// la racine du site pour qui reçoit le lien (client, partenaire).
function cleVueDepuisHash(hash) {
  if (hash.startsWith('#/socle-lancement')) return 'socle';
  if (hash === '#/presentation') return 'presentation';
  if (hash === '#/expression-besoins') return 'besoins';
  if (hash === '#/licences') return 'licences';
  if (hash === '#/tour-application') return 'tourApplication';
  return 'hub';
}

function montrerVueReelle(containerEl, cleVue) {
  const vue = window.Views && window.Views[cleVue];
  if (!vue) { containerEl.innerHTML = '<div class="g-hint">Contenu introuvable.</div>'; return; }
  containerEl.innerHTML = vue.render();
  if (typeof vue.mount === 'function') vue.mount(containerEl);
}

// Un seul écouteur global (posé une fois au chargement du script) : les vues
// réelles naviguent entre elles via window.location.hash (leur logique
// d'origine, non réécrite) -- on ne réagit que si l'Espace Commercial est
// effectivement affiché, pour ne rien perturber d'autre.
window.addEventListener('hashchange', () => {
  if (etat.panneau === 'hub') {
    const zone = document.getElementById('hub-zone');
    if (zone) montrerVueReelle(zone, cleVueDepuisHash(location.hash));
  }
});

function rendreHub() {
  document.getElementById('verrou-bandeau').innerHTML = '';
  // Même en-tête fixe que Comptabilité/Conventions/Boîte noire -- jamais
  // d'exception à cette règle, même sur une page qui a déjà son propre titre.
  document.getElementById('hero').innerHTML = `<div class="g-hero"><div class="g-hero-titre-simple">${htmlBoutonRetour()}Espace Commercial</div>
    <div class="g-hero-sous">Le vrai hub public EVOTEX -- vos 4 outils de négociation, à consulter ou à envoyer tels quels au client.</div></div>`;
  attacherBoutonRetour();
  document.getElementById('corps').className = 'g-scene -pleine-largeur';
  document.getElementById('corps').innerHTML = '<div id="hub-zone"></div>';
  montrerVueReelle(document.getElementById('hub-zone'), cleVueDepuisHash(location.hash));
}

// ---- RH & Personnel -- retour du 16/09/2026, trois onglets bien distincts
// (revu le même jour après un premier essai à plat, jugé insuffisant) :
// 1. "Membre du personnel" -- le personnel EVOTEX lui-même (Direction, puis
//    tout futur rôle interne non lié à une négociation précise).
// 2. "Équipe de négociation" -- une carte par projet (une négociation EST à
//    la fois son équipe et son projet ici, jamais deux dimensions séparées),
//    équipe complète y compris externes (clients, apporteurs).
// 3. "Vue d'ensemble" -- un simple ANNUAIRE à plat, sans regroupement par
//    projet : deux blocs, Négociateurs puis Personnel. Cliquer un
//    négociateur déplie la ou les négociations où il apparaît (choix direct
//    si plusieurs) -- "on devrait savoir dans quel groupe de négociation il
//    fait partie... et si c'est plusieurs, avoir le choix de cliquer sur
//    celle qu'on veut".
// Objectif explicite du menu entier : lever toute ambiguïté sur qui est qui
// ("Société Alpha Textile -- négociateur, est-ce le client ou un interne
// EVOTEX ?"), donc chaque personne porte un badge Interne/Externe, jamais
// juste un rôle nu. Réutilise etat.tableauBordEquipes (même source que le
// Tableau de Bord et le mur de rôle) -- aucun nouvel endpoint.
const NATURE_ROLE = {
  direction: 'Interne EVOTEX',
  negociateur: 'Interne EVOTEX',
  apporteur: 'Externe -- apporteur d\'affaires',
  client: 'Externe -- client',
  autre: 'Externe',
};
const ONGLETS_RH = [
  { id: 'personnel', label: 'Membre du personnel' },
  { id: 'equipes', label: 'Équipe de négociation' },
  { id: 'ensemble', label: 'Vue d\'ensemble' },
];

async function rendreRH() {
  document.getElementById('verrou-bandeau').innerHTML = '';
  document.getElementById('hero').innerHTML = `<div class="g-hero"><div class="g-hero-titre-simple">${htmlBoutonRetour()}RH & Personnel</div>
    <div class="g-hero-sous">Toutes les personnes de la plateforme -- pour ne plus jamais confondre qui est qui.</div></div>`;
  attacherBoutonRetour();
  document.getElementById('corps').className = 'g-scene';
  document.getElementById('corps').innerHTML = '<div class="g-chargement">Chargement…</div>';
  await rechargerRH();
}

async function rechargerRH() {
  const rep = await api('/api/gestion/tableau-bord');
  if (!rep.ok) { document.getElementById('corps').innerHTML = '<div class="g-erreur">' + escapeHtml(rep.erreur || 'Erreur.') + '</div>'; return; }
  etat.tableauBordEquipes = rep.equipes;
  rafraichirRH();
}

// Regroupe par personne (une seule fiche même si elle apparaît dans
// plusieurs négociations), en gardant la liste de CES négociations --
// nécessaire à l'onglet 3 pour le dépli "dans quel groupe fait-il partie".
function personnesRH(role) {
  const equipes = etat.tableauBordEquipes || [];
  const parId = new Map();
  for (const e of equipes) {
    for (const m of (e.membres || [])) {
      if (!m.actif || m.role !== role) continue;
      if (!parId.has(m.utilisateur_id)) parId.set(m.utilisateur_id, { ...m, negociations: [] });
      parId.get(m.utilisateur_id).negociations.push({ id: e.id, nom: e.nom });
    }
  }
  return Array.from(parId.values());
}

function ligneRH(m, opts = {}) {
  return `<div class="g-item" style="align-items:center">
    <div class="info">
      <b>${escapeHtml(m.nom)}</b>
      <span>${escapeHtml(libelleRole(m.role, m.titre_autre))} -- ${escapeHtml(NATURE_ROLE[m.role] || 'Externe')}</span>
    </div>
    ${opts.action || `<span style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:${estEnLigne(m.dernier_vu) ? '#15803d' : '#7f93ac'}">
      <span style="width:8px;height:8px;border-radius:999px;background:${estEnLigne(m.dernier_vu) ? '#22c55e' : '#c3d6ee'}"></span>
      ${estEnLigne(m.dernier_vu) ? 'En ligne' : (m.dernier_vu ? 'Vu ' + new Date(m.dernier_vu).toLocaleString('fr-FR') : 'Jamais connecté')}
    </span>`}
    ${opts.extra || ''}
  </div>`;
}

// Ligne dépliable de l'onglet "Vue d'ensemble" : clic -> affiche la ou les
// négociations de cette personne, chacune cliquable pour y aller directement.
function ligneRHDepliable(m) {
  const ouverte = String(etat.rhPersonneOuverte) === String(m.utilisateur_id);
  const action = `<button class="g-inline-btn" data-rh-deplier="${m.utilisateur_id}">${ouverte ? 'Masquer' : 'Voir sa négociation'} ${m.negociations.length > 1 ? '(' + m.negociations.length + ')' : ''}</button>`;
  const extra = ouverte ? `<div style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
    ${m.negociations.map(n => `<button class="cc-sous-onglet" data-rh-aller-negociation="${n.id}">${escapeHtml(n.nom)}</button>`).join('')}
  </div>` : '';
  return ligneRH(m, { action, extra });
}

function rafraichirRH() {
  const onglet = etat.rhOnglet || 'personnel';
  const equipes = etat.tableauBordEquipes || [];
  const membresDe = (e) => (e.membres || []).filter(m => m.actif);

  let corps = '';
  if (onglet === 'personnel') {
    const personnel = personnesRH('direction');
    corps = `<div class="g-card"><h2>Membre du personnel</h2>
      <div class="g-hint" style="margin-bottom:10px">Personnel EVOTEX -- pas lié à une négociation précise.</div>
      <div class="g-liste">${personnel.map(m => ligneRH(m)).join('') || '<div class="g-hint">Personne pour l\'instant.</div>'}</div>
    </div>`;
  } else if (onglet === 'equipes') {
    const total = equipes.reduce((n, e) => n + membresDe(e).length, 0);
    corps = `<div class="g-card"><h2>Vue d'ensemble</h2>
        <div class="g-hint">${equipes.length} projet${equipes.length > 1 ? 's' : ''} -- ${total} personne${total > 1 ? 's' : ''} au total.</div>
      </div>
      ${equipes.length === 0 ? '<div class="g-card"><div class="g-hint">Aucun projet pour l\'instant.</div></div>' : equipes.map(e => `
        <div class="g-card">
          <h2>Projet -- ${escapeHtml(e.nom)}</h2>
          <div class="g-hint" style="margin-bottom:10px">Équipe du projet -- ${membresDe(e).length} personne${membresDe(e).length > 1 ? 's' : ''}</div>
          <div class="g-liste">${membresDe(e).map(m => ligneRH(m)).join('')}</div>
        </div>`).join('')}`;
  } else {
    const negociateurs = personnesRH('negociateur');
    const personnel = personnesRH('direction');
    corps = `<div class="g-card"><h2>Négociateurs</h2><div class="g-liste">
        ${negociateurs.map(ligneRHDepliable).join('') || '<div class="g-hint">Aucun négociateur pour l\'instant.</div>'}
      </div></div>
      <div class="g-card"><h2>Personnel</h2><div class="g-liste">
        ${personnel.map(m => ligneRH(m)).join('') || '<div class="g-hint">Personne pour l\'instant.</div>'}
      </div></div>`;
  }

  document.getElementById('corps').innerHTML = `
    <div class="cc-sous-onglets">${ONGLETS_RH.map(o => `<button class="cc-sous-onglet ${onglet === o.id ? '-actif' : ''}" data-rh-onglet="${o.id}">${escapeHtml(o.label)}</button>`).join('')}</div>
    ${corps}
  `;
  attacherEvenementsRH();
}

function attacherEvenementsRH() {
  document.querySelectorAll('[data-rh-onglet]').forEach(btn => {
    btn.addEventListener('click', () => { etat.rhOnglet = btn.dataset.rhOnglet; etat.rhPersonneOuverte = null; rafraichirRH(); });
  });
  document.querySelectorAll('[data-rh-deplier]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.rhDeplier;
      etat.rhPersonneOuverte = String(etat.rhPersonneOuverte) === String(id) ? null : id;
      rafraichirRH();
    });
  });
  document.querySelectorAll('[data-rh-aller-negociation]').forEach(btn => {
    btn.addEventListener('click', async () => {
      etat.negociationId = Number(btn.dataset.rhAllerNegociation);
      etat.voirCommeId = null;
      etat.panneau = 'negociation';
      await chargerNegociation();
      rendreSidebar();
    });
  });
}

// ---- Tableau de Bord -- écran par défaut de la Direction (retour du
// 16/09/2026 : "l'écran par défaut est le tableau de bord. La négociation
// n'est qu'un de mes outils"). Réunit une vue d'ensemble, l'accès aux
// outils, les équipes de négociation (création + gestion des membres), les
// tickets d'accès (créer/prolonger/couper) et la présence de toute
// l'équipe -- jamais celle de la Direction elle-même, jamais visible par
// les négociateurs qui n'ont que leur outil Négociation.
async function rendreTableauBord() {
  document.getElementById('verrou-bandeau').innerHTML = '';
  document.getElementById('hero').innerHTML = `<div class="g-hero"><div class="g-hero-titre-simple">Tableau de Bord</div>
    <div class="g-hero-sous">Espace privé -- visible seulement par vous, ou par qui vous décidez.</div></div>`;
  document.getElementById('corps').className = 'g-scene -pleine-largeur';
  document.getElementById('corps').innerHTML = '<div class="tb-page"><div class="g-chargement" style="color:var(--evx-onDark-secondary)">Chargement…</div></div>';
  await rechargerTableauBord();
}

async function rechargerTableauBord() {
  const rep = await api('/api/gestion/tableau-bord');
  if (!rep.ok) { document.getElementById('corps').innerHTML = '<div class="g-erreur">' + escapeHtml(rep.erreur || 'Erreur.') + '</div>'; return; }
  etat.tableauBordEquipes = rep.equipes;
  rafraichirTableauBord();
}

  const tousMembres = equipes.flatMap(e => e.membres.map(m => ({ ...m, negociationNom: e.nom })))

  const ticketsActifs = equipes.filter(e => e.ticket_expire_le && new Date(e.ticket_expire_le).getTime() > Date.now());

    </div>

    <div class="tb-section-titre"><span>Vos outils</span></div>
    <div class="tb-outils-grille">
      <button class="tb-outil-carte" data-panneau="negociation">
        <div class="tb-outil-icone" style="background:linear-gradient(135deg,#3f96ea,#1c6fd9)"></div>
        <div class="tb-outil-nom">Négociation</div>
        <div class="tb-outil-desc">${equipes.length === 0 ? 'Aucun dossier' : s(equipes.length, 'dossier') + ' en cours'}</div>
      </button>
      <button class="tb-outil-carte" data-panneau="calculateur">
        <div class="tb-outil-icone" style="background:linear-gradient(135deg,#22c55e,#15803d)"></div>
        <div class="tb-outil-nom">Comptabilité</div>
        <div class="tb-outil-desc">Caisse, ventes, dépenses</div>
      </button>
      <button class="tb-outil-carte" data-panneau="conventions">
        <div class="tb-outil-icone" style="background:linear-gradient(135deg,#7f77dd,#3c3489)"></div>
        <div class="tb-outil-nom">Documents</div>
        <div class="tb-outil-desc">${s(CONVENTIONS.length, 'document')}</div>
      </button>
    </div>

    <div class="tb-section-titre"><span>Équipes de Négociation</span><button class="tb-ajouter" id="btn-creer-equipe">+ Créer une équipe</button></div>
    <div class="tb-bloc">
      ${equipes.length === 0 ? '<div class="tb-vide">Aucune négociation pour l\'instant.</div>' : equipes.map(e => `
        <div class="tb-ligne">
          <div><b style="color:#fff">${escapeHtml(e.nom)}</b> <span style="color:#8fa8c7">${s(e.membres.length, 'membre')} -- ${escapeHtml(e.statut_libelle || '')}</span></div>

      ${equipes.length === 0 ? '<div class="tb-vide">Aucune négociation pour l\'instant.</div>' : equipes.map(e => {
        const expireLe = e.ticket_expire_le ? new Date(e.ticket_expire_le).getTime() : 0;

          <div style="display:flex;gap:14px">
            ${actif ? `<button class="tb-lien -danger" data-couper-ticket="${e.id}">Couper</button>` : ''}
            <button class="tb-lien" data-nouveau-ticket="${e.id}">${actif ? 'Prolonger' : 'Réactiver'}</button>
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="tb-section-titre"><span>Présence de l'équipe</span><button class="tb-lien" data-panneau="boite-noire">Historique complet ›</button></div>
    <div class="tb-bloc">
      ${tousMembres.length === 0 ? '<div class="tb-vide">Aucun membre pour l\'instant.</div>' : tousMembres.map(m => `
        <div class="tb-ligne">
          <div><span class="tb-presence-dot ${estEnLigne(m.dernier_vu) ? '-en-ligne' : ''}"></span><b style="color:#fff">${escapeHtml(m.nom)}</b> <span style="color:#8fa8c7">${escapeHtml(libelleRole(m.role, m.titre_autre))} -- ${escapeHtml(m.negociationNom)}</span></div>
          <span style="color:#8fa8c7;font-size:10.5px">${estEnLigne(m.dernier_vu) ? 'En ligne' : (m.dernier_vu ? 'Vu ' + new Date(m.dernier_vu).toLocaleString('fr-FR') : 'Jamais connecté')}</span>
        </div>`).join('')}
    </div>
  </div>`;

  document.getElementById('corps').innerHTML = html;
  attacherEvenementsTableauBord();
}

function attacherEvenementsTableauBord() {
  document.querySelectorAll('#corps [data-panneau]').forEach(btn => {
    btn.addEventListener('click', async () => { etat.panneau = btn.dataset.panneau; await rendrePanneau(); rendreSidebar(); });
  });
  const btnCreer = document.getElementById('btn-creer-equipe');
  if (btnCreer) btnCreer.addEventListener('click', rendreModalCreerEquipe);

  document.querySelectorAll('[data-gerer-equipe]').forEach(btn => btn.addEventListener('click', async () => {
    etat.negociationId = Number(btn.dataset.gererEquipe);
    etat.panneau = 'negociation';
    etat.voirCommeId = null;
    await chargerNegociation();
    rendreSidebar();
  }));

  document.querySelectorAll('[data-couper-ticket]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('Couper cet accès immédiatement ?')) return;
    await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: Number(btn.dataset.couperTicket), action: 'couper_ticket' }) });
    if (etat.ticketsSurveilles) etat.ticketsSurveilles.delete(Number(btn.dataset.couperTicket));
    await rechargerTableauBord();
  }));

  document.querySelectorAll('[data-nouveau-ticket]').forEach(btn => btn.addEventListener('click', () => {
    rendreModalTicket(Number(btn.dataset.nouveauTicket));
  }));

  document.querySelectorAll('[data-supprimer-negociation]').forEach(btn => btn.addEventListener('click', async () => {
    const id = Number(btn.dataset.supprimerNegociation);
    const equipe = (etat.tableauBordEquipes || []).find(e => e.id === id);
    if (!confirm(`Supprimer définitivement "${equipe ? equipe.nom : 'cette négociation'}" ?\n\nCette action est IRRÉVERSIBLE : membres, messages, notes et liens d'accès associés seront perdus.`)) return;
    const rep = await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: id, action: 'supprimer_negociation' }) });
    if (!rep.ok) { alert(rep.erreur || 'Échec.'); return; }
    if (etat.ticketsSurveilles) etat.ticketsSurveilles.delete(id);
    // Négociation active supprimée -- vidée ici, rechargée au prochain
    // passage sur l'onglet Négociation (voir le garde dans rendrePanneau).
    if (String(etat.negociationId) === String(id)) {
      const moi = await api('/api/gestion/me');
      etat.appartenances = moi.ok ? moi.appartenances : etat.appartenances.filter(a => a.negociation_id !== id);
      etat.negociationId = etat.appartenances.find(a => a.role !== 'client')?.negociation_id || null;
      etat.detail = null;
    }
    await rechargerTableauBord();
  }));
}

// Durée libre jour/heure/minute (retour du 16/09/2026 : "champ libre jr h
// minute") -- "couper dès déconnexion" est une surveillance côté navigateur,
// au mieux à la minute près (voir estEnLigne), jamais une vraie promesse
// d'instantanéité serveur.
function rendreModalTicket(negociationId) {
  document.getElementById('modal-zone').innerHTML = `
    <div class="g-modal-fond" id="modal-fond-ticket">
      <div class="g-modal">
        <h3>Ouvrir un ticket d'accès</h3>
        <div class="g-form-row">
          <input id="tk-jours" type="number" min="0" placeholder="Jours" style="width:31%">
          <input id="tk-heures" type="number" min="0" max="23" placeholder="Heures" style="width:31%">
          <input id="tk-minutes" type="number" min="0" max="59" placeholder="Minutes" style="width:31%">
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#1e293b;cursor:pointer;margin-top:4px">
          <input type="checkbox" id="tk-deconnexion"> Couper automatiquement quand plus personne (hors Direction) n'est en ligne
        </label>
        <div class="g-hint">La détection de présence se fait par intervalle de quelques dizaines de secondes -- la coupure suit dans la minute ou deux, jamais à la seconde près. Tant que votre navigateur reste ouvert sur cet espace.</div>
        <div class="g-modal-actions">
          <button class="-annuler" id="btn-annuler-ticket">Annuler</button>
          <button id="btn-confirmer-ticket" style="background:linear-gradient(135deg,#3f96ea,#1c6fd9);border:none;color:#fff;font-weight:800;font-size:12.5px;padding:9px 16px;border-radius:999px;cursor:pointer;font-family:var(--font-body)">Activer</button>
        </div>
      </div>
    </div>`;
  const fermer = () => { document.getElementById('modal-zone').innerHTML = ''; };
  document.getElementById('modal-fond-ticket').addEventListener('click', (e) => { if (e.target.id === 'modal-fond-ticket') fermer(); });
  document.getElementById('btn-annuler-ticket').addEventListener('click', fermer);
  document.getElementById('btn-confirmer-ticket').addEventListener('click', async () => {
    const jours = Number(document.getElementById('tk-jours').value) || 0;
    const heures = Number(document.getElementById('tk-heures').value) || 0;
    const minutes = Number(document.getElementById('tk-minutes').value) || 0;
    const dureeHeures = jours * 24 + heures + minutes / 60;
    if (dureeHeures <= 0) { alert('Indiquez une durée supérieure à zéro.'); return; }
    const surveiller = document.getElementById('tk-deconnexion').checked;
    const rep = await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId, action: 'ouvrir_ticket', dureeHeures }) });
    if (!rep.ok) { alert(rep.erreur || 'Échec.'); return; }
    if (surveiller) {
      if (!etat.ticketsSurveilles) etat.ticketsSurveilles = new Set();
      etat.ticketsSurveilles.add(negociationId);
    }
    fermer();
    await rechargerTableauBord();
  });
}

// Lien d'accès par membre -- distinct du Ticket (retour du 16/09/2026 : "ce
// ticket définit le temps ou la durée des négociations... différente du
// lien envoyé aux membres pour participer, qui peut être permanent ou
// temporaire, et renouvelable -- pas besoin d'en renvoyer un nouveau").
// Suivi par etat.modalInvitationMembreId (voir le garde dans rendreNegociation)
// pour survivre au sondage silencieux de 12s, comme la modale d'ajout de
// membre -- jamais perdre ce que l'écran affiche pendant un re-rendu de fond.
function rendreModalInvitation(utilisateurId) {
  const d = etat.detail;
  const membre = (d.membres || []).find(m => String(m.utilisateur_id) === String(utilisateurId));
  if (!membre) { etat.modalInvitationMembreId = null; document.getElementById('modal-zone').innerHTML = ''; return; }

  const expireLe = membre.invitation_expire_le ? new Date(membre.invitation_expire_le).getTime() : null;
  const aUnLien = !!membre.invitation_jeton;
  const permanent = aUnLien && expireLe === null;
  const valide = aUnLien && (permanent || expireLe > Date.now());
  const lienUrl = aUnLien ? `${location.origin}/api/gestion/rejoindre?jeton=${membre.invitation_jeton}` : '';

  document.getElementById('modal-zone').innerHTML = `
    <div class="g-modal-fond" id="modal-fond-invitation">
      <div class="g-modal">
        <h3>Lien d'accès -- ${escapeHtml(membre.nom)}</h3>
        ${aUnLien ? `
          <div style="font-size:13px;font-weight:800;margin-bottom:4px;color:${valide ? 'var(--evx-blue)' : '#b91c1c'}">${valide ? (permanent ? 'Actif -- permanent' : 'Actif -- ' + formatDuree(expireLe - Date.now()) + ' restant') : 'Coupé / expiré'}</div>
          <div class="g-form-row" style="margin-top:8px">
            <input id="inv-url" type="text" readonly value="${escapeHtml(lienUrl)}" style="flex:1;min-width:180px;background:#f5f9ff;color:#475467">
            <button type="button" id="btn-copier-invitation" class="g-inline-btn">Copier</button>
          </div>
          <div class="g-hint">Ce lien connecte ${escapeHtml(membre.nom)} directement à cette négociation, sans email ni mot de passe. Vous pouvez le renouveler ci-dessous sans le renvoyer -- il ne change pas.</div>
        ` : `<div class="g-hint" style="margin-bottom:4px">Aucun lien généré pour l'instant -- ${escapeHtml(membre.nom)} continue de se connecter avec son email et son mot de passe.</div>`}

        <div style="margin-top:16px;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#94a3b8;font-weight:800">${aUnLien ? 'Renouveler' : 'Générer le lien'}</div>
        <div class="g-form-row">
          <input id="inv-jours" type="number" min="0" placeholder="Jours" style="width:31%">
          <input id="inv-heures" type="number" min="0" max="23" placeholder="Heures" style="width:31%">
          <input id="inv-minutes" type="number" min="0" max="59" placeholder="Minutes" style="width:31%">
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#1e293b;cursor:pointer;margin-top:4px">
          <input type="checkbox" id="inv-permanent"> Lien permanent (sans expiration)
        </label>

        <div class="g-modal-actions">
          ${valide ? `<button class="-annuler" id="btn-couper-invitation" style="color:#b91c1c;border-color:#f3c9c9;margin-right:auto">Couper l'accès</button>` : ''}
          <button class="-annuler" id="btn-fermer-invitation">Fermer</button>
          <button id="btn-confirmer-invitation" style="background:linear-gradient(135deg,#3f96ea,#1c6fd9);border:none;color:#fff;font-weight:800;font-size:12.5px;padding:9px 16px;border-radius:999px;cursor:pointer;font-family:var(--font-body)">${aUnLien ? 'Renouveler' : 'Générer'}</button>
        </div>
      </div>
    </div>`;

  const fermer = () => { etat.modalInvitationMembreId = null; document.getElementById('modal-zone').innerHTML = ''; };
  document.getElementById('modal-fond-invitation').addEventListener('click', (e) => { if (e.target.id === 'modal-fond-invitation') fermer(); });
  document.getElementById('btn-fermer-invitation').addEventListener('click', fermer);

  const champJours = document.getElementById('inv-jours');
  const champHeures = document.getElementById('inv-heures');
  const champMinutes = document.getElementById('inv-minutes');
  document.getElementById('inv-permanent').addEventListener('change', (e) => {
    [champJours, champHeures, champMinutes].forEach(champ => champ.disabled = e.target.checked);
  });

  const btnCopier = document.getElementById('btn-copier-invitation');
  if (btnCopier) btnCopier.addEventListener('click', async () => {
    const champ = document.getElementById('inv-url');
    champ.select();
    try { await navigator.clipboard.writeText(champ.value); } catch { document.execCommand('copy'); }
    btnCopier.textContent = 'Copié ✓';
    setTimeout(() => { if (document.getElementById('btn-copier-invitation')) document.getElementById('btn-copier-invitation').textContent = 'Copier'; }, 1500);
  });

  // Retrouve le membre à jour dans etat.detail au moment d'appliquer une
  // réponse serveur -- jamais la référence "membre" capturée à l'ouverture :
  // le sondage silencieux de 12s remplace etat.detail par un OBJET TOUT
  // NEUF (etat.detail = detail;), donc muter l'ancien "membre" ne se
  // répercuterait sur rien de visible si un sondage est passé entre-temps
  // (bug réel trouvé en testant : un renouvellement réussi côté serveur
  // réapparaissait avec l'ancienne échéance dans la modale).
  const membreActuel = () => (etat.detail.membres || []).find(m => String(m.utilisateur_id) === String(utilisateurId));

  const btnCouper = document.getElementById('btn-couper-invitation');
  if (btnCouper) btnCouper.addEventListener('click', async () => {
    if (!confirm(`Couper l'accès de ${membre.nom} immédiatement ?`)) return;
    const rep = await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: etat.negociationId, action: 'couper_invitation', utilisateurId }) });
    if (!rep.ok) { alert(rep.erreur || 'Échec.'); return; }
    const cible = membreActuel();
    if (cible) cible.invitation_expire_le = rep.expireLe;
    rendreModalInvitation(utilisateurId);
  });

  document.getElementById('btn-confirmer-invitation').addEventListener('click', async () => {
    const permanent = document.getElementById('inv-permanent').checked;
    let dureeHeures = 0;
    if (!permanent) {
      const jours = Number(champJours.value) || 0;
      const heures = Number(champHeures.value) || 0;
      const minutes = Number(champMinutes.value) || 0;
      dureeHeures = jours * 24 + heures + minutes / 60;
      if (dureeHeures <= 0) { alert('Indiquez une durée supérieure à zéro, ou cochez "Lien permanent".'); return; }
    }
    const rep = await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ negociationId: etat.negociationId, action: 'generer_invitation', utilisateurId, dureeHeures }) });
    if (!rep.ok) { alert(rep.erreur || 'Échec.'); return; }
    const cible = membreActuel();
    if (cible) { cible.invitation_jeton = rep.jeton; cible.invitation_expire_le = rep.expireLe; }
    rendreModalInvitation(utilisateurId);
  });
}

// Surveillance "couper dès déconnexion" -- best-effort, voir la note dans
// rendreModalTicket. Ne tourne que pour la Direction, toutes les 60s.
//
// Corrigé le 14/09/2026 (audit du Tableau de Bord) : ne fait plus son propre
// appel à /api/gestion/tableau-bord -- rafraichirMurRoles (toutes les 45s,
// donc plus fréquent) tient déjà etat.tableauBordEquipes à jour ; deux
// sondages indépendants qui retiraient la même donnée à quinze secondes
// d'écart n'avaient aucune raison d'exister. Source unique désormais.
async function verifierSurveillanceTickets() {
  if (!etat.ticketsSurveilles || etat.ticketsSurveilles.size === 0) return;
  const equipes = etat.tableauBordEquipes;
  if (!equipes) return; // pas encore chargé par rafraichirMurRoles -- prochain passage
  let unTicketCoupe = false;
  for (const negociationId of Array.from(etat.ticketsSurveilles)) {
    const equipe = equipes.find(e => e.id === negociationId);
    if (!equipe) { etat.ticketsSurveilles.delete(negociationId); continue; }
    const quelquUnEnLigne = equipe.membres.some(m => m.role !== 'direction' && estEnLigne(m.dernier_vu));
    if (!quelquUnEnLigne) {
      await api('/api/gestion/negociation', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ negociationId, action: 'couper_ticket' }) });
      etat.ticketsSurveilles.delete(negociationId);
      unTicketCoupe = true;
    }
  }
  if (unTicketCoupe) await rafraichirMurRoles();
  else if (etat.panneau === 'tableau-de-bord') rafraichirTableauBord();
}

// ---- Informations légales de la société émettrice, signature & cachet --
// retour du 16/09/2026. Seules les informations RÉELLEMENT connues sont
// pré-remplies (E223, société éditrice d'EVOTEX V1, Bamako, Mali -- Convention
// E223) ; RCCM, NIF, forme juridique, téléphone restent VIDES tant que
// l'utilisateur ne les a pas lui-même renseignés -- jamais inventés sur un
// document à valeur légale. Persisté dans ce navigateur (localStorage),
// contrairement au reste de la Comptabilité, car ça ne change presque jamais.
const CLE_INFOS_ENTREPRISE = 'evx_facture_infos_entreprise';
const CLE_SIGNATURE = 'evx_facture_signature';
const CLE_CACHET = 'evx_facture_cachet';
function chargerInfosEntreprise() {
  try {
    const brut = localStorage.getItem(CLE_INFOS_ENTREPRISE);
    if (brut) return JSON.parse(brut);
  } catch {}
  return { nom: 'E223', formeJuridique: '', adresse: 'Bamako, Mali', rccm: '', nif: '', telephone: '', email: 'evolutis223@gmail.com', compteBancaire: '' };
}
function sauverInfosEntreprise(infos) {

// Codification clients & factures -- retour du 16/09/2026 : "ne commence
// jamais par 001... un numéro aléatoire, mais assez complexe et mélangé".
// Alphabet sans 0/O/1/I pour ne jamais confondre un caractère à la lecture.
const CARACTERES_CODE = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genererCode(prefixe) {
  let s = '';
  for (let i = 0; i < 8; i++) s += CARACTERES_CODE[Math.floor(Math.random() * CARACTERES_CODE.length)];
  return `${prefixe}-${s.slice(0, 4)}-${s.slice(4)}`;
}
function genererCodeUnique(prefixe, existants) {
  let code;
  do { code = genererCode(prefixe); } while (existants.includes(code));
  return code;
}

function calculerCompta() {
  const s = etatCompta;
  const salaireDevTotal = s.salaireDev * s.duree;
  const salaireFondateurTotal = s.salaireFondateur * s.duree;
  const loyerTotal = s.loyer * s.duree;
  const internetTotal = s.internet * s.duree;
  const hebergementTotal = s.hebergement * s.duree;
  const fraisMissionTotal = s.fraisMission * s.duree;
  const assuranceTotal = s.assurance * s.duree;
  const communicationTotal = s.communication * s.duree;
  const maintenanceTotal = s.maintenance * s.duree;
  const claudeTotal = s.claudeUsd * s.tauxChange * s.duree;
  const extraRecurrentTotal = s.extraRecurrentes.reduce((sum, c) => sum + (c.amount || 0) * s.duree, 0);
  const totalRecurrent = salaireDevTotal + salaireFondateurTotal + loyerTotal + internetTotal + hebergementTotal + fraisMissionTotal + assuranceTotal + communicationTotal + maintenanceTotal + claudeTotal + extraRecurrentTotal;

  const pcTotal = s.pcPrix * s.pcQte;
  const extraUniqueTotal = s.extraUniques.reduce((sum, c) => sum + (c.amount || 0), 0);
  const totalUnique = s.amenagement + pcTotal + s.domaineSSL + s.missionCdc + extraUniqueTotal;

  const extraFormationTotal = s.extraFormation.reduce((sum, c) => sum + (c.amount || 0), 0);
  const totalFormation = s.formationForfait + s.formationSupport + extraFormationTotal;

  const sousTotal = totalRecurrent + totalUnique + totalFormation;
  const imprevusMontant = sousTotal * (s.imprevus / 100);
  const coutTotal = sousTotal + imprevusMontant;

  const suiviTotal = s.suiviTarif * s.suiviDuree;
  const deployUtilisateursTotal = s.deployPrixUtilisateur * s.deployNbUtilisateurs;
  const deployModulesTotal = s.deployModules.reduce((sum, m) => sum + (m.amount || 0), 0);
  const totaleSuiviTotal = s.totaleSuiviTarif * s.totaleSuiviDuree;
  const totaleUtilisateursTotal = s.totalePrixUtilisateur * s.totaleNbUtilisateurs;
  const totaleModulesTotal = s.totaleModules.reduce((sum, m) => sum + (m.amount || 0), 0);
  const saasAbonnementTotal = s.saasAbonnement * s.saasDuree;
  const saasLicenceTotal = s.saasLicence * s.saasAnnees;
  const saasUtilisateursTotal = s.saasPrixUtilisateur * s.saasNbUtilisateurs;
  const modulesTotal = s.saasModules.reduce((sum, m) => sum + (m.amount || 0), 0);

  let revenuTotal;
  if (s.mode === 'deploiement') revenuTotal = s.prixDeploiement + suiviTotal + deployUtilisateursTotal + deployModulesTotal;
  else if (s.mode === 'totale') revenuTotal = s.prixCession + totaleSuiviTotal + totaleUtilisateursTotal + totaleModulesTotal;
  else revenuTotal = s.saasDeploiement + saasAbonnementTotal + saasLicenceTotal + saasUtilisateursTotal + modulesTotal;

  const cfg = champsMode(s.mode);
  const commissionsTotal = s[cfg.commissions].reduce((sum, com) =>
    sum + (com.type === 'pct' ? revenuTotal * ((com.value || 0) / 100) : (com.value || 0)), 0);
  const tvaActive = s[cfg.tvaActive];
  const tvaTaux = s[cfg.tvaTaux];
  const tvaMontant = tvaActive ? revenuTotal * (tvaTaux / 100) : 0;
  const totalTTC = revenuTotal + tvaMontant;

  const beneficeBrut = revenuTotal - coutTotal;
  const beneficeNet = beneficeBrut - commissionsTotal;
  const margePct = revenuTotal > 0 ? (beneficeNet / revenuTotal * 100).toFixed(1) : '0.0';
  const margeViseeBornee = Math.min(s.margeVisee, 99.9);
  const prixSuggere = margeViseeBornee < 100 ? coutTotal / (1 - margeViseeBornee / 100) : 0;

  return { salaireDevTotal, salaireFondateurTotal, loyerTotal, internetTotal, hebergementTotal, fraisMissionTotal,
    assuranceTotal, communicationTotal, maintenanceTotal, claudeTotal, totalRecurrent, pcTotal, totalUnique,
    totalFormation, sousTotal, imprevusMontant, coutTotal, suiviTotal, deployUtilisateursTotal,
    deployModulesTotal, totaleSuiviTotal, totaleUtilisateursTotal, totaleModulesTotal, saasAbonnementTotal,
    saasLicenceTotal, saasUtilisateursTotal, modulesTotal, revenuTotal, commissionsTotal, tvaActive, tvaTaux,
    tvaMontant, totalTTC, beneficeBrut, beneficeNet, margePct, prixSuggere };
}

function rendreTva(mode, c) {

  // (le revenu HT ci-dessus) est répétée en toutes lettres, jamais sous-entendue.
  let resultat;
  if (!c.tvaActive) {
    resultat = `<div class="g-hint" style="margin-top:8px">Décochée : le prix de vente reste hors taxes, aucune TVA n'est ajoutée nulle part.</div>`;

  } else {

  }

    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">

      <span class="cc-b" style="font-size:12.5px;color:#64748b">%</span>

  </div>`;
}

// Tout part du produit vendu : ces totaux sont les seuls qui nourrissent la
// Caisse et l'en-tête (retour du 16/09/2026 : "si on ne vend pas, qu'est-ce
// qu'on calcule ?"). Le Calculateur n'y participe jamais.
function totalMasseSalariale() { return etatCompta.employes.reduce((t, e) => t + parseN(e.salaire), 0); }
function totalDepensesReelles() {
  const s = etatCompta;
  const fixes = s.chargesFixes.reduce((t, c) => t + parseN(c.montant), 0);
  const journalieres = s.depensesJournalieres.reduce((t, d) => t + parseN(d.montant), 0);
  return fixes + journalieres;
}
// Une proposition (pro forma) précède la vente et ne pèse sur aucun total
// réel -- retour du 16/09/2026 : "la proposition financière est faite avant
// la vente... ça ne vient pas après". Seules les ventes confirmées comptent.
function ventesConfirmees() { return etatCompta.ventes.filter(v => v.statut === 'confirmee'); }
function tousLesVersements() { return ventesConfirmees().flatMap(v => v.versements); }
function toutesLesEcheances() { return ventesConfirmees().flatMap(v => v.echeances.map(e => ({ ...e, venteId: v.id }))); }
function totalEncaisse() { return tousLesVersements().reduce((t, v) => t + parseN(v.montant), 0); }
function totalCoutsImprevus() { return ventesConfirmees().flatMap(v => v.coutsImprevus).reduce((t, c) => t + parseN(c.montant), 0); }
function resteAPercevoirVente(v) {
  const verse = v.versements.reduce((t, x) => t + parseN(x.montant), 0);
  return parseN(v.prixConvenu) - verse;
}
function totalResteAPercevoir() { return ventesConfirmees().reduce((t, v) => t + resteAPercevoirVente(v), 0); }
function tvaCalc(vente, baseHT) {
  const taux = parseN(vente.tvaTaux);
  const montant = vente.tvaActive ? baseHT * (taux / 100) : 0;
  return { montant, total: baseHT + montant };
}
function prochaineEcheanceLibelle() {
  const dates = toutesLesEcheances().map(e => e.date).filter(Boolean).sort();
  if (dates.length === 0) return 'Aucune';
  const d = new Date(dates[0] + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function totauxCaisse() {
  const depense = totalMasseSalariale() + totalDepensesReelles() + totalCoutsImprevus();
  const encaisse = totalEncaisse();
  return { encaisse, depense, solde: encaisse - depense };
}
function actualiserKpiEnTete() {
  const { encaisse, depense, solde } = totauxCaisse();
  const elSolde = document.getElementById('kpi-solde-caisse'); if (elSolde) elSolde.textContent = fmtN(solde) + ' F';
  const elEnc = document.getElementById('kpi-encaisse'); if (elEnc) elEnc.textContent = fmtN(encaisse) + ' F';
  const elDep = document.getElementById('kpi-depense'); if (elDep) elDep.textContent = fmtN(depense) + ' F';
  const elReste = document.getElementById('kpi-reste'); if (elReste) elReste.textContent = fmtN(totalResteAPercevoir()) + ' F';
  const elEch = document.getElementById('kpi-echeance'); if (elEch) elEch.textContent = prochaineEcheanceLibelle();
}

// Sélecteur de période global (retour du 16/09/2026) -- filtre les
// événements DATÉS (dépenses journalières, versements) ; les charges fixes
// et la masse salariale RH restent des montants mensuels courants, non
// prorata-isés ici.
const PERIODES_COMPTA = [{ id: 'jour', libelle: 'Jour' }, { id: 'semaine', libelle: 'Semaine' }, { id: 'mois', libelle: 'Mois' }, { id: 'annee', libelle: 'Année' }];
function dansPeriode(dateStr, periode) {
  if (!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  if (periode === 'jour') return d.toDateString() === now.toDateString();
  if (periode === 'semaine') {
    const debut = new Date(now); debut.setHours(0, 0, 0, 0); debut.setDate(now.getDate() - now.getDay());
    const fin = new Date(debut); fin.setDate(debut.getDate() + 7);
    return d >= debut && d < fin;
  }
  if (periode === 'mois') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  return d.getFullYear() === now.getFullYear();
}
function trancheEcheance(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const diffJours = Math.round((d - now) / 86400000);
  if (diffJours < 0) return { label: 'En retard', classe: '-retard' };
  if (diffJours <= 30) return { label: '≤ 30 j', classe: '-proche' };
  if (diffJours <= 60) return { label: '31-60 j', classe: '-moyen' };
  return { label: '> 60 j', classe: '-loin' };
}

  const CHAMPS_TEXTE_PRODUIT = new Set(['label', 'nom', 'justification', 'type', 'commissionType']);

  corps.querySelectorAll('[data-choisir-produit]').forEach(btn => btn.addEventListener('click', () => {
    etatCompta.produitOuvert = btn.dataset.choisirProduit;
    rafraichirProduits();
  }));

  corps.querySelectorAll('[data-produit][data-champ]').forEach(input => {
    const evenement = input.tagName === 'SELECT' ? 'change' : 'input';
    input.addEventListener(evenement, () => {
      const produit = etatCompta.produits.find(x => x.id === input.dataset.produit);
      if (!produit) return;
      const champ = input.dataset.champ;
      const brut = CHAMPS_TEXTE_PRODUIT.has(champ) ? input.value : parseN(input.value);
      if (input.dataset.liste) {
        const item = produit[input.dataset.liste].find(x => String(x.id) === input.dataset.id);
        if (item) item[champ] = brut;
      } else if (champ === 'prixVente' || champ === 'margeViseePct') {
        // Prix et marge s'ajustent l'un l'autre (retour du 16/09/2026) : fixer
        // le prix calcule la marge qu'il donne, viser une marge calcule le
        // prix qui la garantit -- jamais les deux à saisir séparément.
        const coutTotal = produit.couts.reduce((t, c) => t + parseN(c.montant), 0);
        if (champ === 'prixVente') {
          produit.prixVente = brut;
          produit.margeViseePct = brut > 0 ? Number(((brut - coutTotal) / brut * 100).toFixed(1)) : 0;
        } else {
          produit.margeViseePct = brut;
          const m = Math.min(brut, 99.9);
          produit.prixVente = m < 100 ? Math.round(coutTotal / (1 - m / 100)) : produit.prixVente;
        }
      } else {
        produit[champ] = brut;
      }
      rafraichirProduits();
    });
  });

  corps.querySelectorAll('[data-produit][data-ajouter-liste-produit]').forEach(btn => btn.addEventListener('click', () => {
    const produit = etatCompta.produits.find(x => x.id === btn.dataset.produit);
    const liste = btn.dataset.ajouterListeProduit;
    if (liste === 'couts') produit.couts.push({ id: produit.nextCoutId++, label: 'Nouveau coût', montant: 0 });
    if (liste === 'commissions') produit.commissions.push({ id: produit.nextCommId++, label: 'Nouvelle commission', justification: '', type: 'pct', value: 0 });
    if (liste === 'formations') produit.formations.push({ id: produit.nextFormationId++, nom: 'Nouvelle formation', prix: 0, commissionType: 'pct', commissionValue: 0 });
    rafraichirProduits();
  }));

  corps.querySelectorAll('[data-produit][data-liste-retirer-produit]').forEach(btn => btn.addEventListener('click', () => {
    const produit = etatCompta.produits.find(x => x.id === btn.dataset.produit);
    const liste = btn.dataset.listeRetirerProduit;
    produit[liste] = produit[liste].filter(x => String(x.id) !== btn.dataset.id);
    rafraichirProduits();
  }));
}

const LIBELLE_TYPE_FACTURE = { proforma: 'Pro Forma', facture: 'Facture', acompte: "Facture d'acompte", recu: 'Reçu' };

// Une vente naît "proposition" (Pro Forma seule possible) et devient
// "confirmee" (versements, échéances, coûts imprévus, Facture/Acompte/Reçu)
// une fois validée -- retour du 16/09/2026 : "la proposition financière est
// faite avant la vente... la facture peut venir directement [après]".
function htmlVenteCarte(v) {
  const s = etatCompta;
  const produit = s.produits.find(p => p.id === v.produitId);
  const client = s.clients.find(c => c.id === v.clientId);
  const estProposition = v.statut === 'proposition';
  const baseHT = parseN(v.prixConvenu);
  const tva = tvaCalc(v, baseHT);

  let html = `<div class="cc-vente-carte ${estProposition ? '-proposition' : ''}">
    <div class="cc-vente-entete">
      <div>
        <div class="cc-vente-nom">${escapeHtml(client ? client.nom : '')} <span class="cc-client-badge">${client ? client.code : ''}</span></div>
        <div class="g-hint" style="margin-top:2px">${escapeHtml(produit ? produit.nom : '')}${estProposition ? ' -- <b style="color:#9a5b1e">proposition non confirmée</b>' : ''}</div>
      </div>
      <button class="cc-remove" data-liste-retirer-vente-racine="${v.id}" title="Retirer" style="font-size:20px">×</button>
    </div>

    <div class="g-hint" style="margin:0 0 14px;padding:9px 12px;background:#f5f9ff;border:1px dashed #bcd6ef;border-radius:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:6px;font-weight:700;color:#1e293b;cursor:pointer">
        <input type="checkbox" data-vente="${v.id}" data-champ-bool-vente="tvaActive" ${v.tvaActive ? 'checked' : ''}> TVA sur les documents de cette vente
      </label>
      <input class="cc-input" style="width:55px" data-vente="${v.id}" data-champ="tvaTaux" value="${v.tvaTaux}">
      <span>%</span>
      ${v.tvaActive ? `<span style="margin-left:auto;color:#475467">TVA = ${v.tvaTaux}% de ${fmtN(baseHT)} F = <b>${fmtN(tva.montant)} F</b> -- Total TTC : <b style="color:#1c6fd9">${fmtN(tva.total)} F</b></span>` : ''}
    </div>`;

  if (estProposition) {
    html += `<div class="cc-kpi-grille" style="grid-template-columns:1fr;margin-bottom:14px">${kpiCompta('Prix proposé (HT)', fmtN(v.prixConvenu) + ' F')}</div>`;
  } else {
    const verse = v.versements.reduce((t, x) => t + parseN(x.montant), 0);
    const reste = baseHT - verse;
    html += `<div class="cc-kpi-grille" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
      ${kpiCompta('Prix convenu (HT)', fmtN(v.prixConvenu) + ' F')}
      ${kpiCompta('Déjà versé', fmtN(verse) + ' F')}
      ${kpiCompta('Reste à percevoir', fmtN(reste) + ' F', reste > 0 ? { classe: '-attention' } : {})}
    </div>`;
  }

  html += `<div class="cc-facture-section">
    <div class="cc-vente-sous-titre" style="margin-top:0">Facturation</div>`;
  if (estProposition) {
    html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="cc-add" style="margin-top:0" data-generer-facture="${v.id}" data-type-facture="proforma">Aperçu de la Pro Forma</button>
      <button class="cc-add" style="margin-top:0;border-color:#22c55e;color:#15803d" data-confirmer-vente="${v.id}">✓ Confirmer la vente</button>
    </div>
    <div class="g-hint" style="margin-top:0">Tant que la vente n'est pas confirmée : pas de versement, d'échéance ni de facture définitive -- seule la Pro Forma est possible.</div>`;
  } else {
    html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="cc-add" style="margin-top:0" data-generer-facture="${v.id}" data-type-facture="facture">Aperçu de la Facture</button>

    html += `<div class="cc-ledger">${v.factures.map(f => `
      <div class="cc-ledger-ligne" style="cursor:pointer" data-voir-facture="${v.id}" data-facture-id="${f.id}">
        <span>${LIBELLE_TYPE_FACTURE[f.type]} -- <span class="cc-client-badge" style="color:#1c6fd9;border-color:#bcd6ef">${f.code}</span></span>
        <span style="color:#64748b">${new Date(f.date + 'T00:00:00').toLocaleDateString('fr-FR')}</span>
      </div>`).join('')}</div>`;
  }
  html += `</div>`;

  if (!estProposition) {
    const coutsImp = v.coutsImprevus.reduce((t, x) => t + parseN(x.montant), 0);
    html += `
    <div class="cc-vente-sous-titre">Versements reçus</div>

      const tranche = trancheEcheance(ec.date || new Date().toISOString().slice(0, 10));
      return `
      <div class="cc-ledger-ligne">
        <input class="cc-input" style="max-width:140px;flex-shrink:0" type="date" data-vente="${v.id}" data-liste="echeances" data-id="${ec.id}" data-champ="date" value="${ec.date || ''}">
        <input class="cc-labelin" style="flex:1" data-vente="${v.id}" data-liste="echeances" data-id="${ec.id}" data-champ="motif" value="${escapeHtml(ec.motif)}" placeholder="Ex. Solde à la livraison">
        <input class="cc-input" style="max-width:120px" data-vente="${v.id}" data-liste="echeances" data-id="${ec.id}" data-champ="montant" value="${ec.montant === 0 ? '' : fmtN(ec.montant)}" placeholder="Ex. 500 000">
        <span class="cc-tranche ${tranche.classe}">${tranche.label}</span>

    <button class="cc-add" data-vente="${v.id}" data-ajouter-liste-vente="echeances">+ Ajouter une échéance</button>

    <div class="cc-vente-sous-titre">Coûts imprévus liés à cette vente</div>
    <div class="g-hint" style="margin-top:0;margin-bottom:8px">Un imprévu propre à ce client après la vente -- jamais confondu avec le coût de fabrication générique du produit.</div>
    ${v.coutsImprevus.length === 0 ? '<div class="cc-ledger-vide">Aucun coût imprévu pour l\'instant.</div>' : `<div class="cc-ledger">${v.coutsImprevus.map(ci => `
      <div class="cc-ledger-ligne">
        <input class="cc-labelin" style="flex:1" data-vente="${v.id}" data-liste="coutsImprevus" data-id="${ci.id}" data-champ="motif" value="${escapeHtml(ci.motif)}" placeholder="Ex. Correction développement -- un mois">
        <input class="cc-input" style="max-width:120px" data-vente="${v.id}" data-liste="coutsImprevus" data-id="${ci.id}" data-champ="montant" value="${ci.montant === 0 ? '' : fmtN(ci.montant)}" placeholder="Ex. 200 000">
        <button class="cc-remove" data-vente="${v.id}" data-liste-retirer-vente="coutsImprevus" data-id="${ci.id}">×</button>
      </div>`).join('')}</div>`}

    ${coutsImp > 0 ? `<div class="cc-section-total" style="margin-top:10px"><span class="lbl">Total coûts imprévus</span><span class="val" style="color:#dc2626">${fmtN(coutsImp)} F</span></div>` : ''}`;
  }

  html += `</div>`;
  return html;
}

function attacherEvenementsVentes() {
  const corps = document.getElementById('cc-stage');
  const CHAMPS_TEXTE_VENTE = new Set(['motif', 'date']);

  corps.querySelectorAll('[data-vente][data-champ]').forEach(input => {
    const evenement = input.tagName === 'SELECT' ? 'change' : 'input';
    input.addEventListener(evenement, () => {
      const vente = etatCompta.ventes.find(x => String(x.id) === input.dataset.vente);
      if (!vente) return;
      const champ = input.dataset.champ;
      const brut = CHAMPS_TEXTE_VENTE.has(champ) ? input.value : parseN(input.value);
      if (input.dataset.liste) {
        const item = vente[input.dataset.liste].find(x => String(x.id) === input.dataset.id);
        if (item) item[champ] = brut;
      } else {
        vente[champ] = brut;
      }
      rafraichirClients();
      actualiserKpiEnTete();
    });
  });

  corps.querySelectorAll('[data-vente][data-champ-bool-vente]').forEach(input => input.addEventListener('change', () => {
    const vente = etatCompta.ventes.find(x => String(x.id) === input.dataset.vente);
    vente[input.dataset.champBoolVente] = input.checked;
    rafraichirClients();
  }));

  corps.querySelectorAll('[data-vente][data-ajouter-liste-vente]').forEach(btn => btn.addEventListener('click', () => {
    const vente = etatCompta.ventes.find(x => String(x.id) === btn.dataset.vente);
    const liste = btn.dataset.ajouterListeVente;
    const today = new Date().toISOString().slice(0, 10);
    if (liste === 'versements') vente.versements.push({ id: vente.nextVersementId++, motif: 'Nouveau versement', montant: 0, date: today });
    if (liste === 'echeances') vente.echeances.push({ id: vente.nextEcheanceId++, motif: 'Nouvelle échéance', montant: 0, date: today });
    if (liste === 'coutsImprevus') vente.coutsImprevus.push({ id: vente.nextCoutImprevuId++, motif: 'Nouveau coût imprévu', montant: 0 });
    rafraichirClients();
    actualiserKpiEnTete();
  }));

  corps.querySelectorAll('[data-vente][data-liste-retirer-vente]').forEach(btn => btn.addEventListener('click', () => {
    const vente = etatCompta.ventes.find(x => String(x.id) === btn.dataset.vente);
    const liste = btn.dataset.listeRetirerVente;
    vente[liste] = vente[liste].filter(x => String(x.id) !== btn.dataset.id);
    rafraichirClients();
    actualiserKpiEnTete();
  }));

  corps.querySelectorAll('[data-liste-retirer-vente-racine]').forEach(btn => btn.addEventListener('click', () => {
    if (!confirm('Retirer cette vente et tout son historique ?')) return;
    etatCompta.ventes = etatCompta.ventes.filter(x => String(x.id) !== btn.dataset.listeRetirerVenteRacine);
    rafraichirClients();
    actualiserKpiEnTete();
  }));

  corps.querySelectorAll('[data-confirmer-vente]').forEach(btn => btn.addEventListener('click', () => {
    const vente = etatCompta.ventes.find(x => String(x.id) === btn.dataset.confirmerVente);
    vente.statut = 'confirmee';
    rafraichirClients();
    actualiserKpiEnTete();
  }));

  corps.querySelectorAll('[data-generer-facture]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    apercuFacture(btn.dataset.genererFacture, btn.dataset.typeFacture, btn.dataset.versementId || null);
  }));

  corps.querySelectorAll('[data-voir-facture]').forEach(el => el.addEventListener('click', () => {
    ouvrirVueFacture(el.dataset.voirFacture, el.dataset.factureId);
  }));
}

// La fiche reprend le prix du produit choisi comme point de départ
// (négociable ensuite) -- jamais une ligne vide insérée directement. Le
// client est retrouvé par son nom (même code, jamais un doublon) ou créé
// avec un nouveau code -- retour du 16/09/2026 : "un numéro aléatoire, mais

function rendreModalAjoutVente() {
  const s = etatCompta;
  document.getElementById('modal-zone').innerHTML = `
    <div class="g-modal-fond" id="modal-fond-vente">
      <div class="g-modal">
        <h3>Nouvelle proposition</h3>
        <div class="g-form-row">
          <input id="vt-client" type="text" placeholder="Nom du client" list="liste-clients-existants">
          <datalist id="liste-clients-existants">${s.clients.map(c => `<option value="${escapeHtml(c.nom)}">`).join('')}</datalist>
          <select id="vt-produit">
            ${s.produits.map(p => `<option value="${p.id}">${escapeHtml(p.nom)}</option>`).join('')}
          </select>
          <input id="vt-prix" type="text" placeholder="Prix proposé HT (F)">
        </div>
        <div class="g-hint">Le prix est repris du produit choisi -- modifiable si négocié. Une proposition n'est pas encore une vente confirmée : seule une Pro Forma peut en être tirée, jusqu'à confirmation.</div>
